# Plantilla del kit de desarrollo (plugin Memoria 1.27). Se copia como .github/workflows/pruebas-aceptacion.yml del
# repositorio, se rellenan ACEPTACION, ACTIVAS y PRUEBA con lo que dice «Pruebas de aceptación» del CLAUDE.md, se completa
# el paso «Prepara el entorno» y se marca como obligatorio en la regla de la rama principal el check «pruebas de
# aceptación» (R2 de la configuración). Decisión tecnologia/metodologia-desarrollo#2026-11-19-7.
#
# - Un pull request no cambia las pruebas de aceptación y código a la vez: los escenarios entran en su propio pull request.
# - Las pruebas de una pieza cuentan desde que el pull request de la pieza añade su identificador a ACTIVAS, un archivo
#   fuera de la carpeta: desde entonces tienen que pasar en cada pull request.
# - Un pull request de escenarios («Escenarios · P01») se une en verde si las pruebas de sus piezas aún no activas fallan,
#   que es lo que tiene que pasar antes de construirlas.
# - Este archivo va en su propio pull request («Kit · »), sin código: en un pull request corre la versión que trae.
#   Mientras la carpeta no exista, pasa: el kit se monta en cualquier orden.
# Quien acepta une o aprueba por escrito cada pull request que toca las pruebas o este workflow; si es otra persona, lo
# exige un CODEOWNERS (configuración, R2).
name: pruebas de aceptación
on:
  pull_request:
env:
  ACEPTACION: tests/aceptacion                 # la carpeta de las pruebas de aceptación
  ACTIVAS: .github/piezas-activas.txt          # una pieza por línea (P01): sus pruebas ya cuentan
  PRUEBA: pytest tests/aceptacion -k {pieza}   # cómo se corren las pruebas de una pieza; {pieza} es su identificador
jobs:
  aparte:
    name: pruebas de aceptación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Las pruebas de aceptación van en su propio pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          carpeta="$ACEPTACION"
          while [[ "$carpeta" == ./* ]]; do carpeta="${carpeta#./}"; done
          carpeta="$(printf '%s' "$carpeta" | tr -s '/')"; carpeta="${carpeta%/}/"
          este="${GITHUB_WORKFLOW_REF%@*}"; este="${este#*/*/}"
          [ -n "$este" ] || este=".github/workflows/pruebas-aceptacion.yml"
          tipo() { git cat-file -t "$1:${carpeta%/}" 2>/dev/null || true; }
          if [ "$carpeta" = "/" ] || { [ -n "$(tipo "$HEAD")" ] && [ "$(tipo "$HEAD")" != tree ]; }; then
            echo "::error::ACEPTACION («$ACEPTACION») no es una carpeta: ponla igual que «Pruebas de aceptación» del CLAUDE.md."
            exit 1
          fi
          if [ -z "$(tipo "$HEAD")" ]; then
            if [ "$(tipo "$BASE")" = tree ]; then
              echo "::error::Este pull request quita o mueve la carpeta de las pruebas de aceptación ($carpeta)."
              exit 1
            fi
            echo "Todavía no hay pruebas de aceptación en $carpeta: no hay nada que proteger."
            exit 0
          fi
          git -c core.quotepath=off diff --name-only --no-renames -z "$BASE...$HEAD" > "$RUNNER_TEMP/cambios" || exit 1
          dentro=0; fuera=0; kit=0; workflow=0
          while IFS= read -r -d '' f; do
            if [[ "$f" == "$carpeta"* ]]; then dentro=$((dentro + 1))
            elif [ "$f" = "$este" ] || [ "$f" = "CLAUDE.md" ]; then kit=$((kit + 1)); [ "$f" = "$este" ] && workflow=1
            else fuera=$((fuera + 1)); fi
          done < "$RUNNER_TEMP/cambios"
          echo "Cambian $dentro archivos de $carpeta, $kit del kit y $fuera fuera."
          if [ "$workflow" = 1 ] && [ "$fuera" -gt 0 ]; then
            echo "::error::Este pull request cambia $este junto con código: va en su propio pull request («Kit · »)."
            exit 1
          fi
          if [ "$dentro" -gt 0 ] && [ "$fuera" -gt 0 ]; then
            echo "::error::Este pull request cambia las pruebas de aceptación ($carpeta) y código fuera de ellas. Los escenarios van en su propio pull request; el de la pieza no los toca."
            exit 1
          fi
      - name: Prepara el entorno
        run: |
          # lo rellena el repositorio: instalar lo que necesitan las pruebas (p. ej. pip install -r requirements.txt)
          true
      - name: Pasan las pruebas de las piezas activas, y fallan las de un pull request de escenarios
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          [ -d "$ACEPTACION" ] || { echo "Todavía no hay pruebas de aceptación."; exit 0; }
          ident='^[A-Za-z]+[0-9]+$'
          correr() { local c="${PRUEBA//\{pieza\}/$1}"; bash -c "$c"; }
          activas=" "
          if [ -f "$ACTIVAS" ]; then
            while IFS= read -r p || [ -n "$p" ]; do
              p="${p%%#*}"; p="${p//[[:space:]]/}"
              [ -z "$p" ] && continue
              [[ "$p" =~ $ident ]] || { echo "::error::$ACTIVAS: «$p» no es un identificador de pieza."; exit 1; }
              activas="$activas$p "
              echo "== $p (activa): sus pruebas tienen que pasar"
              correr "$p" || { echo "::error::Las pruebas de aceptación de $p, que ya cuenta, no pasan."; exit 1; }
            done < "$ACTIVAS"
          fi
          if [[ "$TITULO" == "Escenarios · "* ]]; then
            resto="${TITULO#Escenarios · }"; resto="${resto%% · *}"
            IFS='+' read -r -a piezas <<< "$resto"
            for p in "${piezas[@]}"; do
              p="${p//[[:space:]]/}"
              [[ "$p" =~ $ident ]] || { echo "::error::El título no dice qué pieza («Escenarios · P01»)."; exit 1; }
              [[ "$activas" == *" $p "* ]] && continue
              echo "== $p (escenarios nuevos): sus pruebas tienen que fallar"
              if correr "$p"; then echo "::error::Las pruebas nuevas de $p ya pasan antes de construir la pieza: no comprueban lo que piden sus escenarios."; exit 1; fi
            done
          fi
