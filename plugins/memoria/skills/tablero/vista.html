        <tr><td>${F("añade a [nombre] con [correo] como colaborador de este proyecto")}</td><td>Solo el responsable del área, en una sesión del proyecto: esa persona escribe en ese proyecto y en ningún otro.</td></tr>
        <tr><td>${F("arranca un proyecto para…")}</td><td>Crea la carpeta del proyecto con todas sus piezas. Pide antes un responsable con nombre y apellido.</td></tr>
        <tr><td>${F("cierra el proyecto")}</td><td>Comprueba que está terminado y lo deja cerrado. No borra nada.</td></tr>
        <tr><td>${F("¿cómo va el área X?")}<br>${F("cuestiona el área")}</td><td>El director del área: su estatus, lo que pide atención y lo que no cuadra.</td></tr>
        <tr><td>${F("revisión de calidad de X")}<br>${F("audita la carpeta")}</td><td>Revisa a fondo un proyecto, un documento, un desarrollo o la carpeta entera contra su objetivo, y entrega lo que no cuadra, comprobado.</td></tr>
        <tr><td>${F("quiero cuestionar…")}</td><td>Deja escrito qué no cuadra de una decisión o una premisa, para que su responsable responda.</td></tr>
        <tr><td>${F("lo mantengo, porque…")}<br>${F("lo cambio: …")}</td><td>Responde a un cuestionamiento abierto a tu proyecto. Queda como decisión al cerrar y el cuestionamiento se cierra.</td></tr>
        <tr><td>${F("registra como premisa que…")}<br>${F("la premisa P2 cambia a…")}</td><td>Solo el responsable del contexto: escribe la premisa que la dirección confirmó, o la que reemplaza a otra.</td></tr>
        <tr><td>${F("sincroniza el tablero")}</td><td>Pone el tablero al día ahora, con lo que otras personas hayan escrito.</td></tr>
        <tr><td>${F("ordena Claude outputs")}</td><td>Lleva a su proyecto lo que la app dejó en la carpeta «Claude outputs».</td></tr>
      </tbody>
    </table></div>
    <p class="hc-nota"><b>Tres cosas que Claude no hace aunque se lo pidas de pasada:</b> dar un documento por aprobado sin que lo diga su responsable, cambiar lo ya registrado en decisiones o en la bitácora, y mover algo que parece confidencial. En los tres casos te lo dice y propone; decides tú o el responsable.</p>`},
  {g:"Cada día", id:"modelos", t:"Qué modelo usar", h:`
    <p>El modelo se elige abajo, junto a donde escribes. Para trabajar con la memoria conviene <b>Opus</b> para todo: abrir y cerrar sesión, preguntar cómo va algo, colocar material y el trabajo de cada proyecto.</p>
    <dl class="hc-def">
      <dt>Opus, por defecto</dt><dd>En la misma apertura de sesión, repetida tres veces con cada modelo, Opus tardó en promedio 40 segundos y Sonnet 57, con los mismos tokens y menos pasos. Opus siguió mejor las reglas del método; Sonnet llegó a dar un dato equivocado en el recuadro de apertura.</dd>
      <dt>Lo más difícil</dt><dd>Para una revisión de calidad a fondo, decisiones de estrategia o de arquitectura y tareas largas de muchos pasos, el modelo más capaz que tengas disponible.</dd>
      <dt>Sonnet y Haiku</dt><dd>Sonnet funciona, pero en lo medido (la apertura) rindió menos: tardó más y se saltó una regla. Haiku no se ha probado con el método. El cierre de sesión y la puesta al día del tablero no se midieron: la recomendación sale de la apertura. Opus cuesta más por token que Sonnet; con los mismos tokens y menos pasos, la diferencia en una apertura es pequeña.</dd>
    </dl>
    <p class="hc-nota">Si una conversación empezó con otro modelo, se puede cambiar a mitad: conserva todo lo hablado.</p>`},
  {g:"Cada día", id:"telefono", t:"Desde el teléfono", h:`
    <p>Desde el teléfono o la web, sin la carpeta conectada, Claude puede leer la memoria si vive en Google Drive: abrir sesión para ponerte al día, preguntar ${F("¿qué sabemos de…?")} o pedirle al director cómo va un área. La respuesta empieza con «Memoria en solo lectura».</p>
    <dl class="hc-def">
      <dt>Lo que no hace</dt><dd>No escribe nada en la carpeta: ni decisiones, ni bitácora, ni pasos. Lo que salga de esa conversación se guarda, con tu sí, como nota en tu tablero, y la siguiente sesión desde la computadora lo registra.</dd>
      <dt>Lo que necesitas</dt><dd>El conector de Google Drive activado en Claude, y que la carpeta de ${ORG} esté en Drive. Si está en iCloud o en tu computadora, desde el teléfono solo verás el tablero.</dd>
      <dt>El tablero</dt><dd>Se ve en el teléfono, y desde él puedes fechar, marcar o anotar pasos; queda pendiente hasta que el tablero se ponga al día (<button type="button" class="lnk" data-help="del-tablero">Lo que tocas aquí</button>).</dd>
    </dl>`},
  {g:"Cada día", id:"si-algo-falla", t:"Si algo falla", h:`
    <dl class="hc-qa">
      <dt>Claude dice que no ve la carpeta.</dt><dd>Añádela a la conversación con «+». Si ya estaba, comprueba que está sincronizada en tu computadora y que la app de Claude está abierta.</dd>
      <dt>Al abrir sesión no aparece el recuadro «Memoria de trabajo».</dt><dd>Claude no encontró la carpeta o el plugin no está activo. Revisa que la conversación está dentro de tu proyecto, que es de Cowork si tu versión separa Chat y Cowork, que la carpeta está conectada al proyecto y que el plugin está encendido. Más en <button type="button" class="lnk" data-help="conectarte">Conéctate una vez</button>.</dd>
      <dt>Claude me pregunta dónde escribir.</dt><dd>Tu cuenta no está en el mapa de <code>guia.md</code>, ni como responsable ni como colaborador, ni en el proyecto donde trabajas. Dile en qué área trabajas para seguir hoy, y pide a ${CTX} que añada tu cuenta en <code>guia.md</code>.</dd>
      <dt>Dice que la carpeta usa una versión del método más nueva que la mía.</dt><dd>Tu plugin se quedó atrás. En Customize › Plugins, Add › Manage marketplaces, sincroniza <code>memoria</code>; con Sync automatically encendido no vuelve a pasar.</dd>
      <dt>El tablero sale vacío o le faltan áreas.</dt><dd>Los archivos de la carpeta siguen solo en la nube. Marca la carpeta «Disponible sin conexión» en el Finder o en el Explorador de archivos, espera a que se descarguen y pulsa «Sincronizar ahora».</dd>
      <dt>Cambié de computadora y el botón «Sincronizar ahora» no hace nada.</dt><dd>El botón está ligado a la computadora donde montaste el tablero. En la nueva, con la carpeta conectada, dile a Claude ${F("cambié de computadora: pon al día la tarea del tablero")} y aprueba el cambio que te pide la app.</dd>
      <dt>No puedo instalar la app.</dt><dd>Lo más común es el disco lleno: la primera vez descarga más de 1 GB. Libera espacio y vuelve a intentarlo; en Windows Home puede no funcionar la parte de carpetas.</dd>
      <dt>Una carpeta no se deja leer.</dt><dd>Está restringida para tu cuenta. Claude te lo dice y sigue con el resto. Si la necesitas, pide acceso a su responsable.</dd>
      <dt>Lo que hice hoy no aparece en el tablero.</dt><dd>Aparece cuando lo pones al día: pulsa «Sincronizar ahora» o dile a Claude ${F("sincroniza el tablero")}, con tu computadora encendida y la app abierta. Tarda unos minutos. Si cerraste la sesión, en Mantenimiento de Inicio verás el aviso de que hay sesiones que aún no muestra.</dd>
      <dt>Pegué algo con datos personales, contratos o facturación.</dt><dd>Claude te lo dice antes de guardarlo y propone dejarlo en la parte restringida del proyecto. Decides tú; no mueve nada sin tu sí.</dd>
      <dt>Claude quiere escribir en otra área.</dt><dd>No debería: escribe solo en las áreas y proyectos donde tu cuenta es responsable o colabora. Si algo le toca a otra, te dice a quién pedírselo.</dd>
    </dl>`},
  {g:"El tablero", id:"tablero", t:"Tu tablero", h:`
    <p>Una página que resume la carpeta entera: áreas, proyectos, en qué va cada uno, qué se decidió y qué falta. Es personal: cada persona monta el suyo desde su cuenta, con ${F("monta el tablero")}, y ve lo que su cuenta puede leer.</p>
    <dl class="hc-def">
      <dt>Tres niveles, la misma forma</dt><dd>Inicio, cada área y cada proyecto tienen cuatro pestañas: <b>Estatus</b> (cómo va), <b>Acciones</b> (lo que espera algo de ti), <b>Actividad</b> (lo que se hizo y quién) y <b>Qué hay</b> (lo que el trabajo ha producido). En Inicio, la última es <b>Mantenimiento</b>. La pestaña que eliges se queda al pasar a otra área o a otro proyecto, también desde el índice de la izquierda.</dd>
      <dt>Estatus</dt><dd>En Inicio, qué es la organización (el primer párrafo de la guía de la carpeta; si sigue con el texto de la plantilla o queda vacío, Mantenimiento pide escribirlo), una ficha por área con el titular de su Estatus y su primer «Siguiente», y las premisas. En el área, su Estatus entero, que escribe su director al cerrar sesión, y una ficha por proyecto. Quien colabora en el área sale por el nombre que la carpeta da a su cuenta («Nombre Apellido (correo)» en una línea «Colabora:» de un proyecto); si no lo tiene, solo se cuenta. En el proyecto, su Estatus: lo que se completó, lo que sigue, lo que falta decidir y lo que preocupa, con el estado completo plegado debajo.</dd>
      <dt>Acciones</dt><dd>Lo que te toca a ti (decidir, lo vencido, los cuestionamientos que esperan tu respuesta), las decisiones de otras personas que te afectan, lo que esperas de alguien o le debes (del equipo o de fuera, con su organización), y <b>Por dónde empezar</b>. Alguien de fuera sale cuando el paso o el Estatus lo nombra como «Nombre Apellido (Organización)»; unas palabras con mayúscula no son una persona. Para saber quién eres, el tablero toma el nombre que la carpeta da a tu cuenta: el responsable del área, o «Nombre (correo)» en una línea «Colabora:»; si no lo encuentra, te lo dice y no te atribuye nada. Cada línea abre el sitio exacto: un paso vencido abre su fecha para moverla.</dd>
      <dt>Actividad</dt><dd>Lo que se hizo en los últimos 7 o 28 días, por área, por proyecto y por persona, y lo que otros hicieron desde tu última sesión. Sale de la bitácora: cada entrada dice quién cerró la sesión, qué documentos escribió y cuáles publicó, y cada decisión quién la tomó. De un archivo que cambió sin sesión el tablero sabe cuál y cuándo, pero no quién; por eso cerrar la sesión importa.</dd>
      <dt>Por persona</dt><dd>Todos los que escriben en la carpeta, responsables y colaboradores de cada área y proyecto, también quien no tuvo sesión en el periodo, para darle seguimiento: esos van abajo, en gris, con la fecha de su última sesión. De cada uno, sesiones, decisiones, documentos y acciones planeadas. Un documento cuenta como escrito para quien lo escribió y como publicado para quien lo publicó, aunque sean dos personas; las sesiones de antes de la 1.23 no lo apuntaban y sus documentos se cuentan aparte, sin atribuir. Las acciones planeadas son los pasos abiertos que nombran a la persona: lo que tiene que hacer y lo que otros esperan de ella. El calendario marca los días con sesión; al pasar por encima dice cuántas. En Inicio, la lista se puede reducir a un área.</dd>
      <dt>Qué hay</dt><dd>El cuerpo del trabajo que el Estatus no cuenta: un resumen de lo publicado y de lo que hay en el taller, cuántos documentos están vigentes y en borrador, cuáles se quedaron viejos frente a una decisión posterior, y cada pieza con su estado, su fecha y la línea de su cabecera que dice qué aporta. La trayectoria muestra qué decisión o documento reemplazó a cuál. Del taller solo se enseña el inventario: su contenido sigue siendo privado del área. Una frase de resumen que sugirió la memoria sale como provisional. Solo las acepta el dueño del tablero, y solo en los proyectos donde su cuenta escribe: todas de una vez, y las escribe el próximo cierre del proyecto. En el área, Qué hay lleva además lo que no cuadra en sus proyectos.</dd>
      <dt>Consulta</dt><dd>En el índice: <b>Agenda</b> (lo que tiene fecha, los próximos catorce días y lo vencido), <b>Decisiones</b> (por área o por persona, primero las de dentro y después las de fuera) y <b>Entregables</b> (lo publicado, con lo que aporta y cuántos proyectos lo citan).</dd>
      <dt>Mantenimiento</dt><dd>Solo en Inicio. Un número en rojo cuenta lo que te pide hacer algo: sincronizar, poner al día la tarea del tablero, lo que no cuadra y lo marcado aquí que ya no coincide con la carpeta. Si no hay nada de eso pero sí algo que revisar (una versión nueva, lo que espera a la próxima sesión, lo que la memoria tiene flojo), sale un punto amarillo; si no hay nada, no sale nada. Primero, los avisos de la herramienta (versiones, sesiones cerradas desde la última sincronización); después, lo que no cuadra (un Estatus viejo, algo decidido después de «Falta decidir», las sugerencias de la memoria, que aceptas o descartas ahí si el tablero es tuyo y escribes en su proyecto) y el detalle por proyecto de lo que hay que poner al día, con la frase para hacerlo en sesión.</dd>
      <dt>Dos voces</dt><dd>La línea de estado de un proyecto la calcula el tablero con lo que hay escrito: fechas, decisiones, pasos. No inventa nada y no opina. El juicio (qué preocupa, hacia dónde va) es el Estatus, que se firma al cerrar sesión.</dd>
      <dt>Actuar desde él</dt><dd>Puedes poner fecha a un paso, marcarlo hecho, anotar algo o corregir cómo lee el estado de un proyecto. Queda pendiente (⟳) hasta que está escrito en la carpeta.</dd>
      <dt>No se comparte</dt><dd>Muestra todo lo que tu cuenta lee, incluido lo restringido, así que es solo para ti. Quien quiera ver la carpeta así monta el suyo con ${F("monta el tablero")}, y ve lo que su cuenta puede leer.</dd>
    </dl>`},
  {g:"El tablero", id:"ponerse-al-dia", t:"Cómo se pone al día", h:`
    <p>El tablero no lee la carpeta en vivo: muestra lo que había la última vez que se puso al día. El pie de la página dice cuándo fue.</p>
    <figure class="hc-flujo" aria-label="Cómo viaja la información entre la carpeta y el tablero">
      <div class="hc-flujo-g">
        <div class="hc-nodo carpeta"><b>La carpeta</b><small>La memoria. Lo que está escrito aquí es lo que vale.</small></div>
        <div class="hc-via ida"><div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M2 7h36M32 2l7 5-7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t"><b>La puesta al día</b><span>Cuando la pides, con el botón o con «sincroniza el tablero». Lee la carpeta y rehace lo que cambió.</span></span></div></div>
        <div class="hc-nodo tablero"><b>El tablero</b><small>Una ventana a la carpeta en la que se puede apuntar.</small></div>
        <div class="hc-via vuelta">
          <span class="hc-cola">Lo que tocas queda pendiente</span>
          <div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M42 7H6M12 2L5 7l7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t"><b>Lo mecánico</b><span>Lo escribe la siguiente puesta al día: fechas y pasos hechos con nota.</span></span></div>
          <div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M42 7H6M12 2L5 7l7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/></svg><span class="t"><b>Lo que pide criterio</b><span>Lo escribe la siguiente sesión del proyecto, con una persona delante.</span></span></div>
        </div>
      </div>
      <figcaption>La página nunca escribe en la carpeta: solo apunta. Escriben la puesta al día y las sesiones.</figcaption>
    </figure>
    <dl class="hc-def">
      <dt>Cuando tú lo pides</dt><dd>El tablero no se pone al día solo: cada puesta al día es una tarea que gasta de tu plan, y así decides cuándo. Cada vez que cierras una sesión, Claude deja apuntado en el tablero que hubo un cierre, sin pedirte nada; al abrirlo, la pestaña Mantenimiento de Inicio te avisa de cuántas sesiones aún no muestra y de cuáles, con el botón para traerlas. Al pulsarlo trae lo que hay en la carpeta, escribe lo mecánico que marcaste aquí y renueva «Por dónde empezar» si cambió algo. Tarda unos minutos y la página se actualiza sola al terminar. Si al cerrar le pides a Claude «cierra y pon al día el tablero», lo lanza en ese momento, y la app te pide permiso para hacerlo.</dd>
      <dt>Lo que escriben otras personas</dt><dd>Los cierres que apunta Claude son los de tu cuenta; lo que cierran otras personas no llega a tu tablero solo. Para traerlo, el botón «Sincronizar ahora», junto al nombre arriba a la izquierda (lo ve solo quien montó el tablero), o dile a Claude ${F("sincroniza el tablero")}. El botón no corre nunca solo; cuando lo pulsas, tu computadora tiene que estar encendida con la app abierta. Si lleva un punto, hace falta sincronizar: hubo sesiones cerradas después de la última vez, hay cosas marcadas aquí que la sincronización pasa a la carpeta, o la página y los datos son de versiones distintas. A su lado dice cuánto hace de la última sincronización; lo que alguien escribió en la carpeta después no lo puede ver, pero si nada cambió, la sincronización lo comprueba al empezar y termina enseguida. Si sale apagado, al pasar por encima dice qué le falta.</dd>
      <dt>Cada mañana, si lo pides</dt><dd>En una carpeta donde escriben varias personas puede convenir que se ponga al día solo cada mañana: pídelo con ${F("pon el tablero al día cada mañana")}. Corre en tu computadora, que tiene que estar encendida con la app abierta a esa hora.</dd>
      <dt>Versiones nuevas</dt><dd>Cuando sale una versión del método, la página se actualiza sola la siguiente vez que se pone al día, y Mantenimiento lo avisa una semana.</dd>
    </dl>`},
  {g:"El tablero", id:"del-tablero", t:"Lo que tocas aquí", h:`
    <p>La página no escribe en la carpeta. Lo que tocas se apunta en una lista de pendientes y se ve marcado (⟳) hasta que está escrito. Mientras siga pendiente, puedes deshacerlo tocándolo otra vez.</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Lo que tocas</th><th>Quién lo escribe</th><th>Cómo queda en la carpeta</th></tr></thead>
      <tbody>
        <tr><td>Cambiar la fecha de un paso</td><td>la puesta al día</td><td>La fecha nueva en la línea del paso, en la ficha del proyecto.</td></tr>
        <tr><td>Marcar un paso como hecho, con nota</td><td>la puesta al día</td><td>Quita el paso y añade a la bitácora una entrada «(tarea)» con el paso y tu nota. Solo si el paso no es una decisión.</td></tr>
        <tr><td>Marcar hecho sin nota, o un paso que es decidir, definir o aprobar algo</td><td>la siguiente sesión</td><td>Claude te pregunta qué pasó y lo registra. A veces de ahí sale una decisión.</td></tr>
        <tr><td>Anotar algo en un proyecto</td><td>la siguiente sesión</td><td>Claude lo registra donde le toque.</td></tr>
        <tr><td>Corregir cómo lee el tablero un paso o el estado</td><td>la siguiente sesión</td><td>Si lo apruebas, Claude reescribe el paso o el estatus.</td></tr>
        <tr><td>Marcar una prioridad del área como cumplida o retirada (en Acciones del área)</td><td>el responsable del área</td><td>Una sesión suya la quita de las prioridades.</td></tr>
      </tbody>
    </table></div>
    <p class="hc-nota">Lo que aún no está escrito se ve en Mantenimiento de Inicio, en «Por registrar en la carpeta». La puesta al día ocurre cuando pulsas «Sincronizar ahora» o cuando pides ${F("sincroniza el tablero")} (<button type="button" class="lnk" data-help="ponerse-al-dia">Cómo se pone al día</button>). Al abrir sesión en un proyecto, lo primero que Claude enseña es lo que llegó del tablero para ese proyecto.</p>`},
  {g:"El tablero", id:"estado-proyecto", t:"Cómo lee cada proyecto", h:`
    <p>De cada proyecto, el tablero enseña tres cosas: cómo va, en qué estado está y qué pasos tiene. Solo la primera la escribe una persona con Claude; las otras dos las calcula el tablero con lo que hay escrito.</p>
    <h3 class="hc-h">Cómo va</h3>
    <p>La pestaña Estatus de cada proyecto abre con su Estatus, el reporte del director: una frase con lo último que se completó y lo que sigue, y debajo lo que se completó, lo siguiente con quién y cuándo, lo que falta decidir y lo que preocupa. Si solo vas a leer una cosa, es esta.</p>
    <p>Lo escribe Claude al cerrar cada sesión del proyecto, con la voz del director del área, y lo guarda con su fecha en la sección «Estatus» de su <code>proyecto.md</code>; el tablero solo lo muestra. Si la ficha cambió después, la tarjeta avisa de que puede no estar al día. Si hay más que el Estatus, el estado completo está plegado debajo, en «En detalle». Un proyecto que aún no tiene Estatus lo dice: lo escribe el cierre de su siguiente sesión.</p>
    <h3 class="hc-h">El estado</h3>
    <p>Sale de lo que dice su ficha y de cuándo fue su última sesión. Si no te parece bien, tócalo para corregirlo: queda pendiente para la siguiente sesión.</p>
    <dl class="hc-def">
      <dt>En curso</dt><dd>Tiene una sesión en los últimos 30 días y nada lo bloquea.</dd>
      <dt>Bloqueado</dt><dd>Su estado dice «en pausa», o todo lo abierto espera a alguien de fuera.</dd>
      <dt>Parado</dt><dd>Más de 30 días sin sesión, o ninguna registrada, tenga pasos abiertos o no. Nadie lo está moviendo, y si no tiene pasos, nada dice qué sigue.</dd>
      <dt>Sin iniciar</dt><dd>Su estado empieza por «Arrancando», o solo tiene la sesión de arranque (las entradas «(tarea)» no cuentan) y ningún documento.</dd>
      <dt>Cerrado</dt><dd>Su estado dice «Proyecto terminado». Queda como registro.</dd>
      <dt>En riesgo</dt><dd>Se suma a cualquier estado: dos o más pasos vencidos, o una espera a alguien de fuera ya vencida.</dd>
    </dl>
    <h3 class="hc-h">Los pasos</h3>
    <p>El tablero mira cómo empieza cada paso para saber qué es, y lo trata distinto según el caso:</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Si empieza por</th><th>Es</th><th>Cómo lo trata</th></tr></thead>
      <tbody>
        <tr><td>«mantener…», «cada semana…»</td><td>Una rutina</td><td>Con fecha no vence: se revisa.</td></tr>
        <tr><td>«se revisa en…», «vence en…»</td><td>Una caducidad</td><td>Se revisa cuando llega su fecha.</td></tr>
        <tr><td>«esperar…», «cuando Ana conteste…»</td><td>Una espera a alguien de fuera</td><td>Si vence, el proyecto pasa a «En riesgo».</td></tr>
        <tr><td>«cuando…», «tras…», «una vez que…»</td><td>Algo que depende de otra cosa</td><td>Espera a que pase lo anterior.</td></tr>
        <tr><td>«decidir…», «definir…», «aprobar…»</td><td>Una decisión</td><td>Marcarlo hecho lo resuelve una sesión, no la puesta al día.</td></tr>
        <tr><td>Cualquier otra cosa</td><td>Una acción</td><td>Es lo que se agenda y lo que vence.</td></tr>
      </tbody>
    </table></div>
    <p>Si lee mal un paso, corrígelo con el botón ⋯ de su fila: queda pendiente para la siguiente sesión.</p>`},
  {g:"El tablero", id:"por-donde-empezar", t:"Lo que te propone Inicio", h:`
    <p>Inicio te dice qué hacer, de dos maneras: por dónde empezar, al final de Acciones, y qué arreglar para que la memoria siga sirviendo, en Mantenimiento. Junto a cada cosa hay una frase para copiar y pegarle a Claude.</p>
    <h3 class="hc-h">Por dónde empezar</h3>
    <p>Cuando el tablero se pone al día, y solo si algo cambió, Claude elige tres o cuatro grupos de pasos de proyectos distintos que comparten algo: una persona, una herramienta, un documento o un trámite. Elige con tres criterios: que esté entre las prioridades del área, que toque a un cliente, una firma o dinero, y que desbloquee otros proyectos. Que un paso esté vencido no lo hace más importante. Es una sugerencia: la sesión decide.</p>
    <h3 class="hc-h">Mantenimiento</h3>
    <p>Después de los avisos de la herramienta, «Lo que no cuadra»: lo que se ve desde fuera de las sesiones (un Estatus más viejo que la última sesión, algo decidido después de lo que «Falta decidir» dice, pasos vencidos hace más de un mes que nadie movió) y las sugerencias de la memoria, que acepta o descarta ahí mismo el dueño del tablero en los proyectos donde escribe; lo demás se arregla en su sitio, con el enlace de cada línea. Después, «Estatus por reescribir»; plegados, «Por poner al día, proyecto por proyecto» y «Por registrar en la carpeta» (lo que tocaste aquí y aún no está escrito). «Por poner al día» es lo que la memoria tiene flojo, cada cosa con la frase para arreglarla en una sesión. Cuenta como flojo:</p>
    <ul class="hc-l">
      <li>Archivos que cambiaron después de la última sesión registrada: hubo trabajo que nadie cerró.</li>
      <li>Pasos abiertos sin fecha, o mezclados con rutinas y esperas.</li>
      <li>Revisiones periódicas a las que ya les tocó.</li>
      <li>Un objetivo o un alcance que sigue en borrador más de tres semanas.</li>
      <li>Proyectos parados, y decisiones pendientes de confirmar por su responsable.</li>
      <li>Documentos cuya base cambió después de escribirse, borradores de más de 30 días, y documentos publicados que el índice del área no describe.</li>
      <li>Decisiones de otros proyectos que le afectan y llegaron después de su última sesión.</li>
      <li>Cosas marcadas aquí que esperan una sesión (pasos y prioridades de un área), y archivos que Claude dejó fuera de los proyectos.</li>
    </ul>
    <p class="hc-nota">«Ahora no» esconde una línea siete días, solo en este navegador.</p>`},
  {g:"El tablero", id:"que-ve-cada-quien", t:"Qué ve cada quien", h:`
    <dl class="hc-def">
      <dt>Tu tablero</dt><dd>Todo lo que tu cuenta puede leer en la carpeta, incluido lo restringido y las cinco sesiones más recientes de cada proyecto enteras. Cada persona ve en el suyo lo que su cuenta lee: por eso no se comparte, y quien quiera uno lo monta con ${F("monta el tablero")}.</dd>
      <dt>El taller</dt><dd>El cuerpo de lo que hay en <code>taller/</code> es privado del área: ni el tablero ni otras áreas lo leen. Su inventario sí se enseña en «Qué hay» a quien lee el área: el nombre, el estado, la fecha y la línea de su cabecera que dice qué aporta, que por eso no lleva nada restringido ni personal.</dd>
      <dt>Restringido</dt><dd>Lo que la cuenta que genera el tablero no puede leer en la carpeta: sale con su nombre y su responsable, y nada más. Si lo necesitas, pide acceso a quien administra la carpeta. Si en vez de «Restringido» ves «Sin carpeta» o «Sin leer», la carpeta no estaba en la computadora al generar el tablero: no es un permiso.</dd>
    </dl>`},
  {g:"Para empezar", id:"permisos", t:"Los permisos de Drive", h:`
    <p>Que la carpeta diga quién escribe dónde no basta: lo que manda es Drive. Claude compara los permisos reales de la carpeta compartida con lo que declara la memoria (las áreas y sus responsables en <code>guia.md</code>, quién colabora, lo restringido) y dice qué no cuadra.</p>
    <dl class="hc-def">
      <dt>Cómo se revisa</dt><dd>Quien responde por el contexto, o quien administra la carpeta, le dice a Claude ${F("revisa los permisos")}. Claude lee los permisos con el conector de Google Drive, sin cambiar nada, y lo propone solo al cerrar una sesión en la que cambió quién escribe o qué se restringe. Un grupo de Google no se mira por dentro: Claude lo avisa y pide comprobar quién está en él.</dd>
      <dt>En el tablero</dt><dd>Si algo no cuadra, arriba de Inicio sale «Permisos de Drive: N por corregir», con cada cambio y un botón para copiarlo y mandárselo a quien administra la carpeta. Si todo cuadra, al final de Mantenimiento queda la fecha de la última revisión. Solo lo ve el tablero de quien responde por el contexto.</dd>
      <dt>Quién lo arregla</dt><dd>Quien administra la carpeta. Una parte la puede aplicar Claude en su sesión, con su sí a la lista exacta: compartir como «Lector» y marcar con acceso limitado lo que la carpeta declara restringido, solo cuando sabe a quién conservar el acceso (${F("aplica los permisos")}; el texto que copia el botón lleva lo que hace falta). Dar «Gestor de contenido», bajar un rol o quitar a alguien se hace desde la web: el conector de Drive no lo permite. Si alguien escribe sin estar declarado, la pregunta es para quien responde por el contexto: ¿debe escribir?</dd>
      <dt>Los roles</dt><dd>Los que tiene que dar Drive a cada quien están en <button type="button" class="lnk" data-help="carpeta-drive">Montar la carpeta en Drive</button>.</dd>
    </dl>`},
  {g:"Anclar y cuestionar", id:"premisas", t:"Premisas y cuestionamientos", h:`
    <h3 class="hc-h">Las premisas</h3>
    <p>Una premisa es algo que la dirección confirmó y sobre lo que todos construyen: «este año vendemos solo en México», «el producto se construye en inglés». Salen en el Estatus de Inicio, después de las áreas, y Claude las tiene presentes en cada sesión.</p>
    <dl class="hc-def">
      <dt>Dónde viven</dt><dd>En <code>base/premisas.md</code>, una por línea: su identificador (P1, P2…), qué dice, quién la confirmó y cuándo.</dd>
      <dt>Quién las escribe</dt><dd>El responsable del contexto, en su sesión, cuando la dirección confirma una. Dile ${F("registra como premisa que…")}.</dd>
      <dt>Cuando cambian</dt><dd>No se corrigen: ${F("la premisa P1 cambia a…")} añade otra que dice «Reemplaza P1», y la anterior queda como historia.</dd>
      <dt>Si no estás de acuerdo</dt><dd>Se cuestiona como cualquier decisión: lo explica la parte de abajo.</dd>
    </dl>
    <h3 class="hc-h">Cuestionar algo</h3>
    <p>Cualquiera puede cuestionar una decisión de otro proyecto o una premisa. No es una queja: es dejar escrito qué no cuadra, con su dato, para que quien decidió lo confirme o lo cambie.</p>
    <ol class="hc-pasos">
      <li><b>Lo planteas en una sesión tuya</b><span>Abre sesión en un proyecto de tu área y dile ${F("quiero cuestionar la decisión de … porque …")}. Claude lo redacta y te lo enseña; con tu sí, queda escrito en el registro de decisiones de tu proyecto. Nadie escribe en el área de otro.</span></li>
      <li><b>Le llega a quien decidió</b><span>La próxima vez que el responsable abra sesión en su proyecto, Claude se lo enseña primero. Aquí sale en «Cuestionamientos abiertos», en Acciones de Inicio y arriba del Estatus del proyecto cuestionado.</span></li>
      <li><b>Lo responde con una decisión</b><span>El responsable, en una sesión de ese proyecto, dice ${F("lo mantengo, porque…")} o ${F("lo cambio: …")}. Al cerrar queda como una decisión que dice a qué cuestionamiento responde, también cuando solo lo mantiene. Con eso se cierra, y a quien lo planteó se lo enseña Claude la próxima vez que abra sesión en su proyecto. Una premisa la responde el responsable del contexto: con una premisa nueva que la reemplaza, o manteniéndola.</span></li>
    </ol>
    <p class="hc-nota">Una decisión cuestionada sigue valiendo hasta que su responsable responde, pero quien vaya a construir encima lo ve.</p>`},
  {g:"Anclar y cuestionar", id:"director", t:"El director de cada área", h:`
    <p>Cada área tiene un director: Claude mirando el área entera como la miraría quien la dirige.</p>
    <dl class="hc-def">
      <dt>El estatus del área</dt><dd>Con la misma forma que el de un proyecto: fecha, una frase, qué se completó, las prioridades del área en «Siguiente», qué falta decidir, qué preocupa y una línea por proyecto. Antes de la 1.22 se llamaba «Panorama» y eran tres a cinco frases: cómo está el área, qué se movió y qué preocupa. Se escribe al cerrar una sesión en el área, o cuando su responsable dice ${F("actualiza el estatus del área")}. Su frase sale en la ficha del área, en Inicio, y entero, con «Siguiente» numerado, en el Estatus del área. Un área que aún no lo tiene enseña su Panorama de antes de la 1.22, si lo hay.</dd>
      <dt>Pregúntale</dt><dd>${F("¿cómo va el área X?")} te da el resumen, cada proyecto en una frase y hasta cuatro cosas que piden atención.</dd>
      <dt>Que cuestione</dt><dd>${F("cuestiona el área")} busca lo que no cuadra: decisiones que chocan con una premisa, decisiones sin porqué, proyectos sin final claro y trabajo que otra área ya hizo.</dd>
      <dt>Lo de otras áreas</dt><dd>${F("¿qué de otras áreas me afecta?")} reúne lo que otras áreas decidieron o publicaron que te toca, y te ayuda a cuestionarlo si hace falta.</dd>
    </dl>
    <p class="hc-nota">El director solo escribe el estatus del área. Decisiones, pasos y estados siguen siendo cosa de la sesión de cada proyecto.</p>`},
  {g:"Cómo funciona", id:"piezas", t:"Las piezas y cómo se conectan", h:`
    <p>La memoria es la carpeta. Todo lo demás pasa dentro de Claude: las sesiones en las que trabajas y el tablero, que es una página de tu cuenta. Tu computadora es el puente entre las dos.</p>
    <figure class="hc-piezas" aria-label="La carpeta, tu computadora como puente, y dentro de Claude las sesiones con el plugin y el tablero">
      <div class="hc-pieza memoria"><b>La carpeta</b><small>La memoria. En Drive o en otra nube de la organización, archivos de texto que se abren sin Claude. Lo que está escrito aquí es lo que vale.</small></div>
      <div class="hc-enl"><svg viewBox="0 0 14 26" aria-hidden="true"><path d="M7 2v22M2 7l5-5 5 5M2 19l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>se sincroniza en</span></div>

      <div class="hc-claude">
        <span class="hc-claude-t">Dentro de Claude, en tu cuenta</span>
        <div class="hc-claude-g">
          <div class="hc-pieza"><b>Tus sesiones, con el plugin</b><small>Abres sesión, trabajas y la cierras. El plugin pone las reglas del método y se actualiza solo con Sync automatically.</small></div>
          <svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M2 7h40M8 2L2 7l6 5M36 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="hc-pieza tablero"><b>El tablero</b><small>Se pone al día con su botón, cuando lo pides; avisa si hay sesiones que aún no muestra. Lo que marcas en él vuelve a la carpeta en la siguiente puesta al día o sesión.</small></div>

    <p>Si una pieza falla, las demás siguen: con la computadora apagada la carpeta sigue intacta y el tablero enseña lo último que tenía; sin el tablero, la memoria funciona igual. <button type="button" class="lnk" data-help="ponerse-al-dia">Cómo se pone al día el tablero ›</button></p>`},
  {g:"Cómo funciona", id:"ordenada", t:"Cómo está ordenada la carpeta", h:`
    <p>Un área por cada parte de la organización, con un responsable con nombre y apellido. Dentro de cada área, un proyecto por cada trabajo. Todos los proyectos tienen las mismas piezas, así que quien sabe moverse en uno sabe moverse en todos.</p>
    <div class="hc-arbol"><ul>
      <li><code>guia.md</code><span>El mapa: qué áreas hay, quién responde por cada una y las reglas propias de la casa.</span></li>
      <li><code>metodo.md</code><span>Las reglas del método, iguales en cualquier organización. Llega solo con cada versión y nadie lo edita.</span></li>
      <li><code>base/</code><span>Quién es la organización, su vocabulario y los sistemas que usa.</span></li>
      <li><code>un-area/</code><span>Cada área, con su <code>area.md</code>: qué hace, sus prioridades y la lista de sus proyectos.</span>
        <ul>
          <li><code>un-proyecto/</code><span>Cada proyecto:</span>
            <ul>
              <li><code>proyecto.md</code><span>La ficha: estatus, objetivo, alcance, siguientes pasos y quién participa.</span></li>
              <li><code>decisiones.md</code><span>Qué se decidió, quién, por qué y qué se descartó.</span></li>
              <li><code>sesiones.md</code><span>La bitácora: el tema y los avances de cada sesión; lo que sigue está en el Estatus.</span></li>
              <li><code>entregables/</code><span>Lo que el proyecto produce para que otros lo usen.</span></li>
              <li><code>taller/</code><span>Borradores y trabajo intermedio, que no sale del proyecto.</span></li>
              <li><code>fuentes/</code><span>Material que llega de fuera, tal como llegó.</span></li>
              <li><code>restringido/</code><span>Solo si hace falta: lo que no puede leer todo el equipo.</span></li>
            </ul></li>
        </ul></li>
    </ul></div>`},
  {g:"Cómo funciona", id:"archivos", t:"Dos clases de archivos", h:`
    <dl class="hc-def">
      <dt>Los de texto (.md)</dt><dd>Son la memoria. Texto con un formato mínimo (títulos, listas, tablas) que se abre con cualquier editor. Claude los escribe siempre con las mismas secciones, y por eso puede leer solo la parte que necesita.</dd>
      <dt>Los de siempre</dt><dd>Excel, presentaciones, PDF, Word, imágenes. Conviven en las mismas carpetas. Lo que llega de fuera entra a <code>fuentes/</code> y no se edita; lo que el equipo arma con su herramienta va a <code>entregables/</code> o a <code>taller/</code>.</dd>
    </dl>
    <div class="hc-tbl"><table>
      <thead><tr><th>Archivo</th><th>Cómo cambia</th></tr></thead>
      <tbody>
        <tr><td>La ficha del proyecto</td><td>Se reescribe: siempre dice el presente. El estado y los siguientes pasos, al cerrar cada sesión.</td></tr>
        <tr><td>Las decisiones</td><td>Solo crecen. Si una decisión cambia, se añade otra que reemplaza a la anterior.</td></tr>
        <tr><td>La bitácora</td><td>Solo crece. Una entrada por sesión; lo que escribe la puesta al día del tablero lleva «(tarea)».</td></tr>
        <tr><td>Los documentos</td><td>Nacen en borrador y pasan a vigentes solo cuando su responsable lo pide.</td></tr>
        <tr><td>La ficha del área y el mapa</td><td>Se reescriben: la del área en una sesión de su responsable; el mapa y la base, en una del responsable del contexto.</td></tr>
      </tbody>
    </table></div>`},
  {g:"Cómo funciona", id:"quien-escribe", t:"Quién escribe y cómo lee Claude", h:`
    <h3 class="hc-h">Quién escribe</h3>
    <dl class="hc-def">
      <dt>Claude teclea</dt><dd>Las personas deciden qué dice cada archivo y lo piden; Claude es quien lo escribe, siempre con las mismas reglas. Nadie tiene que aprender el formato.</dd>
      <dt>Durante una sesión</dt><dd>Lo que se produce se guarda en su proyecto en cuanto existe, como borrador. Al cerrar, Claude registra qué se hizo, qué se decidió y qué sigue.</dd>
      <dt>Cada quien en lo suyo</dt><dd>Cada persona escribe solo en las áreas que el mapa asigna a su cuenta, como responsable o como colaboradora, y en los proyectos donde colabora. Si algo es de otra área, Claude lo dice para que se lo pidas a su responsable.</dd>
      <dt>Responsable y colaboradores</dt><dd>Quien colabora abre y cierra sesión, guarda borradores y registra las decisiones de su propio trabajo con su nombre. Publicar un documento, escribir el estatus del área, con sus prioridades, y crear o cerrar proyectos es del responsable. Si el responsable no está de acuerdo con una decisión, la reemplaza con una suya o la cuestiona.</dd>
      <dt>Dos personas en el mismo proyecto</dt><dd>Mejor no cerrar sesión a la vez. Si pasa, Claude compara al cerrar la hora de cada registro con la que vio al abrir, y si otra persona escribió mientras tanto, relee y suma lo suyo encima. Reduce el riesgo, no lo elimina: si la escritura de la otra persona aún no bajó a tu computadora, no la ve.</dd>
      <dt>Sin nadie delante</dt><dd>Solo la puesta al día del tablero, y solo lo mecánico: fechas y pasos hechos con nota.</dd>
    </dl>
    <p class="hc-nota"><b>Dónde guarda Claude algo:</b> cada cosa tiene un único sitio, y si no lo tiene claro pregunta antes de escribir. Si algo parece confidencial, avisa y propone dónde ponerlo; no lo mueve por su cuenta.</p>
    <h3 class="hc-h">Cómo lee Claude la carpeta</h3>
    <p>Claude nunca lee la carpeta entera. Lee por niveles y se para en el primero que responde a lo que se le pide.</p>
    <dl class="hc-def">
      <dt>Al empezar, siempre</dt><dd>El mapa de la carpeta, la lista de proyectos del área en la que se va a trabajar y las premisas vigentes, si las hay. Cabe en una pantalla.</dd>
      <dt>Al elegir un proyecto</dt><dd>Su ficha, sus cinco decisiones y sus tres sesiones más recientes, y los títulos de sus documentos, sin abrirlos.</dd>
      <dt>Solo si hace falta</dt><dd>Un documento entero, todas las decisiones, el vocabulario de la casa, los sistemas o un archivo de origen, cada uno cuando el trabajo lo pide y por su nombre.</dd>
    </dl>
    <p>Así cada conversación empieza con el contexto justo, tarda menos y consume menos.</p>`},
  ];

const _norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let HQ = "";
function ayudaToc(arts, cur){
  const q = _norm(HQ.trim()), vis = q.length>=2 ? arts.filter(a => _norm(a.t+" "+a.h.replace(/<[^>]+>/g," ")).includes(q)) : arts;
  if(!vis.length) return `<p class="empty" style="font-size:13.5px">Ningún artículo habla de «${esc(HQ.trim())}».</p>`;
  const grupos = [...new Set(vis.map(a=>a.g))];
  return grupos.map(g => `<div class="hc-g"><span class="eyebrow">${esc(g)}</span>${vis.filter(a=>a.g===g).map(a=>`<button type="button" class="hc-i" data-help="${a.id}"${a.id===cur?' aria-current="page"':""}>${esc(a.t)}</button>`).join("")}</div>`).join("");
}
// artículos fundidos en 1.14.11: sus enlaces viejos siguen llevando a donde está ahora su texto
const AYUDA_ALIAS = {necesitas:"conectarte", "que-hay":"tablero", "por-persona":"tablero", "en-corto":"estado-proyecto", pasos:"estado-proyecto", "memoria-al-dia":"por-donde-empezar", cuestionar:"premisas", "como-lee":"quien-escribe"};
// La ayuda es un solo documento (1.19): todos los artículos seguidos, con el índice al lado para saltar a cada uno y la
// sección actual marcada mientras se baja; cada sección se sigue enlazando sola (#ayuda-<id>) desde los «?» del tablero.
let HC_CUR = null;
function renderAyuda(id){
  id = AYUDA_ALIAS[id] || id;
  const head = document.getElementById("head"), main = document.getElementById("main");
  const arts = ayudaArts(), a = arts.find(x=>x.id===id) || arts[0];
  const grupos = [...new Set(arts.map(x=>x.g))];
  head.innerHTML = `<div class="eyebrow">Ayuda</div><h1>Cómo funciona la memoria</h1>`;
  main.innerHTML = `<div class="hc">
    <article class="hc-art hc-doc">${grupos.map(g => `<div class="hc-grupo" data-grupo="${esc(g)}"><span class="eyebrow hc-gt">${esc(g)}</span>${arts.filter(x=>x.g===g).map(x => `<section class="hc-sec" id="ay-${x.id}" data-sec="${x.id}"><h2 class="hc-st">${esc(x.t)}</h2>${x.h}</section>`).join("")}</div>`).join("")}
      <p class="empty" id="hc-nada" hidden></p></article>
    <nav class="hc-toc" aria-label="Secciones de la ayuda"><details id="hc-det"${window.innerWidth > 760 || HQ ? " open" : ""}><summary>Todas las secciones</summary>
      <div style="display:grid;gap:14px"><input type="search" id="hc-q" class="search" placeholder="Buscar en la ayuda" aria-label="Buscar en la ayuda" value="${esc(HQ)}">
      <div id="hc-list">${ayudaToc(arts, a.id)}</div></div>
    </details></nav>
  </div><button type="button" class="hc-fijo" id="hc-fijo" aria-label="Ir al índice de la ayuda">Secciones ↑</button>`;
  // en el teléfono la ayuda es una página larga y el índice queda arriba: un botón fijo vuelve a él y lo abre
  const fijo = document.getElementById("hc-fijo"); if(fijo) fijo.onclick = () => { const d = document.getElementById("hc-det"); if(d) d.open = true; window.scrollTo({top: 0, behavior: "smooth"}); };
  HC_CUR = a.id; hcFiltrar();
  const saltar = a !== arts[0];
  requestAnimationFrame(() => { if(saltar) irSeccion(a.id, true); hcToc(); });
  // lo que llega después (avisos arriba, la base) mueve la página: se vuelve a dejar la sección arriba una vez
  if(saltar) setTimeout(() => { if(view.lvl === "ayuda" && HC_CUR === a.id){ const s = document.getElementById("ay-" + a.id); if(s && Math.abs(s.getBoundingClientRect().top - (window.innerWidth <= 760 ? 56 : 12)) > 30) irSeccion(a.id, true); } }, 450);
}
// salta a una sección sin volver a pintar la ayuda
function irSeccion(id, sinHistoria){
  id = AYUDA_ALIAS[id] || id;
  const s = document.getElementById("ay-" + id); if(!s) return;
  if(s.hidden){ HQ = ""; const q = document.getElementById("hc-q"); if(q) q.value = ""; hcFiltrar(); }
  // en el teléfono el índice va arriba: se pliega antes de medir, y se deja sitio para el botón fijo del índice
  const movil = window.innerWidth <= 760;
  if(movil){ const d = document.getElementById("hc-det"); if(d) d.open = false; }
  window.scrollTo({top: Math.max(0, s.getBoundingClientRect().top + window.scrollY - (movil ? 56 : 12))});
  hcMarcar(id, !sinHistoria);
}
function hcMarcar(id, conHistoria){
  if(!id || id === HC_CUR && !conHistoria) return;
  HC_CUR = id; view = {lvl:"ayuda", id};
  document.querySelectorAll("#hc-list .hc-i").forEach(b => b.dataset.help === id ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  const h = "#ayuda-" + id; if(location.hash !== h) (conHistoria ? history.pushState : history.replaceState).call(history, null, "", h);
  const c = document.querySelector('#hc-list [aria-current="page"]'), t = document.querySelector(".hc-toc");

      nLate ? `<dt>Vencidos</dt><dd><span class="pill late">${nLate}</span> ${ir("pasos","Atenderlos ›")}</dd>` : "",
      esperas.length ? `<dt>Espera a alguien de fuera</dt><dd>${esperas.length===1?inline(esperas[0].texto):`${esperas.length} pasos esperan respuesta de fuera`}</dd>` : "",
      (()=>{ const af = afectan(p); if(!af.length) return ""; const nu = af.filter(x=>x.nueva), ver = AF_ALL.has(p.id) ? af : nu.length ? nu : af.slice(0,3);
        return `<dt>Le afectan</dt><dd>${nu.length?`<span class="pill soon">${nu.length} desde su última sesión</span> `:""}<span class="more">${af.length} decisi${af.length===1?"ón":"ones"} de otros proyectos lo citan</span><ul class="ent-l" style="margin-top:6px">${ver.map(({q,d,nueva})=>`<li>${inline(d.titulo)} <span class="more">· ${esc(q.nombre)} · ${fmtD(d.fecha)}${nueva?" · nueva":""}</span> <button type="button" class="lnk" style="font-size:12.5px" data-go-proj="${esc(q.id)}" data-tab="decisiones">Ver ›</button></li>`).join("")}</ul>${af.length>ver.length||AF_ALL.has(p.id)?`<button type="button" class="leer" data-af-all="${esc(p.id)}">${AF_ALL.has(p.id)?"Ver menos":`Ver las ${af.length}`}</button>`:""}</dd>`; })(),
      ud ? `<dt>Última decisión</dt><dd>${inline(ud.titulo)} <span class="more">· ${fmtD(ud.fecha)}</span></dd>` : "",
      ue ? `<dt>Último entregable</dt><dd>${inline(ue.titulo||ue.nombre)} <span class="more">· ${esc(ESTADO_E[ue.estado]||ue.estado)}${ue.actualizado?` · ${fmtD(ue.actualizado)}`:""}</span></dd>` : "",
      nc ? `<dt>Por registrar</dt><dd><span class="pill soon">${nc}</span> marcados aquí; los recoge la siguiente sesión</dd>` : ""
    ].join("");
    const top = live.filter(x=>["accion","decision","espera"].includes(effNat(p,x))).sort(stepOrder(p)).slice(0,3);
    body = `<div class="card ficha"><h3>Lo siguiente</h3>${top.length ? `<div class="steps">${top.map(x=>stepRow(p,x,false)).join("")}</div>` : `<p class="empty">Ningún paso por hacer escrito.</p>`}${live.length>top.length ? ir("pasos", `Ver las ${live.length} acciones ›`) : ""}${filas.trim() ? `<dl class="facts" style="border-top:1px solid var(--rule-soft);padding-top:12px">${filas}</dl>` : ""}</div>
      `;
  } else if(tab==="pasos"){
    const notas = notasDe(p.id);
    const pasos = (p.pasos||[]);
    body = `${CAN||notas.length ? `<div class="card"><h3>Para la próxima sesión</h3>${notas.length?`<div class="due-list">${notas.map(c=>`<div class="due-item static"><span class="pill">nota</span><span class="t">${esc(c.nota)}</span><span class="w">${esc((c.creado||"").slice(0,10))}${CAN?` · <button type="button" class="lnk" data-undo="${esc(c.id)}">Quitar</button>`:""}</span></div>`).join("")}</div>`:""}
      ${CAN?`<form class="anotar" data-proj="${esc(p.id)}"><label class="sr" for="anotar-txt">Anotar</label><input id="anotar-txt" class="search" type="text" maxlength="400" placeholder="Anotar algo que pasó, para registrarlo en la siguiente sesión"><button type="submit" class="btn">Anotar</button></form>`:""}</div>`:""}
      <div class="card"><h3>Siguientes pasos${hq("pasos","Cómo lee los pasos")}</h3>${ajenaAviso(p)}${regularizar(p)}<div class="steps">${pasos.length ? pasos.map(s => isHeader(s) ? `<div class="step h">${esc(s.texto.replace(/:$/,""))}</div>` : stepRow(p, s, false)).join("") : `<p class="empty">Sin siguientes pasos.</p>`}</div>${CAN?`<p class="more">Cambiar la fecha o marcar hecho se guarda aquí y se escribe en la carpeta la próxima vez que el tablero se ponga al día. Pasos nuevos o cambios de texto, en sesión.</p>`:""}</div>`;
  } else if(tab==="entregables"){
    const ents = (p.entregables||[]);
    const grp = (t, list) => list.length ? `<div class="card"><h3>${t}</h3><div class="ents">${list.slice().sort((x,y)=>(y.actualizado||"").localeCompare(x.actualizado||"")).map(e=>`<div class="ent"><b>${entBtn(p,e)}</b><span class="f">${e.formato!=="md"?esc(e.formato.toUpperCase())+" · ":""}${e.actualizado?fmtD(e.actualizado):"sin fecha"}</span>${e.descripcion?`<span class="d">${inline(e.descripcion)}</span>`:""}</div>`).join("")}</div></div>` : "";
    body = grp("Publicados", ents.filter(e=>e.estado==="vigente")) + grp("En borrador", ents.filter(e=>e.estado==="borrador")) + grp("Archivos sin estado", ents.filter(e=>!e.estado && e.formato!=="md")) + grp("Reemplazados", ents.filter(e=>e.estado==="reemplazado"));
    if(!body) body = `<div class="card"><p class="empty">Este proyecto no tiene entregables todavía.</p></div>`;
  }
  return body;
}
function render(){ document.body.dataset.lvl = view.lvl; _M = new Map(); try{ _render(); } finally { _M = null; } if(FOCO) aplicarFoco(); }
function _render(){
  try{
    if(ready.a && ready.p) visita();
    crumbs(); renderSide();
    if(view.lvl==="area" && areaBy[view.id]) renderArea(areaBy[view.id]);
    else if(view.lvl==="proj" && byId[view.id]) renderProj(byId[view.id]);
    else if(view.lvl==="pend") renderPend();
    else if(view.lvl==="dec") renderDec();
    else if(view.lvl==="ent") renderEnt();
    else if(view.lvl==="buscar") renderBuscar();
    else if(view.lvl==="ayuda") renderAyuda(view.id);
    else { view = {lvl:"root"}; renderRoot(); }
  }catch(err){
    console.error(err);
    document.getElementById("main").innerHTML = `<p class="empty">No se pudo mostrar esta página (${esc(err && err.message || err)}). Vuelve a cargar la página; si sigue, avisa a quien administra la carpeta.</p>`;
  }
  const md = document.getElementById("modal"); if(md){ md.innerHTML = prioModal() || mtModal() || entModal(); document.body.classList.toggle("modal-open", !!(PRIO_OPEN || MT_OPEN || ENT_OPEN)); }
  const f = document.getElementById("foot");
  f.innerHTML = META ? esc(`Al día del ${fmtL(META.snapshot)} · puesto al día desde la carpeta el ${new Date(META.sincronizado).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(/\.$/,"")}${META.duracion_min != null ? ` (la puesta al día tardó ${META.duracion_min < 1 ? "menos de un minuto" : `${Math.round(META.duracion_min)} min`}${META.llamadas ? `, ${META.llamadas} llamadas` : ""})` : ""}. Lee de la carpeta la guía, cada área y, de cada proyecto, cómo va, sus decisiones, sus sesiones, sus documentos y la lista de lo que hay en preparación; todo lo que tu cuenta puede leer, salvo el material de origen, el contenido de lo que está en preparación y lo restringido. La carpeta manda: lo que marcas aquí queda apuntado hasta la siguiente puesta al día, que lo pasa a la carpeta.`) : "";
}
(async ()=>{
  render();
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ DB = false; render(); return; }
  DB = db;
  const user = await window.claude.use("user");
  // Actúa quien entra con cuenta (contribuidor o editor); la cola admite escritura desde «interact». Sincronizar es solo del dueño, porque la tarea es de su cuenta.
  try{ const me = user ? await user.me() : null; CAN = !!(me && (me.id || me.canEdit)); OWNER = !!(me && me.isOwner); }catch(e){ CAN = false; OWNER = false; }
  // Conector de tareas programadas: sin él no existe «Sincronizar ahora». Se carga después del usuario y se repinta.
  try{ MCP = await window.claude.use("mcp"); }catch(e){ MCP = null; }
  render();
  db.collection("areas").onSnapshot(snap=>{ AREAS = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); areaBy = Object.fromEntries(AREAS.map(a=>[a.slug,a])); const pr = ready.a; ready.a = true; if(!pr) view = parseHash(); datosNuevos(); }, ()=>{ DB=false; datosNuevos(); });
  db.collection("proyectos").onSnapshot(snap=>{ const nuevos = snap.docs.map(s=>({id:s.id, ...s.data()})); olvidarTextos(nuevos); PROJ = nuevos.sort((a,b)=>(a.orden??99)-(b.orden??99)); byId = Object.fromEntries(PROJ.map(p=>[p.id,p])); const pr = ready.p; ready.p = true; if(!pr) view = parseHash(); datosNuevos(); }, ()=>{ DB=false; datosNuevos(); });
  db.collection("cambios").onSnapshot(snap=>{ const todo = snap.docs.map(s=>({id:s.id, ...s.data()})); CAMBIOS = todo.filter(c=>c.tipo!=="propuesta"); PROPUESTAS = todo.filter(c=>c.tipo==="propuesta"); datosNuevos(); }, ()=>{});   // las propuestas del barrido viven en la misma cola pero no son lo que alguien marcó aquí: no entran en ningún contador de CAMBIOS
  // los resúmenes de «Qué hay» que escribe la puesta al día (1.22.4); valen mientras la huella de lo que hay no cambie
  db.collection("resumenes").onSnapshot(snap=>{ for(const k of Object.keys(RESUMEN_GEN)) delete RESUMEN_GEN[k]; for(const d of snap.docs) RESUMEN_GEN[d.id] = d.data(); datosNuevos(); }, ()=>{});
  db.collection("cierres").onSnapshot(snap=>{ CIERRES = snap.docs.map(s=>({id:s.id, ...s.data()})); datosNuevos(); }, ()=>{});
  db.doc("meta/estado").onSnapshot(s=>{ META = s.exists ? s.data() : null; if(META && META.organizacion) document.title = "Tablero " + META.organizacion; datosNuevos(); }, ()=>{});
  db.doc("enfoque/actual").onSnapshot(s=>{ ENFOQUE = s.exists ? s.data() : null; datosNuevos(); }, ()=>{});
  db.doc("meta/permisos").onSnapshot(s=>{ PERMISOS = s.exists ? s.data() : null; datosNuevos(); }, ()=>{});
})();

// ---- tooltip propio: el nativo no aparece dentro del artifact y el CSS se recorta en el índice ----
(function(){
  const el = document.createElement("div"); el.id = "tip"; el.hidden = true; el.setAttribute("role","tooltip"); document.body.appendChild(el);
  let cur = null;
  function show(t){
    cur = t; el.textContent = t.dataset.tip; el.hidden = false;
    const r = t.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, m = 8;
    el.style.maxWidth = Math.min(300, vw - 2*m) + "px";
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(m, r.left), vw - w - m);
    let y = r.bottom + 7;
    if(y + h > vh - m) y = r.top - h - 7;
    if(y < m) y = m;
    el.style.left = x + "px"; el.style.top = y + "px";
  }
  function hide(){ cur = null; el.hidden = true; }
  document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t && t!==cur) show(t); else if(!t && cur) hide(); });
  document.addEventListener("mouseleave", e => { if(cur && e.target===cur) hide(); }, true);
  document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) show(t); });
  document.addEventListener("focusout", hide);
  document.addEventListener("keydown", e => { if(e.key==="Escape") hide(); });
  window.addEventListener("scroll", hide, true);
  document.addEventListener("click", hide, true);
})();
// teléfono: la barra de arriba se esconde al bajar y vuelve en cuanto se sube; siempre visible arriba de la página,
// con el menú abierto o con el foco en ella (1.22.4)
(function(){
  const angosta = window.matchMedia ? matchMedia("(max-width:860px)") : {matches:false};
  let y0 = window.scrollY || 0, pendiente = 0;
  const fijar = oculta => document.body.classList.toggle("bar-oculta", !!oculta);
  window.addEventListener("scroll", () => { if(pendiente || !angosta.matches) return; pendiente = requestAnimationFrame(() => { pendiente = 0;   // en escritorio no hay barra que esconder
    const y = window.scrollY || 0, bar = document.querySelector(".mob-bar"), alto = bar ? bar.offsetHeight : 52;
    if(!angosta.matches || y <= alto || document.body.classList.contains("side-open") || (bar && bar.contains(document.activeElement))){ fijar(false); y0 = y; return; }
    if(y - y0 > 8){ fijar(true); y0 = y; } else if(y0 - y > 4){ fijar(false); y0 = y; } }); }, {passive:true});
  document.addEventListener("focusin", e => { if(e.target.closest && e.target.closest(".mob-bar")) fijar(false); });
  // al pasar a pantalla ancha y volver, la barra no se queda escondida
  if(angosta.addEventListener) angosta.addEventListener("change", () => fijar(false));
})();
// pestañas que no caben: el lado que sigue se desvanece y la pestaña elegida queda a la vista (1.22.4)
(function(){
  const marcar = t => { const izq = t.scrollLeft > 2, der = t.scrollLeft + t.clientWidth < t.scrollWidth - 2; t.classList.toggle("mas-izq", izq); t.classList.toggle("mas-der", der); };
  let pend = 0;
  const todas = () => { pend = 0; document.querySelectorAll(".tabs").forEach(t => {
    if(!t.dataset.marca){ t.dataset.marca = "1"; t.addEventListener("scroll", () => marcar(t), {passive:true});
      const sel = t.querySelector('[aria-selected="true"]'); if(sel && t.scrollWidth > t.clientWidth) t.scrollLeft = Math.max(0, sel.offsetLeft - 24); }
    marcar(t); }); };
  const pedir = () => { if(!pend) pend = requestAnimationFrame(todas); };
  if(window.MutationObserver) new MutationObserver(pedir).observe(document.body, {childList:true, subtree:true});
  window.addEventListener("resize", pedir);
})();
