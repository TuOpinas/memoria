
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura; tres niveles (raíz → área → proyecto) en la misma página, navegados por hash.
   Identidad TuOpinas: grafito y verde señal, Zilla Slab para títulos, IBM Plex para texto y datos. */
:root{
  --ground:#F4F5F5; --surface:#FFFFFF; --ink:#17191A; --ink-soft:#40474A; --muted:#666D70;
  --rule:#DCDFE0; --rule-soft:#E9EBEC; --signal:#0B6E4F; --signal-dim:#E3F1EA; --on-signal:#FFFFFF;
  --warn:#6B4E00; --warn-dim:#FCEBB0; --warn-fill:#E8A317; --alert:#C4232B; --alert-dim:#F8E3DF; --on-alert:#FFFFFF;
  --pause:#5B6266; --pause-dim:#ECEEEF; --code:#EEF0F1;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:24px}
a{color:var(--signal)}
code{font:.92em var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5vw,38px)/1.1 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 17px/1.25 var(--f-display);margin:0}
p{margin:0}
.sub{color:var(--ink-soft)}

/* migas */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.crumbs .sep{color:var(--rule)}

header{display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink-soft);font-weight:500}

/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);letter-spacing:.02em;padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.pill.ok{background:var(--signal-dim);color:var(--signal)}
.pill.soon{background:var(--warn-dim);color:var(--warn)}
.pill.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.pill.none{background:var(--pause-dim);color:var(--pause)}
.pill.closed{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.pill.draft{background:transparent;border:1px dashed var(--rule);color:var(--muted)}

/* franja: lo que vence */
.due{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.due .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.due .top .c{font:500 12px var(--f-mono);color:var(--muted)}
.due-list{display:grid;gap:6px}
.due-item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule-soft);border-radius:4px}
.due-item:first-child{border-top:none}
.due-item:hover .t{text-decoration:underline;text-underline-offset:3px}
.due-item:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-item .t{min-width:0;font-size:14px;color:var(--ink)}
.due-item .w{grid-column:2;font-size:12.5px;color:var(--muted)}

/* áreas en la raíz */
.areas{display:grid;gap:14px}
.area{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.area-h{all:unset;cursor:pointer;display:grid;gap:4px;width:100%;box-sizing:border-box;padding:14px 16px;border-bottom:1px solid var(--rule-soft)}
.area-h:hover h2{text-decoration:underline;text-underline-offset:4px}
.area-h:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.area-h .d{color:var(--ink-soft);font-size:14px;max-width:70ch}
.area-h .who{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.area-h .who b{font-weight:500;color:var(--ink-soft)}
.plist{display:grid}
.prow{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr;gap:8px;align-items:start;box-sizing:border-box;padding:12px 16px;border-top:1px solid var(--rule-soft)}
.prow:first-child{border-top:none}
.prow:hover{background:var(--ground)}
.prow:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.prow .n{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-width:0}
.prow .n b{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.prow .s{min-width:0;display:grid;gap:6px}
.prow .s .st{font-size:13.5px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prow .s .nx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;color:var(--ink)}
.prow .s .nx span{min-width:0}
.prow.closed .n b,.prow.closed .s{color:var(--muted)}
.prow.restricted{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--rule-soft) 8px 9px)}


/* nivel área */
.prios{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.prios ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-soft);font-size:14px}
.prios ol li::marker{font:500 12px var(--f-mono);color:var(--muted)}
.ents{display:grid;gap:4px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft)}
.ent:first-child{border-top:none}
.ent b{font-weight:600}
.ent .d{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft)}
.ent .f{font:500 11.5px var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ent .f .chip{font:500 11px var(--f-mono);padding:3px 8px}

/* nivel proyecto */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:12px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{font:500 11.5px/1.7 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:0;min-width:0;color:var(--ink-soft)}
@media (max-width:480px){dl.facts{grid-template-columns:1fr;gap:2px}dl.facts dd{margin-bottom:8px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tab .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.md{color:var(--ink);display:grid;gap:10px;font-size:14.5px}
.md ul,.md ol{margin:0;padding-left:20px;display:grid;gap:4px}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--ground)}
.tbl{overflow-x:auto}
.md h4{font:600 15px/1.3 var(--f-display);margin:6px 0 0}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:14px}
.step:first-child{border-top:none}
.step.h{grid-template-columns:1fr;font:600 13px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px}
.dec{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.dec:first-child{border-top:none;padding-top:0}
.dec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dec .hd time{font:500 12px var(--f-mono);color:var(--muted)}
.dec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.dec dt{font:500 11.5px/1.7 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dec dd{margin:0;min-width:0;color:var(--ink-soft);white-space:pre-line}
@media (max-width:480px){.dec dl{grid-template-columns:1fr}}
.more{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* navegador de la raíz */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.nav-a{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 12px 8px;display:grid;gap:8px;align-content:start;min-width:0}
.nav-h{all:unset;cursor:pointer;display:grid;gap:2px;border-radius:4px}
.nav-h b{font:600 17px/1.2 var(--f-display)}
.nav-h small{font-size:12px;color:var(--muted)}
.nav-h:hover b{text-decoration:underline;text-underline-offset:3px}
.nav-h:focus-visible,.nav-p:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.nav-l{display:grid;gap:2px;border-top:1px solid var(--rule-soft);padding-top:6px}
.nav-p{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px;padding:4px 2px;border-radius:4px;min-width:0}
.nav-p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-p:hover span{text-decoration:underline;text-underline-offset:3px}
.nav-p.closed span{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rule);flex:none}
.dot.ok{background:var(--signal)}.dot.soon{background:var(--warn-fill)}.dot.late{background:var(--alert)}.dot.none{background:var(--rule);box-shadow:inset 0 0 0 1px var(--muted)}.dot.closed{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}.dot.pause{background:var(--pause)}.dot.risk{outline:2px solid var(--alert);outline-offset:1.5px}
.pill.est{font-weight:600}
.side-leg{grid-template-columns:1fr 1fr}.side-leg span{cursor:help;border-radius:3px}
[data-tip]{cursor:help;border-radius:3px}
[data-tip]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#tip{position:fixed;z-index:1000;background:var(--ink);color:var(--surface);font:400 12.5px/1.45 var(--f-body);letter-spacing:0;text-transform:none;padding:8px 10px;border-radius:6px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;left:0;top:0}
#tip[hidden]{display:none}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-top:8px}
.gh p{margin-left:auto;font-size:13px;color:var(--muted)}

/* pasos con controles */
.step{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.step.h{grid-template-columns:1fr}
.step input[type="checkbox"]{width:18px;height:18px;accent-color:var(--signal);margin:2px 0 0;cursor:pointer}
.nochk{width:18px;height:18px;display:inline-block}
.step-t{min-width:0;display:grid;gap:2px}
.step.done .tx{color:var(--muted);text-decoration:line-through}
.pend-note{font-size:12.5px;color:var(--warn)}
.step .w{font-size:12.5px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-edit{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.due-edit.none{background:var(--pause-dim);color:var(--pause)}
.due-edit.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.due-edit.soon{background:var(--warn-dim);color:var(--warn)}
.due-edit:hover{filter:brightness(.94)}
.due-edit[aria-expanded="true"]{box-shadow:0 0 0 2px var(--signal)}
.due-edit:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cal{width:12px;height:12px}
.due-form,.hecho-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 2px 28px}
.hecho-form .search{flex:1 1 220px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);min-height:20px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chip.ghost{border-color:transparent;color:var(--muted)}
.cal-box{flex-basis:100%;max-width:280px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;text-transform:capitalize}
.cal-nav{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:18px;color:var(--ink-soft)}
.cal-nav:hover{background:var(--rule-soft)}
.cal-nav:focus-visible,.cal-d:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-w{font:500 11px var(--f-mono);color:var(--muted);padding:4px 0}
.cal-d{all:unset;cursor:pointer;height:32px;display:grid;place-items:center;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--rule-soft)}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--signal);color:var(--signal);font-weight:600}
.cal-d.sel{background:var(--signal);color:var(--on-signal);font-weight:600}
.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;min-width:0}
.search:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{all:unset;cursor:pointer;background:var(--signal);color:var(--on-signal);font-weight:600;border-radius:6px;padding:8px 14px}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.anotar{display:flex;gap:8px;flex-wrap:wrap}
.anotar .search{flex:1 1 240px}
.due-item.static{cursor:default}
.due-item.static .t{text-decoration:none}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:6px;font-size:14px}

/* dos columnas: índice fijo a la izquierda, contenido a la derecha */
body{padding-inline:0;padding-block:0}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 24px}
.side-org{font:700 20px/1.1 var(--f-display);padding:4px 8px 12px}
.side-i{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;font-size:13.5px;color:var(--ink-soft)}
.side-i span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-i.top{grid-template-columns:minmax(0,1fr) auto;font-weight:600;color:var(--ink)}
.side-i.area{grid-template-columns:minmax(0,1fr) auto;font:600 15px/1.2 var(--f-display);color:var(--ink);margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.side-i.area small{font:500 11.5px var(--f-mono);color:var(--muted)}
.side-i.proj{padding-left:14px}
.side-i.proj.closed span{color:var(--muted)}
.side-i:hover{background:var(--ground)}
.side-i[aria-current="page"]{background:var(--signal-dim);color:var(--signal)}
.side-i[aria-current="page"] span{color:var(--signal)}
.side-i:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.side-n{font:600 11px var(--f-mono);background:var(--rule-soft);color:var(--ink-soft);border-radius:999px;padding:2px 7px}
.side-n.late{background:var(--alert);color:var(--on-alert)}
.side-leg{display:grid;gap:4px;margin-top:18px;padding:10px 8px 0;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}
.side-leg span{display:inline-flex;align-items:center;gap:6px}
.pane{min-width:0;display:grid;gap:24px;align-content:start;padding:24px clamp(16px,3vw,40px) 64px;max-width:1040px}
.pane > #main{width:100%;max-width:none;margin:0}
.side-toggle{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.tile b{font:600 17px/1.2 var(--f-display)}
.tile small{font-size:12.5px;color:var(--muted)}
.tile-s{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tile:hover{border-color:var(--ink-soft)}
.tile:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2);padding-top:calc(56px + env(safe-area-inset-top,0px))}
  body.side-open .side{transform:none}
  .side-toggle{display:inline-flex;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:30;cursor:pointer;font:600 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:8px 12px}
  .side-toggle:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .pane{padding-top:calc(56px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* naturaleza, importancia, enfoque, regularizar */
.pill.nat{background:transparent;border:1px solid var(--rule);color:var(--muted);font-weight:500}
.pill.nat.rutina,.pill.nat.caducidad{border-style:dashed}
.pill.imp{background:var(--signal-dim);color:var(--signal);font-weight:600}
.step-t .tags{margin-top:2px}
.enf{border-color:var(--signal)}
.enf-l{display:grid;gap:14px}
.enf-g{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--rule-soft)}
.enf-g:first-child{border-top:none;padding-top:0}
.enf-h{display:flex;gap:10px;align-items:baseline}
.enf-n{font:600 12px var(--f-mono);color:var(--on-signal);background:var(--signal);border-radius:999px;width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.enf-r{color:var(--ink-soft);font-size:14px}
.enf-p{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13.5px;color:var(--ink-soft)}
.frase{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.frase-t{flex:1 1 280px;min-width:0;font:13px/1.5 var(--f-mono);background:var(--code);padding:8px 10px;border-radius:6px;white-space:normal;overflow-wrap:anywhere}
.reg-l{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;color:var(--ink-soft)}
.reg-l b{color:var(--ink)}

/* inicio: barra de acciones y enfoque compacto */
.acc-bar{display:flex;gap:8px;flex-wrap:wrap}
.acc-k{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-soft)}
.acc-k b{font:600 16px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.acc-k.late{border-color:var(--alert);background:var(--alert-dim)}.acc-k.late b{color:var(--alert)}
.acc-k.soon{border-color:var(--warn);background:var(--warn-dim)}.acc-k.soon b{color:var(--warn)}
.acc-k:hover{border-color:var(--ink-soft)}
.acc-k:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.enf-mini{margin:0;padding-left:22px;display:grid;gap:10px}
.enf-mini li{display:grid;gap:3px;font-size:14px}
.enf-mini li::marker{font:600 13px var(--f-mono);color:var(--signal)}
.enf-mini li b{font:600 15px/1.3 var(--f-display)}
.enf-mini li>span{color:var(--ink-soft)}
.enf-mini-p{font-size:12.5px;color:var(--muted)}
.enf-mini .chip{justify-self:start;font-size:12.5px;margin-top:2px}

.prow .n small{font-size:12.5px;color:var(--muted)}
.steps.one{display:grid}
.steps.one .step{border-top:none;padding:0}
.steps.one .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cnt{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-left:auto}
.cnt .late{color:var(--alert);font-weight:600}.cnt .soon{color:var(--warn);font-weight:600}.cnt .muted{color:var(--muted)}

/* búsqueda, línea de tiempo, correcciones, aviso de datos viejos */
.side-search{width:100%;box-sizing:border-box;margin:0 0 8px;padding:7px 10px;font-size:13.5px}
.tl{display:grid;gap:4px}
.tl-d{font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 2px}
.tl-d:first-child{padding-top:0}
.tl-i{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-radius:4px}
.tl-i:hover .tl-t b{text-decoration:underline;text-underline-offset:3px}
.tl-i:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tl-t{display:grid;gap:2px;min-width:0;font-size:14px}
.tl-t b{font-weight:600}
.tl-t>span{color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.corr-btn{all:unset;cursor:pointer;font:500 11.5px var(--f-mono);color:var(--muted);padding:4px 6px;border-radius:999px;border:1px dashed transparent}
.corr-btn:hover,.corr-btn[aria-expanded="true"]{border-color:var(--rule);color:var(--ink-soft)}
.corr-btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.corr-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px 28px}
.due-item.orf{background:var(--alert-dim);border-radius:6px;padding-inline:8px}
.stale{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-dim);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.stale:empty{display:none}
#stale:empty{display:none}
#stale{display:grid;gap:8px}
footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dec .hd .lnk{font-size:13px}
footer{font-size:12.5px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.prow,.area-h,.due-item{transition:background .12s}}
</style>

<div class="app">
  <button type="button" id="side-toggle" class="side-toggle" aria-expanded="false" aria-controls="side">Índice</button>
  <aside id="side" class="side"><nav id="side-nav" aria-label="Índice de áreas y proyectos"></nav></aside>
  <div class="pane">
    <div id="stale"></div>
    <nav class="crumbs" id="crumbs" aria-label="Dónde estás"></nav>
    <header id="head"></header>
    <main id="main" class="wrap" style="gap:24px"></main>
    <footer id="foot"></footer>
  </div>
  <div id="flash" class="flash" role="status" hidden></div>
</div>

<script>
// Los datos viven en la base de la página: colecciones "areas" y "proyectos", el documento "meta/estado"
// y la cola "cambios" (lo que se toca aquí y todavía no está escrito en la carpeta).
// Los escribe generar_vista.py desde la raíz; la vista solo lee la raíz y escribe en su cola.
const VERSION_TABLERO = "1.11.0"; // la misma que el plugin memoria; la sube release.sh
let AREAS = [], PROJ = [], META = null, CAMBIOS = [], ENFOQUE = null, MCP = null, QUERY = "", byId = {}, areaBy = {}, DB = null, CAN = null, OWNER = false, ready = {a:false,p:false};
const DAY = 864e5;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const n = new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const nowISO = () => { const n = new Date(); const tz = -n.getTimezoneOffset(), s = tz>=0?"+":"-", pad = x=>String(Math.floor(Math.abs(x))).padStart(2,"0"); return new Date(n.getTime()+tz*6e4).toISOString().slice(0,19)+s+pad(tz/60)+":"+pad(tz%60); };
const fmtD = f => f ? new Date(f+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}) : "";
const fmtL = f => f ? new Date(f+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}) : "—";
function due(f){
  if(!f) return {cls:"none", label:"Sin fecha"};
  const diff = Math.round((new Date(f+"T12:00:00") - new Date(today()+"T12:00:00"))/DAY);
  if(diff < 0) return {cls:"late", label:`Venció hace ${-diff} d`};
  if(diff === 0) return {cls:"soon", label:"Hoy"};
  if(diff === 1) return {cls:"soon", label:"Mañana"};
  if(diff <= 7) return {cls:"soon", label:`En ${diff} d`};
  return {cls:"", label:fmtD(f)};
}
// Markdown mínimo: párrafos, listas, tablas, negritas, código, enlaces relativos como texto.
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
}
function md(text){
  if(!text) return "";
  const blocks = text.trim().split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split("\n");
    if(lines.every(l => l.trim().startsWith("|"))){
      const rows = lines.filter(l => !/^\|?\s*-{2,}/.test(l.replace(/\|/g,"").trim()) && !/^\|[\s\-|:]+\|$/.test(l.trim()));
      const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c => inline(c.trim()));
      const [h, ...body] = rows;
      return `<div class="tbl"><table><thead><tr>${cells(h).map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if(lines.every(l => /^\s*[-*] /.test(l))) return `<ul>${lines.map(l=>`<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`).join("")}</ul>`;
    if(lines.every(l => /^\s*\d+[.)] /.test(l))) return `<ol>${lines.map(l=>`<li>${inline(l.replace(/^\s*\d+[.)] /,""))}</li>`).join("")}</ol>`;
    if(/^#{3,4} /.test(lines[0])) return `<h4>${inline(lines[0].replace(/^#+ /,""))}</h4>` + (lines.length>1 ? `<p>${inline(lines.slice(1).join(" "))}</p>` : "");
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}
// ---- la cola de cambios ----
const isHeader = s => /^[A-Za-zÁÉÍÓÚáéíóúñÑ][^.]{0,30}:$/.test(s.texto.trim());
const key = (pid, texto) => pid + "||" + texto;
function pend(pid, texto){
  const out = {fecha:null, hecho:null, corregir:null};
  for(const c of CAMBIOS){ if(c.proyecto===pid && c.paso===texto){ if(c.tipo==="fecha") out.fecha = c; if(c.tipo==="hecho") out.hecho = c; if(c.tipo==="corregir") out.corregir = c; } }
  return out;
}
const effDate = (p, s) => { const q = pend(p.id, s.texto); if(q.corregir && q.corregir.propuesta==="sin-plazo") return null; return q.fecha ? (q.fecha.fecha_nueva||null) : (s.fecha||null); };
const effNat = (p, s) => { const c = pend(p.id, s.texto).corregir; return c && c.propuesta!=="sin-plazo" ? c.propuesta : (s.naturaleza||"accion"); };
const huerfano = c => { const p = byId[c.proyecto]; return !p || (!!c.paso && !(p.pasos||[]).some(s=>s.texto===c.paso)); };
async function corregir(p, s, propuesta){
  CORR = null;
  const prev = pend(p.id, s.texto).corregir;
  try{
    if(prev && prev.propuesta===propuesta){ await DB.doc("cambios/"+prev.id).delete(); }
    else if(prev){ await DB.doc("cambios/"+prev.id).update({propuesta, creado: nowISO()}); }
    else await addCambio({tipo:"corregir", proyecto:p.id, paso:s.texto, propuesta});
  }catch(e){ flash("No se pudo guardar la corrección."); }
  render();
}
const isDone = (p, s) => !!pend(p.id, s.texto).hecho;
const notasDe = pid => CAMBIOS.filter(c=>c.tipo==="nota" && c.proyecto===pid).sort((a,b)=>(b.creado||"").localeCompare(a.creado||""));
const stepsLive = p => (p.pasos||[]).filter(s=>!isHeader(s) && !isDone(p,s));
const CORR_OPC = [["rutina","No es una acción: es una rutina"],["condicional","Es condicional: va a «Después»"],["decision","Es una decisión, se toma en sesión"],["sin-plazo","La fecha del texto no es un plazo"]];
async function addCambio(data){
  try{ await DB.collection("cambios").add({...data, creado: nowISO(), estado:"pendiente"}); }
  catch(e){ flash(e && e.code==="not_granted" ? "Solo quien edita la vista puede anotar aquí." : "No se pudo guardar el cambio."); }
}
async function setFecha(p, s, v){
  EDIT = null; CALM = null;
  const prev = pend(p.id, s.texto).fecha;
  try{
    if((v||null) === (s.fecha||null)){ if(prev) await DB.doc("cambios/"+prev.id).delete(); }
    else if(prev) await DB.doc("cambios/"+prev.id).update({fecha_nueva: v||null, creado: nowISO()});
    else await addCambio({tipo:"fecha", proyecto:p.id, paso:s.texto, fecha_anterior:s.fecha||null, fecha_nueva:v||null});
  }catch(e){ flash("No se pudo cambiar la fecha."); }
  render();
}
async function marcarHecho(p, s, nota){
  HECHO = null;
  const prev = pend(p.id, s.texto).hecho;
  try{
    if(prev) await DB.doc("cambios/"+prev.id).delete();
    else await addCambio({tipo:"hecho", proyecto:p.id, paso:s.texto, nota:(nota||"").trim()||null});
  }catch(e){ flash("No se pudo marcar el paso."); }
  render();
}
async function anotar(p, texto){ if(!texto.trim()) return; await addCambio({tipo:"nota", proyecto:p.id, nota:texto.trim()}); render(); }
async function deshacer(id){ try{ await DB.doc("cambios/"+id).delete(); }catch(e){ flash("No se pudo deshacer."); } render(); }
function flash(msg){ const f = document.getElementById("flash"); f.textContent = msg; f.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(()=>f.hidden=true, 4000); }

// ---- navegación ----
let view = {lvl:"root"};
function parseHash(){
  const h = (location.hash||"").slice(1);
  if(h.startsWith("a-") && areaBy[h.slice(2)]) return {lvl:"area", id:h.slice(2)};
  if(h.startsWith("p-")){ const [id, t] = h.slice(2).split("-t-"); if(byId[id]){ if(t) tab = t; return {lvl:"proj", id, tab: t}; } }
  if(h==="pendientes") return {lvl:"pend"};
  if(h==="decisiones") return {lvl:"dec"};
  if(h==="entregables") return {lvl:"ent"};
  return {lvl:"root"};
}
function go(v){ view = v; EDIT = null; HECHO = null; if(v.lvl==="proj") tab = v.tab || "estado"; const h = v.lvl==="area" ? "a-"+v.id : v.lvl==="proj" ? "p-"+v.id+"-t-"+tab : v.lvl==="pend" ? "pendientes" : v.lvl==="dec" ? "decisiones" : v.lvl==="ent" ? "entregables" : v.lvl==="buscar" ? "" : ""; SIDE_OPEN = false; document.body.classList.remove("side-open"); if(("#"+h) !== location.hash && !(h==="" && !location.hash)) history.pushState(null,"","#"+h); render(); window.scrollTo({top:0}); }
window.addEventListener("popstate", ()=>{ view = parseHash(); render(); });
document.addEventListener("click", e => {
  const t = e.target;
  if(t.closest("[data-edit-due],[data-set-due],[data-cancel-due],[data-cal-nav],[data-check],[data-hecho-save],[data-hecho-cancel],[data-undo],[data-corr],[data-corr-set],[data-corr-est],[data-corr-est-set],[data-corr-cancel],[data-sync],[data-copy],.due-form,.hecho-form,.anotar,.corr-form,.side-search")) return;
  const b = t.closest("[data-go-area],[data-go-proj],[data-go-root],[data-go-pend],[data-go-dec],[data-go-ent]"); if(!b) return;
  e.preventDefault();
  if(b.dataset.goRoot!==undefined) go({lvl:"root"});
  else if(b.dataset.goPend!==undefined) go({lvl:"pend"});
  else if(b.dataset.goDec!==undefined) go({lvl:"dec"});
  else if(b.dataset.goEnt!==undefined) go({lvl:"ent"});
  else if(b.dataset.goArea) go({lvl:"area", id:b.dataset.goArea});
  else go({lvl:"proj", id:b.dataset.goProj, tab: b.dataset.tab || (t.closest("#view-pend, .enf, .due, .steps") ? "pasos" : "estado")});
});
document.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest(".prow,.area-h,.due-item"); if(b && b.tagName!=="INPUT" && (e.key==="Enter"||e.key===" ") && e.target===b){ e.preventDefault(); b.click(); } if(e.key==="Escape" && (EDIT||HECHO)){ EDIT=null; HECHO=null; CALM=null; render(); } });

// ---- controles de un paso ----
let EDIT = null, HECHO = null, CALM = null, CORR = null;
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function addDays(n){ const d = new Date(today()+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function nextMonday(){ const d = new Date(today()+"T12:00:00"); const k = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate()+k); return d.toISOString().slice(0,10); }
const CAL = `<svg class="cal" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="9" height="8" rx="1.5"/><path d="M1.5 5h9M4 1.2v2.4M8 1.2v2.4"/></svg>`;
function calGrid(k, cur){
  const {y,m} = CALM, first = new Date(y,m,1,12), start = (first.getDay()+6)%7, days = new Date(y,m+1,0,12).getDate();
  const t = today(), iso = d => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  let cells = Array.from({length:start},()=>`<span></span>`).join("");
  for(let d=1; d<=days; d++){ const v = iso(d); cells += `<button type="button" class="cal-d${v===t?" today":""}${v===cur?" sel":""}" data-set-due="${esc(k)}" data-v="${v}" aria-label="${d} de ${MESES[m]}">${d}</button>`; }
  return `<div class="cal-box" role="group" aria-label="Elegir fecha"><div class="cal-h"><button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mes anterior">‹</button><span>${MESES[m]} ${y}</span><button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal-g">${["L","M","M","J","V","S","D"].map(x=>`<span class="cal-w">${x}</span>`).join("")}${cells}</div></div>`;
}
function dueForm(p, s){
  const k = key(p.id, s.texto), cur = effDate(p, s);
  if(!CALM){ const base = new Date((cur||today())+"T12:00:00"); CALM = {y:base.getFullYear(), m:base.getMonth()}; }
  const q = [["Hoy",today()],["Mañana",addDays(1)],["Lunes",nextMonday()],["+1 sem",addDays(7)]];
  return `<div class="due-form">${q.map(([l,v])=>`<button type="button" class="chip" data-set-due="${esc(k)}" data-v="${v}">${l}</button>`).join("")}${cur?`<button type="button" class="chip" data-set-due="${esc(k)}" data-v="">Quitar</button>`:""}<button type="button" class="chip ghost" data-cancel-due aria-label="Cancelar">✕</button>${calGrid(k, cur)}</div>`;
}
function duePill(p, s){
  const k = key(p.id, s.texto), f = effDate(p, s), u = due(f), pending = !!pend(p.id, s.texto).fecha;
  const label = (f ? `${fmtD(f)} · ${u.label}` : "Sin fecha") + (pending ? " ⟳" : "");
  if(CAN) return `<button type="button" class="pill due-edit ${f?u.cls:"none"}" data-edit-due="${esc(k)}" aria-expanded="${EDIT===k}" title="${pending?"Fecha cambiada aquí, pendiente de escribir en la carpeta":"Cambiar fecha"}">${CAL}${label}</button>`;
  return `<span class="pill ${f?u.cls:"none"}">${label}</span>`;
}
function stepRow(p, s, withProj){
  const k = key(p.id, s.texto), done = pend(p.id, s.texto).hecho;
  const check = CAN ? `<input type="checkbox" id="chk-${esc(k).replace(/[^\w-]/g,"_")}" data-check="${esc(k)}" ${done?"checked":""} aria-label="${done?"Deshacer: ":"Marcar como hecho: "}${esc(s.texto)}">` : `<span class="nochk"></span>`;
  return `<div class="step${done?" done":""}" data-row="${esc(k)}">
    ${check}
    <span class="step-t"><span class="tx">${inline(s.texto)}</span><span class="tags">${natPill(s, p)}${CAN && !done ? `<button type="button" class="corr-btn" data-corr="${esc(k)}" aria-expanded="${CORR===k}" title="Corregir cómo lee la vista este paso">corregir</button>`:""}</span>${CORR===k ? `<span class="corr-form">${CORR_OPC.map(([v,l])=>`<button type="button" class="chip${pend(p.id,s.texto).corregir?.propuesta===v?" on":""}" data-corr-set="${esc(k)}" data-v="${v}">${l}</button>`).join("")}<button type="button" class="chip ghost" data-corr-cancel>✕</button></span>` : ""}${done?`<span class="pend-note">Hecho${done.nota?`: ${esc(done.nota)}`:""} · pendiente de registrar en la carpeta</span>`:""}${withProj?`<span class="w">${esc(areaBy[p.area].nombre)} · <button type="button" class="lnk" data-go-proj="${p.id}">${esc(p.nombre)}</button></span>`:""}</span>
    ${done ? `<span class="pill none">Hecho</span>` : duePill(p, s)}
    ${EDIT===k && !done ? dueForm(p, s) : ""}
    ${HECHO===k ? `<form class="hecho-form" data-hecho="${esc(k)}"><label class="sr" for="hecho-nota">Qué pasó</label><input id="hecho-nota" class="search" type="text" maxlength="240" placeholder="Qué pasó, en una línea (opcional)"><button type="submit" class="btn" data-hecho-save>Marcar hecho</button><button type="button" class="chip ghost" data-hecho-cancel>Cancelar</button></form>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const t = e.target; if(!CAN || !DB) return;
  const ce = t.closest("[data-corr-est]"); if(ce){ CORR = CORR==="est:"+ce.dataset.corrEst ? null : "est:"+ce.dataset.corrEst; EDIT = null; render(); return; }
  const ces = t.closest("[data-corr-est-set]"); if(ces){ const p = byId[ces.dataset.corrEstSet]; if(p) corregirEstado(p, ces.dataset.v); return; }
  const cb_ = t.closest("[data-corr]"); if(cb_){ CORR = CORR===cb_.dataset.corr ? null : cb_.dataset.corr; EDIT = null; render(); return; }
  const cs = t.closest("[data-corr-set]"); if(cs){ const [pid, ...rest] = cs.dataset.corrSet.split("||"); const p = byId[pid], s = (p.pasos||[]).find(x=>x.texto===rest.join("||")); if(p&&s) corregir(p, s, cs.dataset.v); return; }
  if(t.closest("[data-corr-cancel]")){ CORR = null; render(); return; }

const EST = {

  parado:    {label:"Parado",      dot:"pause",  pill:"none",   desc:"Más de 30 días sin sesión y con acciones abiertas. Nadie lo está moviendo."},
  encurso:   {label:"En curso",    dot:"ok",     pill:"ok",     desc:"Tiene sesiones recientes y acciones abiertas que dependen de nosotros."}
};
const RIESGO = {label:"En riesgo", desc:"Marca que se suma a cualquier estado: dos o más acciones vencidas, o una espera a terceros ya vencida. Hay que intervenir."};

const estRank = p => { const e = projStatus(p); return (e.riesgo ? 0 : 10) + EST_ORDEN.indexOf(e.k); };
function projStatus(p){
  if(p.restringido) return {k:"sininiciar", ...EST.sininiciar, label:"Restringido", regla:"No se lee", riesgo:false};
  if(p.cerrado) return {k:"cerrado", ...EST.cerrado, regla:"Estado actual dice «Proyecto terminado»", riesgo:false};
  const live = stepsLive(p), t = today();
  const venc = live.filter(s=>{ const f = effDate(p,s); return f && f<t; });
  const espVenc = venc.filter(s=>effNat(p,s)==="espera").length;
  const riesgo = venc.length>=2 || espVenc>0;
  const riesgoRegla = riesgo ? `${venc.length} acci${venc.length===1?"ón vencida":"ones vencidas"}${espVenc?`, ${espVenc} de ellas espera${espVenc===1?"":"s"} a terceros`:""}` : "";
  const corr = CAMBIOS.find(c=>c.tipo==="corregir" && c.proyecto===p.id && c.campo==="estado");
  if(corr && EST[corr.propuesta]) return {k:corr.propuesta, ...EST[corr.propuesta], regla:"Corregido desde la vista; pendiente de registrar en sesión", corregido:true, riesgo, riesgoRegla};
  const pausa = /\ben pausa\b/i.test(p.estado_resumen||"");
  if(pausa || (live.length && live.every(s=>effNat(p,s)==="espera"))) return {k:"bloqueado", ...EST.bloqueado, regla: pausa ? "Estado actual dice «en pausa»" : "Todas las acciones abiertas esperan a terceros", riesgo, riesgoRegla};
  const nEnt = (p.entregables||[]).length;
  if(/^arrancando/i.test(p.estado_resumen||"") || ((p.sesiones_total||0)<=1 && !nEnt)) return {k:"sininiciar", ...EST.sininiciar, regla: /^arrancando/i.test(p.estado_resumen||"") ? "Estado actual dice «Arrancando»" : "Solo la sesión de arranque y ningún entregable", riesgo, riesgoRegla};
  const dias = p.ultima_sesion ? Math.round((new Date(t+"T12:00:00") - new Date(p.ultima_sesion+"T12:00:00"))/DAY) : 999;
  if(dias>30 && live.length) return {k:"parado", ...EST.parado, regla:`Sin sesión desde hace ${dias} días y ${live.length} acciones abiertas`, riesgo, riesgoRegla};
  return {k:"encurso", ...EST.encurso, regla: p.ultima_sesion ? `Última sesión hace ${dias} día${dias===1?"":"s"}` : "Sin sesiones registradas", riesgo, riesgoRegla};
}

const nextStep = p => { const live = stepsLive(p); return live.filter(s=>effDate(p,s)).sort((a,b)=>effDate(p,a).localeCompare(effDate(p,b)))[0] || live[0] || null; };

// ---- búsqueda ----
function buscar(q){
  q = q.trim().toLowerCase(); if(q.length < 2) return null;
  const hit = s => (s||"").toLowerCase().includes(q);
  const out = {proyectos:[], decisiones:[], entregables:[], acciones:[]};
  for(const p of PROJ){ if(p.restringido) continue;
    if(hit(p.nombre)||hit(p.objetivo)||hit(p.estado_resumen)) out.proyectos.push(p);
    for(const d of (p.decisiones||[])) if(hit(d.titulo)||hit(d.porque)) out.decisiones.push({p,d});
    for(const e of (p.entregables||[])) if(hit(e.nombre)||hit(e.descripcion)) out.entregables.push({p,e});
    for(const s of stepsLive(p)) if(hit(s.texto)) out.acciones.push({p,s});
  }
  return out;
}

let SYNC_STATE = null;
async function sincronizar(){

    await MCP.callTool("Claude Code Remote", "fire_trigger", {trigger_id: META.tarea});

    SYNC_STATE = code==="server_not_connected" ? "sin-conector" : code==="not_in_manifest" ? "sin-permiso" : code==="needs_reauth" ? "reconectar" : "error";

      ${CAN?`<form class="anotar" data-proj="${p.id}"><label class="sr" for="anotar-txt">Anotar</label><input id="anotar-txt" class="search" type="text" maxlength="400" placeholder="Anotar algo que pasó, para registrarlo en la siguiente sesión"><button type="submit" class="btn">Anotar</button></form>`:""}</div>`:""}
      ${regularizar(p)}
      <div class="card"><h3>Siguientes pasos</h3><div class="steps">${pasos.length ? pasos.map(s => isHeader(s) ? `<div class="step h">${esc(s.texto.replace(/:$/,""))}</div>` : stepRow(p, s, false)).join("") : `<p class="empty">Sin siguientes pasos.</p>`}</div>${CAN?`<p class="more">Cambiar la fecha o marcar hecho se guarda aquí y se escribe en la carpeta con la sincronización diaria. Pasos nuevos o cambios de texto, en sesión.</p>`:""}</div>`;
  } else if(tab==="decisiones"){
    body = `<div class="card">${(p.decisiones||[]).length ? p.decisiones.map(d=>`<article class="dec"><div class="hd"><time>${fmtL(d.fecha)}</time><h3>${inline(d.titulo)}</h3></div><dl>${d.decidio?`<dt>Decidió</dt><dd>${inline(d.decidio)}</dd>`:""}${d.porque?`<dt>Por qué</dt><dd>${inline(d.porque)}</dd>`:""}${d.descartamos?`<dt>Descartamos</dt><dd>${inline(d.descartamos)}</dd>`:""}${d.afecta?`<dt>Afecta a</dt><dd>${inline(d.afecta)}</dd>`:""}</dl></article>`).join("") + (nD>p.decisiones.length?`<p class="more">Se muestran las ${p.decisiones.length} más recientes de ${nD}. El registro completo está en <code>decisiones.md</code>.</p>`:"") : `<p class="empty">Sin decisiones registradas.</p>`}</div>`;
  } else if(tab==="entregables"){
    const ents = (p.entregables||[]);
    const grp = (t, list) => list.length ? `<div class="card"><h3>${t}</h3><div class="ents">${list.map(e=>`<div class="ent"><b>${esc(e.nombre)}</b><span class="f">${e.formato!=="md"?esc(e.formato.toUpperCase())+" · ":""}${e.actualizado?fmtD(e.actualizado):"sin fecha"} · ${copiaRuta(p,e)}</span>${e.descripcion?`<span class="d">${inline(e.descripcion)}</span>`:""}</div>`).join("")}</div></div>` : "";
    body = grp("Vigentes", ents.filter(e=>e.estado==="vigente")) + grp("En borrador", ents.filter(e=>e.estado==="borrador")) + grp("Archivos sin cabecera", ents.filter(e=>!e.estado && e.formato!=="md")) + grp("Reemplazados", ents.filter(e=>e.estado==="reemplazado"));
    if(!body) body = `<div class="card"><p class="empty">Este proyecto no tiene entregables todavía.</p></div>`;
  } else {
    body = `<div class="card">${(p.sesiones||[]).length ? p.sesiones.map(s=>`<article class="dec"><div class="hd"><time>${fmtL(s.fecha)}</time>${s.titulo.replace(s.fecha,"").trim()?`<h3>${inline(s.titulo.replace(s.fecha,"").replace(/^[\s(]+|[)\s]+$/g,""))}</h3>`:""}</div><dl>${s.trabajamos?`<dt>Trabajamos en</dt><dd>${inline(s.trabajamos)}</dd>`:""}${s.avances?`<dt>Avances</dt><dd>${inline(s.avances)}</dd>`:""}${s.pendiente?`<dt>Pendiente</dt><dd>${inline(s.pendiente)}</dd>`:""}</dl></article>`).join("") + (nS>p.sesiones.length?`<p class="more">Las ${p.sesiones.length} sesiones más recientes de ${nS}.</p>`:"") + (META && META.modo!=="completo" && p.sesiones.length ? `<p class="more">La bitácora es taller privado del área: aquí solo fecha y título. El detalle está en <code>sesiones.md</code>.</p>` : "") : `<p class="empty">Sin sesiones registradas.</p>`}</div>`;
  }
  main.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k,t,n])=>`<button type="button" role="tab" class="tab" data-tab="${k}" aria-selected="${tab===k}">${t}${n!==""?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>${body}`;
  main.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ tab = b.dataset.tab; EDIT=null; HECHO=null; history.replaceState(null,"","#p-"+p.id+"-t-"+tab); renderProj(p); });
}
function render(){
  try{
    crumbs(); renderSide();
    if(view.lvl==="area" && areaBy[view.id]) renderArea(areaBy[view.id]);
    else if(view.lvl==="proj" && byId[view.id]) renderProj(byId[view.id]);
    else if(view.lvl==="pend") renderPend();
    else if(view.lvl==="dec") renderDec();
    else if(view.lvl==="ent") renderEnt();
    else if(view.lvl==="buscar") renderBuscar();
    else { view = {lvl:"root"}; renderRoot(); }
  }catch(err){
    console.error(err);
    document.getElementById("main").innerHTML = `<p class="empty">No se pudo pintar esta vista (${esc(err && err.message || err)}). Vuelve a cargar la página; si sigue, avisa a quien administra la carpeta.</p>`;
  }
  const sb = document.getElementById("stale"); if(sb) sb.innerHTML = staleBanner();
  const f = document.getElementById("foot");
  f.innerHTML = META ? `${syncBtn()} ` + esc(`Vista al ${fmtL(META.snapshot)} · generada desde la carpeta el ${new Date(META.sincronizado).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}. Lee guia.md, cada area.md y, de cada proyecto, proyecto.md, decisiones.md, sesiones.md y las cabeceras de sus entregables. Nunca fuentes, taller ni lo restringido. La carpeta es la fuente; lo que se toca aquí espera en una cola hasta que la sincronización lo escribe allí.`) : "";
}
(async ()=>{
  render();
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ DB = false; render(); return; }
  DB = db;
  const user = await window.claude.use("user");
  // Actúa quien entra con cuenta (contribuidor o editor); la cola admite escritura desde «interact». Sincronizar es solo del dueño, porque la tarea es de su cuenta.
  try{ const me = user ? await user.me() : null; CAN = !!(me && (me.id || me.canEdit)); OWNER = !!(me && me.isOwner); }catch(e){ CAN = false; OWNER = false; }
  // Conector de tareas programadas: sin él no existe «Sincronizar ahora». Se carga después del usuario y se repinta.
  try{ MCP = await window.claude.use("mcp"); }catch(e){ MCP = null; }
  render();
  db.collection("areas").onSnapshot(snap=>{ AREAS = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); areaBy = Object.fromEntries(AREAS.map(a=>[a.slug,a])); ready.a = true; view = parseHash(); render(); }, ()=>{ DB=false; render(); });
  db.collection("proyectos").onSnapshot(snap=>{ PROJ = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); byId = Object.fromEntries(PROJ.map(p=>[p.id,p])); ready.p = true; view = parseHash(); render(); }, ()=>{ DB=false; render(); });
  db.collection("cambios").onSnapshot(snap=>{ CAMBIOS = snap.docs.map(s=>({id:s.id, ...s.data()})); render(); }, ()=>{});
  db.doc("meta/estado").onSnapshot(s=>{ META = s.exists ? s.data() : null; if(META && META.organizacion) document.title = "Tablero " + META.organizacion + (META.modo==="completo" ? " completo" : ""); render(); }, ()=>{});
  db.doc("enfoque/actual").onSnapshot(s=>{ ENFOQUE = s.exists ? s.data() : null; render(); }, ()=>{});
})();

document.getElementById("side-toggle").addEventListener("click", ()=>{ SIDE_OPEN = !SIDE_OPEN; document.body.classList.toggle("side-open", SIDE_OPEN); renderSide(); });

document.addEventListener("input", e => { if(e.target.id==="side-q"){ QUERY = e.target.value; if(QUERY.trim().length>=2){ if(view.lvl!=="buscar"){ view = {lvl:"buscar"}; } render(); } else if(view.lvl==="buscar"){ view = {lvl:"root"}; render(); } } });

// ---- tooltip propio: el nativo no aparece dentro del artifact y el CSS se recorta en el índice ----
(function(){
  const el = document.createElement("div"); el.id = "tip"; el.hidden = true; el.setAttribute("role","tooltip"); document.body.appendChild(el);
  let cur = null;
  function show(t){
    cur = t; el.textContent = t.dataset.tip; el.hidden = false;
    const r = t.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, m = 8;
    el.style.maxWidth = Math.min(300, vw - 2*m) + "px";
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(m, r.left), vw - w - m);
    let y = r.bottom + 7;
    if(y + h > vh - m) y = r.top - h - 7;
    if(y < m) y = m;
    el.style.left = x + "px"; el.style.top = y + "px";
  }
  function hide(){ cur = null; el.hidden = true; }
  document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t && t!==cur) show(t); else if(!t && cur) hide(); });
  document.addEventListener("mouseleave", e => { if(cur && e.target===cur) hide(); }, true);
  document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) show(t); });
  document.addEventListener("focusout", hide);
  document.addEventListener("keydown", e => { if(e.key==="Escape") hide(); });
  window.addEventListener("scroll", hide, true);
  document.addEventListener("click", hide, true);
})();
</script>
