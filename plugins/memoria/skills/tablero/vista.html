<title>Tablero</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura; tres niveles (raíz → área → proyecto) en la misma página, navegados por hash.
   Identidad TuOpinas: grafito y verde señal, Zilla Slab para títulos, IBM Plex para texto y datos. */
:root{
  --ground:#F4F5F5; --surface:#FFFFFF; --ink:#17191A; --ink-soft:#40474A; --muted:#666D70;
  --rule:#DCDFE0; --rule-soft:#E9EBEC; --signal:#0B6E4F; --signal-dim:#E3F1EA; --on-signal:#FFFFFF;
  --warn:#6B4E00; --warn-dim:#FCEBB0; --warn-fill:#E8A317; --alert:#C4232B; --alert-dim:#F8E3DF; --on-alert:#FFFFFF;
  --pause:#5B6266; --pause-dim:#ECEEEF; --code:#EEF0F1;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:24px}
a{color:var(--signal)}
code{font:.92em var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5vw,38px)/1.1 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 17px/1.25 var(--f-display);margin:0}
p{margin:0}
.sub{color:var(--ink-soft)}
/* migas */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.crumbs .sep{color:var(--rule)}
header{display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink-soft);font-weight:500}
/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);letter-spacing:.02em;padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.pill.ok{background:var(--signal-dim);color:var(--signal)}
.pill.soon{background:var(--warn-dim);color:var(--warn)}
.pill.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.pill.none{background:var(--pause-dim);color:var(--pause)}
.pill.closed{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.pill.draft{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
/* franja: lo que vence */
.due{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.due .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.due .top .c{font:500 12px var(--f-mono);color:var(--muted)}
.due-list{display:grid;gap:6px}
.due-item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule-soft);border-radius:4px}
.due-item:first-child{border-top:none}
.due-item:hover .t{text-decoration:underline;text-underline-offset:3px}
.due-item:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-item .t{min-width:0;font-size:14px;color:var(--ink)}
.due-item .w{grid-column:2;font-size:12.5px;color:var(--muted)}
/* áreas en la raíz */
.areas{display:grid;gap:14px}
.area{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.area-h{all:unset;cursor:pointer;display:grid;gap:4px;width:100%;box-sizing:border-box;padding:14px 16px;border-bottom:1px solid var(--rule-soft)}
.area-h:hover h2{text-decoration:underline;text-underline-offset:4px}
.area-h:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.area-h .d{color:var(--ink-soft);font-size:14px;max-width:70ch}
.plist{display:grid}
.prow{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr;gap:8px;align-items:start;box-sizing:border-box;padding:12px 16px;border-top:1px solid var(--rule-soft)}
.prow:first-child{border-top:none}
.prow:hover{background:var(--ground)}
.prow:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.prow .n{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;min-width:0}
.prow .n b{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.prow .s{min-width:0;display:grid;gap:6px}
.prow .s .st{font-size:13.5px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prow .s .nx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;color:var(--ink)}
.prow .s .nx span{min-width:0}
.prow.closed .n b,.prow.closed .s{color:var(--muted)}
.prow.restricted{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--rule-soft) 8px 9px)}
/* nivel área */
.prios{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.prios ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-soft);font-size:14px}
.prios ol li::marker{font:500 12px var(--f-mono);color:var(--muted)}
.prio-l{gap:8px}
.prio{display:list-item}
.prio-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;color:var(--ink-soft)}
.prio.done .prio-t .tx{color:var(--muted);text-decoration:line-through}
.prio-a{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap}
.prio-m{font:500 11.5px var(--f-mono);color:var(--muted)}
.prio-m.late{color:var(--alert);font-weight:600}.prio-m.soon{color:var(--warn)}
.prio-go{all:unset;cursor:pointer;font:600 13px var(--f-body);color:var(--signal);border-radius:4px;padding:2px 4px}
.prio-go:hover{text-decoration:underline;text-underline-offset:3px}
.prio-go:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:600px){.prio-t{grid-template-columns:1fr}}
body.modal-open{overflow:hidden}
.modal-bg{position:fixed;inset:0;z-index:50;background:var(--velo,rgba(10,12,13,.45));display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid;gap:0;outline:none}
.modal-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:20px 22px 14px;border-bottom:1px solid var(--rule-soft);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{font-size:20px;margin-top:4px}
.modal-h .sub{font-size:14px;margin-top:6px}
.modal-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.modal-x:hover{background:var(--rule-soft)}
.modal-x:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.modal-s{padding:16px 22px;display:grid;gap:10px;border-bottom:1px solid var(--rule-soft)}
.modal-s h3{display:flex;gap:8px;align-items:baseline}
.modal-s h3 .c{font:500 12px var(--f-mono);color:var(--muted)}
.modal-f{padding:14px 22px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.ents{display:grid;gap:4px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft)}
.ent:first-child{border-top:none}
.ent b{font-weight:600}
.ent .d{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft)}
.ent .f{font:500 11.5px var(--f-mono);color:var(--muted)}
/* nivel proyecto */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:12px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{font:500 11.5px/1.7 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:0;min-width:0;color:var(--ink-soft)}
@media (max-width:480px){dl.facts{grid-template-columns:1fr;gap:2px}dl.facts dd{margin-bottom:8px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tab .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.md{color:var(--ink);display:grid;gap:10px;font-size:14.5px}
.md ul,.md ol{margin:0;padding-left:20px;display:grid;gap:4px}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--ground)}
.tbl{overflow-x:auto}
.md h4{font:600 15px/1.3 var(--f-display);margin:6px 0 0}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:14px}
.step:first-child{border-top:none}
.step.h{grid-template-columns:1fr;font:600 13px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px}
.dec{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.dec:first-child{border-top:none;padding-top:0}
.dec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dec .hd time{font:500 12px var(--f-mono);color:var(--muted)}
.dec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.dec dt{font:500 11.5px/1.7 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dec dd{margin:0;min-width:0;color:var(--ink-soft);white-space:pre-line}
@media (max-width:480px){.dec dl{grid-template-columns:1fr}}
.more{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* navegador de la raíz */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rule);flex:none}
.dot.ok{background:var(--signal)}.dot.soon{background:var(--warn-fill)}.dot.late{background:var(--alert)}.dot.none{background:var(--rule);box-shadow:inset 0 0 0 1px var(--muted)}.dot.closed{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}.dot.pause{background:var(--pause)}.dot.risk{outline:2px solid var(--alert);outline-offset:1.5px}
.pill.est{font-weight:600}
.side-leg{grid-template-columns:1fr 1fr}.side-leg span{border-radius:3px}
[data-tip]{border-radius:3px}
[data-tip]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#tip{position:fixed;z-index:1000;background:var(--ink);color:var(--surface);font:400 12.5px/1.45 var(--f-body);letter-spacing:0;text-transform:none;padding:8px 10px;border-radius:6px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;left:0;top:0}
#tip[hidden]{display:none}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-top:8px}
.gh p{margin-left:auto;font-size:13px;color:var(--muted)}
/* pasos con controles */
.step{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.step.h{grid-template-columns:1fr}
.step input[type="checkbox"]{width:18px;height:18px;accent-color:var(--signal);margin:2px 0 0;cursor:pointer}
.nochk{width:18px;height:18px;display:inline-block}
.step-t{min-width:0;display:grid;gap:2px}
.step.done .tx{color:var(--muted);text-decoration:line-through}
.pend-note{font-size:12.5px;color:var(--warn)}
.step .w{font-size:12.5px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-edit{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.due-edit.none{background:var(--pause-dim);color:var(--pause)}
.due-edit.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.due-edit.soon{background:var(--warn-dim);color:var(--warn)}
.due-edit:hover{filter:brightness(.94)}
.due-edit[aria-expanded="true"]{box-shadow:0 0 0 2px var(--signal)}
.due-edit:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cal{width:12px;height:12px}
.due-form,.hecho-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 2px 28px}
.hecho-form .search{flex:1 1 220px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);min-height:20px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chip.ghost{border-color:transparent;color:var(--muted)}
.cal-box{flex-basis:100%;max-width:280px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;text-transform:capitalize}
.cal-nav{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:18px;color:var(--ink-soft)}
.cal-nav:hover{background:var(--rule-soft)}
.cal-nav:focus-visible,.cal-d:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-w{font:500 11px var(--f-mono);color:var(--muted);padding:4px 0}
.cal-d{all:unset;cursor:pointer;height:32px;display:grid;place-items:center;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--rule-soft)}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--signal);color:var(--signal);font-weight:600}
.cal-d.sel{background:var(--signal);color:var(--on-signal);font-weight:600}
.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;min-width:0}
.search:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{all:unset;cursor:pointer;background:var(--signal);color:var(--on-signal);font-weight:600;border-radius:6px;padding:8px 14px}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.anotar{display:flex;gap:8px;flex-wrap:wrap}
.anotar .search{flex:1 1 240px}
.due-item.static{cursor:default}
.due-item.static .t{text-decoration:none}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:6px;font-size:14px}
/* dos columnas: índice fijo a la izquierda, contenido a la derecha */
body{padding-inline:0;padding-block:0}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 24px}
.side-org{font:700 20px/1.1 var(--f-display);padding:4px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync-ico{all:unset;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:999px;color:var(--muted);flex:none}
.sync-ico svg{width:18px;height:18px}
.sync-ico:hover{background:var(--signal-dim);color:var(--signal)}
.sync-ico:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sync-ico.done{color:var(--signal)}
.sync-ico.busy{color:var(--muted);cursor:progress}
.sync-ico.busy svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sync-ico.busy svg{animation:none}}
.side-i{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;font-size:13.5px;color:var(--ink-soft)}
.side-i span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-i.top{grid-template-columns:minmax(0,1fr) auto;font-weight:600;color:var(--ink)}
.side-i.area{grid-template-columns:minmax(0,1fr) auto;font:600 15px/1.2 var(--f-display);color:var(--ink);margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.side-i.area small{font:500 11.5px var(--f-mono);color:var(--muted)}
.side-i.proj{padding-left:14px}
.side-i.proj.closed span{color:var(--muted)}
.side-i:hover{background:var(--ground)}
.side-i[aria-current="page"]{background:var(--signal-dim);color:var(--signal)}
.side-i[aria-current="page"] span{color:var(--signal)}
.side-i:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.side-n{font:600 11px var(--f-mono);background:var(--rule-soft);color:var(--ink-soft);border-radius:999px;padding:2px 7px}
.side-n.late,.side-i[aria-current="page"] .side-n.late{background:var(--alert);color:var(--on-alert)}
.side-leg{display:grid;gap:4px;margin-top:18px;padding:10px 8px 0;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--muted)}
.side-leg span{display:inline-flex;align-items:center;gap:6px}
.pane{min-width:0;display:grid;gap:24px;align-content:start;padding:24px clamp(16px,3vw,40px) 64px;max-width:1040px}
.pane > #main{width:100%;max-width:none;margin:0}
.side-toggle{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile-s{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}

function buscar(q){
  q = q.trim().toLowerCase(); if(q.length < 2) return null;
  const hit = s => (s||"").toLowerCase().includes(q);
  const out = {proyectos:[], decisiones:[], entregables:[], acciones:[]};
  for(const p of PROJ){ if(p.restringido) continue;
    if(hit(p.nombre)||hit(p.objetivo)||hit(p.estado_resumen)) out.proyectos.push(p);
    for(const d of (p.decisiones||[])) if(hit(d.titulo)||hit(d.porque)) out.decisiones.push({p,d});
    for(const e of (p.entregables||[])) if(hit(e.nombre)||hit(e.titulo)||hit(e.descripcion)) out.entregables.push({p,e});
    for(const s of stepsLive(p)) if(hit(s.texto)) out.acciones.push({p,s});
  }
  return out;
}
function renderBuscar(){
  const head = document.getElementById("head"), main = document.getElementById("main");
  const r = buscar(QUERY);
  head.innerHTML = `<div class="eyebrow">Búsqueda</div><h1>${esc(QUERY)}</h1>`;
  if(!r){ main.innerHTML = `<p class="empty">Escribe al menos dos letras.</p>`; return; }
  const n = r.proyectos.length + r.decisiones.length + r.entregables.length + r.acciones.length;
  const sec = (t, list, row) => list.length ? `<section class="card"><h3>${t} <span class="c" style="font:500 12px var(--f-mono);color:var(--muted)">${list.length}</span></h3><div class="due-list">${list.map(row).join("")}</div></section>` : "";
  main.innerHTML = n ? sec("Proyectos", r.proyectos, p=>`<button type="button" class="due-item" data-go-proj="${esc(p.id)}"><span class="pill">${esc(areaBy[p.area]?.nombre||"")}</span><span class="t">${esc(p.nombre)}</span><span class="w">${inline(p.objetivo||"")}</span></button>`)
    + sec("Decisiones", r.decisiones, ({p,d})=>`<button type="button" class="due-item" data-go-proj="${esc(p.id)}" data-tab="decisiones"><span class="pill ok">${fmtD(d.fecha)}</span><span class="t">${inline(d.titulo)}</span><span class="w">${esc(areaBy[p.area]?.nombre||"")} · ${esc(p.nombre)}</span></button>`)
    + sec("Entregables", r.entregables, ({p,e})=>`<button type="button" class="due-item" data-go-proj="${esc(p.id)}" data-tab="entregables"><span class="pill ${e.estado==="vigente"?"ok":"none"}">${esc(e.estado||e.formato)}</span><span class="t">${inline(e.titulo||e.nombre)}</span><span class="w">${esc(areaBy[p.area]?.nombre||"")} · ${esc(p.nombre)}${e.descripcion?` · ${inline(e.descripcion)}`:""}</span></button>`)
    + sec("Acciones", r.acciones, ({p,s})=>`<button type="button" class="due-item" data-go-proj="${esc(p.id)}" data-tab="pasos"><span class="pill ${effDate(p,s)?due(effDate(p,s)).cls:"none"}">${effDate(p,s)?due(effDate(p,s)).label:"Sin fecha"}</span><span class="t">${inline(s.texto)}</span><span class="w">${esc(areaBy[p.area]?.nombre||"")} · ${esc(p.nombre)}</span></button>`)
    : `<p class="empty">Nada coincide con «${esc(QUERY)}».</p>`;
}

let SYNC_STATE = null;
async function sincronizar(){
  if(!MCP || !META || !META.tarea) return;
  SYNC_STATE = "corriendo"; render();
  try{
    await MCP.callTool("Claude Code Remote", "fire_trigger", {trigger_id: META.tarea});
    SYNC_STATE = "lanzada"; flash("Sincronización lanzada. Tarda unos minutos; el tablero se pone al día solo cuando termina.");
  }catch(e){
    const code = e && e.code;
    SYNC_STATE = code==="server_not_connected" ? "sin-conector" : code==="not_in_manifest" ? "sin-permiso" : code==="needs_reauth" ? "reconectar" : "error";
    flash(SYNC_STATE==="sin-conector" ? "Falta el conector de tareas programadas en tu cuenta de Claude." : SYNC_STATE==="sin-permiso" ? "No diste permiso a esta página para lanzar la sincronización." : SYNC_STATE==="reconectar" ? "Reconecta el conector de tareas en Claude → Conectores." : "No se pudo lanzar la sincronización: " + (e && e.message || ""));
  }
  render();
}
document.addEventListener("click", e => { if(e.target.closest && e.target.closest("[data-sync]")) sincronizar(); });
function syncBtn(){
  if(!OWNER || !MCP || !META || !META.tarea) return "";
  const tipTxt = SYNC_STATE==="corriendo" ? "Lanzando la sincronización…" : SYNC_STATE==="lanzada" ? "Sincronización lanzada. Tarda unos minutos; el tablero se actualiza solo al terminar." : "Sincronizar ahora: pone el tablero al día con la carpeta y pasa a la carpeta lo que marcaste aquí. Es lo mismo que ocurre al cerrar una sesión; tarda unos minutos.";
  const ico = SYNC_STATE==="lanzada" ? `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg>` : `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M16.5 8.5A6.5 6.5 0 0 0 5 6.2M3.5 11.5A6.5 6.5 0 0 0 15 13.8"/><path d="M16.5 3.5v5h-5M3.5 16.5v-5h5"/></svg>`;
  return `<button type="button" class="sync-ico${SYNC_STATE==="corriendo"?" busy":""}${SYNC_STATE==="lanzada"?" done":""}" data-sync ${tip(tipTxt)} aria-label="Sincronizar ahora" ${SYNC_STATE==="corriendo"?"disabled":""}>${ico}</button>`;
}
function staleBanner(){

  if(view.lvl === "root" && META.pagina_actualizada && META.pagina_actualizada.fecha && (Date.now() - new Date(META.pagina_actualizada.fecha+"T12:00:00").getTime()) < 7*DAY) out += `<div class="stale" style="background:var(--signal-dim);color:var(--signal);border-color:var(--signal)"><span>El tablero se actualizó a la versión <b>${esc(META.pagina_actualizada.version)}</b> el ${fmtD(META.pagina_actualizada.fecha)} al ponerse al día. Nada que hacer.</span></div>`;
  if(view.lvl === "root" && META.tarea_desfasada) out += `<div class="stale"><span>Hay instrucciones nuevas para la tarea que pone el tablero al día cada mañana y cambiarlas pide tu aprobación: dile a Claude con la carpeta conectada «actualiza el tablero».</span></div>`;

  return out;
}

const _norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let HQ = "";
function ayudaToc(arts, cur){
  const q = _norm(HQ.trim()), vis = q.length>=2 ? arts.filter(a => _norm(a.t+" "+a.h.replace(/<[^>]+>/g," ")).includes(q)) : arts;
  if(!vis.length) return `<p class="empty" style="font-size:13.5px">Ningún artículo habla de «${esc(HQ.trim())}».</p>`;
  const grupos = [...new Set(vis.map(a=>a.g))];
  return grupos.map(g => `<div class="hc-g"><span class="eyebrow">${esc(g)}</span>${vis.filter(a=>a.g===g).map(a=>`<button type="button" class="hc-i" data-help="${a.id}"${a.id===cur?' aria-current="page"':""}>${esc(a.t)}</button>`).join("")}</div>`).join("");
}
function renderAyuda(id){
  const head = document.getElementById("head"), main = document.getElementById("main");
  const arts = ayudaArts(), a = arts.find(x=>x.id===id) || arts[0], i = arts.indexOf(a), sig = arts[i+1];
  head.innerHTML = `<div class="eyebrow">Ayuda · ${esc(a.g)}</div><h1>${esc(a.t)}</h1>`;
  main.innerHTML = `<div class="hc">
    <nav class="hc-toc" aria-label="Artículos de ayuda"><details id="hc-det"${window.innerWidth > 760 || HQ ? " open" : ""}><summary>Todos los artículos</summary>
      <div style="display:grid;gap:14px"><input type="search" id="hc-q" class="search" placeholder="Buscar en la ayuda" aria-label="Buscar en la ayuda" value="${esc(HQ)}">
      <div id="hc-list">${ayudaToc(arts, a.id)}</div></div>
    </details></nav>
    <article class="hc-art">${a.h}${sig?`<p class="hc-sig"><span class="eyebrow">Siguiente</span><button type="button" class="lnk" data-help="${sig.id}">${esc(sig.t)} ›</button></p>`:""}</article>
  </div>`;
}
// «?» junto a un bloque del tablero: abre el artículo que lo explica
const hq = (id, que) => `<button type="button" class="hq" data-help="${id}" aria-label="Ayuda: ${esc(que)}" ${tip("Qué es esto")}>?</button>`;
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("[data-help],[data-go-help]"); if(!b) return; e.preventDefault(); go({lvl:"ayuda", id: b.dataset.help || "empezar"}); });
document.addEventListener("input", e => { if(e.target.id!=="hc-q") return; HQ = e.target.value; const l = document.getElementById("hc-list"); if(l) l.innerHTML = ayudaToc(ayudaArts(), view.id); });
// ---- lo que explica: premisas, panoramas y cuestionamientos ----
const refDec = (p, d) => `${p.area}/${p.slug}#${d.id}`;
function premisasCard(){
  const ps = (META && META.premisas) || [], vig = ps.filter(x=>x.vigente);
  if(!vig.length) return "";
  const cuest = ((META && META.cuestionamientos) || []).filter(c=>c.a_proyecto==="premisa" && c.abierto);
  const nRe = ps.length - vig.length;
  return `<section class="due prem"><div class="top"><h2>Premisas${hq("premisas","Premisas")}</h2><span class="c">${vig.length}</span><span class="c" style="margin-left:auto">Lo que la dirección confirmó y sobre lo que se construye todo</span></div>
    <ul class="prem-l">${vig.map(x=>{ const cq = cuest.filter(c=>c.a_id===x.id); return `<li><span class="pid">${esc(x.id)}</span><span class="pt">${inline(x.texto)}</span><span class="pm">Confirmó ${esc(x.confirmo||"—")}${x.fecha?` · ${fmtD(x.fecha)}`:""}${x.reemplaza?` · reemplaza a ${esc(x.reemplaza)}`:""}${cq.length?` · <span class="pill soon">${cq.length} cuestionamiento${cq.length===1?"":"s"} abierto${cq.length===1?"":"s"}</span>`:""}</span></li>`; }).join("")}</ul>
    ${nRe?`<p class="more">${nRe} premisa${nRe===1?" reemplazada queda":"s reemplazadas quedan"} como historia en <code>base/premisas.md</code>.</p>`:""}</section>`;

    else if(view.lvl==="ayuda") renderAyuda(view.id);
    else { view = {lvl:"root"}; renderRoot(); }
  }catch(err){
    console.error(err);
    document.getElementById("main").innerHTML = `<p class="empty">No se pudo mostrar esta página (${esc(err && err.message || err)}). Vuelve a cargar la página; si sigue, avisa a quien administra la carpeta.</p>`;
  }
  const md = document.getElementById("modal"); if(md){ md.innerHTML = prioModal() || mtModal() || entModal(); document.body.classList.toggle("modal-open", !!(PRIO_OPEN || MT_OPEN || ENT_OPEN)); }
  const sb = document.getElementById("stale"); if(sb) sb.innerHTML = staleBanner();
  const f = document.getElementById("foot");
  f.innerHTML = META ? esc(`Al día del ${fmtL(META.snapshot)} · puesto al día desde la carpeta el ${new Date(META.sincronizado).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(/\.$/,"")}. Lee de la carpeta la guía, cada área y, de cada proyecto, su ficha, sus decisiones, su bitácora y los datos de sus entregables; ${META.modo==="completo" ? "todo lo que tu cuenta puede leer, salvo fuentes, taller y las carpetas «restringido»" : "nunca fuentes, taller ni lo restringido"}. La carpeta manda: lo que marcas aquí queda apuntado hasta que la sincronización lo pasa a la carpeta.`) : "";
}
(async ()=>{
  render();
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ DB = false; render(); return; }
  DB = db;
  const user = await window.claude.use("user");
  // Actúa quien entra con cuenta (contribuidor o editor); la cola admite escritura desde «interact». Sincronizar es solo del dueño, porque la tarea es de su cuenta.
  try{ const me = user ? await user.me() : null; CAN = !!(me && (me.id || me.canEdit)); OWNER = !!(me && me.isOwner); }catch(e){ CAN = false; OWNER = false; }
  // Conector de tareas programadas: sin él no existe «Sincronizar ahora». Se carga después del usuario y se repinta.
  try{ MCP = await window.claude.use("mcp"); }catch(e){ MCP = null; }
  render();
  db.collection("areas").onSnapshot(snap=>{ AREAS = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); areaBy = Object.fromEntries(AREAS.map(a=>[a.slug,a])); const pr = ready.a; ready.a = true; if(!pr) view = parseHash(); render(); }, ()=>{ DB=false; render(); });
  db.collection("proyectos").onSnapshot(snap=>{ PROJ = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); byId = Object.fromEntries(PROJ.map(p=>[p.id,p])); const pr = ready.p; ready.p = true; if(!pr) view = parseHash(); render(); }, ()=>{ DB=false; render(); });
  db.collection("cambios").onSnapshot(snap=>{ CAMBIOS = snap.docs.map(s=>({id:s.id, ...s.data()})); render(); }, ()=>{});
  db.doc("meta/estado").onSnapshot(s=>{ META = s.exists ? s.data() : null; if(META && META.organizacion) document.title = "Tablero " + META.organizacion + (META.modo==="completo" ? " completo" : ""); render(); }, ()=>{});
  db.doc("enfoque/actual").onSnapshot(s=>{ ENFOQUE = s.exists ? s.data() : null; render(); }, ()=>{});
})();

// ---- tooltip propio: el nativo no aparece dentro del artifact y el CSS se recorta en el índice ----
(function(){
  const el = document.createElement("div"); el.id = "tip"; el.hidden = true; el.setAttribute("role","tooltip"); document.body.appendChild(el);
  let cur = null;
  function show(t){
    cur = t; el.textContent = t.dataset.tip; el.hidden = false;
    const r = t.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, m = 8;
    el.style.maxWidth = Math.min(300, vw - 2*m) + "px";
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(m, r.left), vw - w - m);
    let y = r.bottom + 7;
    if(y + h > vh - m) y = r.top - h - 7;
    if(y < m) y = m;
    el.style.left = x + "px"; el.style.top = y + "px";
  }
  function hide(){ cur = null; el.hidden = true; }
  document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t && t!==cur) show(t); else if(!t && cur) hide(); });
  document.addEventListener("mouseleave", e => { if(cur && e.target===cur) hide(); }, true);
  document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) show(t); });
  document.addEventListener("focusout", hide);
  document.addEventListener("keydown", e => { if(e.key==="Escape") hide(); });
  window.addEventListener("scroll", hide, true);
  document.addEventListener("click", hide, true);
})();
</script>
