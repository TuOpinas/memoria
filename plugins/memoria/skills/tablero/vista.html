      <li><b>Crea tu proyecto en Claude</b><span>En Projects, con el nombre «${ORG} · tu área», privado. Uno por persona, no uno para todos.</span></li>
      <li><b>Conecta la carpeta completa, no la de tu área</b><span>La que tiene dentro <code>guia.md</code> y <code>metodo.md</code>. Claude necesita ver todas las áreas para decirte qué se sabe ya y qué decisión de otra te afecta; dónde escribes lo fijan tu cuenta y los permisos de la carpeta. Conéctala en el proyecto, no en una conversación suelta, y cuando Claude pida permiso para usarla, deja que lo haga siempre.</span></li>
      <li><b>Instala el plugin</b><span>En Customize › Plugins, la flechita del botón Add › Add marketplace › Add from a repository. Escribe <code>TuOpinas/memoria</code>, deja activado Sync automatically y pulsa Sync; luego, en Discover, busca Memoria y pulsa Add. En Add › Manage marketplaces, <code>memoria</code> tiene que decir Synced, y entre tus plugins Memoria tiene que estar encendido: en algunas versiones se instala apagado. Si tu organización ya distribuye el plugin a todos, te saltas este paso.</span></li>
      <li><b>Compruébalo con una sesión</b><span>Escribe ${F("abre sesión en")} y el nombre de un proyecto de tu área. La respuesta empieza con un recuadro, «Memoria de trabajo», con la organización y la versión del método, y solo las filas que te piden algo. Después te pone al día y te propone en qué trabajar.</span></li>
      <li><b>Monta tu tablero</b><span>Escribe ${F("monta el tablero")} y aprueba la tarea que te pide la app: es la del botón «Sincronizar ahora». Para tenerlo siempre a mano, ábrelo en Chrome desde <code>claude.ai/artifacts</code> y guárdalo en la barra de marcadores.</span></li>
    </ol>
    <dl class="hc-def">
      <dt>El código, aparte</dt><dd>Si trabajas con código, sus repositorios van en otra carpeta de tu computadora, con todos los de la organización dentro, y se conecta también al proyecto. Nunca dentro de la carpeta de la memoria: Drive le añade archivos que confunden a Git.</dd>
      <dt>Para diseñar</dt><dd>Pídeselo a Claude en una conversación normal de tu proyecto: el diseño sale como un artifact y la memoria funciona como en cualquier otra conversación. No uses la interfaz aparte de Claude Design, que se retira en diciembre.</dd>
    </dl>
    <p class="hc-nota">No hay nada que pegar en las instrucciones del proyecto: el plugin aplica el método en cuanto ve la carpeta. Para sumar a otra persona: <button type="button" class="lnk" data-help="sumar">Sumar a un compañero</button>.</p>`},
  {g:"Para empezar", id:"sumar", t:"Sumar a un compañero", h:`
    <p>Para que otra persona trabaje con la memoria de ${ORG} hacen falta tres cosas. Las dos primeras las hace la organización; la tercera es mandarle un mensaje, y el resto lo hace esa persona siguiendo la guía de la carpeta.</p>
    <ol class="hc-pasos">
      <li><b>Ponla en el mapa, como responsable o como colaboradora</b><span>Si va a llevar un área, su correo va en la columna Cuenta de esa área: ${F("añade a [nombre] con [correo] como responsable del área [área] en guia.md")}. Si va a trabajar en el área de otra persona, va en la misma celda como colaboradora: ${F("añade a [nombre] con [correo] como colaborador del área [área]")}. Si solo va a trabajar en un proyecto, se declara en ese proyecto: ${F("añade a [nombre] con [correo] como colaborador de este proyecto")}, en una sesión del responsable del área. La tabla de <code>guia.md</code> la escribe ${CTX}. Sin nada de eso, Claude le preguntará antes de escribir.</span></li>
      <li><b>Compártele la carpeta</b><span>Lo hace ${ADM}, desde Google Drive en la web: «Lector» en toda la carpeta ${ORG}, y «Gestor de contenido» en la carpeta del área donde va a escribir (clic derecho › Compartir), o solo en la del proyecto si colabora en uno. «Colaborador» no sirve, porque no deja mover ni borrar archivos, y «Gestor de contenido» en la unidad entera le abriría la escritura en todas las áreas. Si la carpeta está en «Mi unidad» y no en una unidad compartida, los roles son «Lector» y «Editor». Si hay algo que esa persona no deba leer, se marca con acceso limitado antes de compartir.</span></li>
      <li><b>Mándale las instrucciones</b><span>Copia este mensaje y envíaselo por correo o por chat.</span></li>
    </ol>
    <div class="frase"><code class="frase-t" style="white-space:pre-line">${esc(MSG_SUMAR)}</code><button type="button" class="chip" data-copy="${esc(MSG_SUMAR)}">Copiar</button></div>
    <p class="hc-nota">Si la carpeta de ${ORG} no vive en Google Drive, los pasos 2 y 3 del mensaje son los de su nube: aceptar la carpeta compartida y tenerla siempre descargada en la computadora. Con los archivos solo en la nube, Claude no puede leerlos, y el tablero sale vacío.</p>
    <p class="hc-nota">Si dos personas escriben en la misma área, que no cierren sesión del mismo proyecto al mismo tiempo: las dos escrituras pueden pisarse.</p>`},
  {g:"Para empezar", id:"carpeta-drive", t:"Montar la carpeta en Drive", h:`
    <p>Lo hace ${ADM}, una vez, antes de que nadie se conecte. El resto del equipo no tiene que hacer nada de esto.</p>
    <dl class="hc-def">
      <dt>Mejor una unidad compartida</dt><dd>Sus archivos son de la organización y no de una persona: si alguien se va, nada se pierde. Las unidades compartidas son de Google Workspace; con una cuenta personal de Gmail no las hay, y la carpeta va en «Mi unidad» de quien administra, compartida con el equipo. Entonces los archivos son de esa persona: si deja la organización, hay que pasarlos antes a otra cuenta.</dd>
      <dt>La raíz</dt><dd>La unidad entera o una carpeta de su primer nivel, con <code>guia.md</code> y <code>metodo.md</code> dentro. Una sola por organización, con un nombre sin signos raros.</dd>
      <dt>Los permisos</dt><dd>En la unidad compartida, todo el equipo como «Lector» y solo quien la administra como «Administrador». En la carpeta de cada área (clic derecho › Compartir), «Gestor de contenido» para su responsable y quienes colaboran en ella; quien colabora en un solo proyecto, solo en la carpeta de ese proyecto. Nunca «Colaborador», que no deja mover ni borrar archivos, ni «Gestor de contenido» en la unidad entera, que abre la escritura en todas las áreas. En «Mi unidad», los roles son «Lector» y «Editor». Lo que no puede leer todo el equipo se marca en su carpeta con el acceso limitado de Drive, desde la web; en una unidad compartida lo pone quien la administra.</dd>
      <dt>En cada computadora</dt><dd>Cada persona marca la carpeta «Disponible sin conexión» y la conecta a Claude, como dice <button type="button" class="lnk" data-help="conectarte">Conectarte</button>. En Windows la unidad aparece como una letra de disco aparte (por ejemplo, G:) y se conecta igual: Claude trabaja con ella algo más lento, y para mover archivos necesita el conector de Google Drive activado en Claude.</dd>
    </dl>
    <p class="hc-nota">Para sumar a alguien después: <button type="button" class="lnk" data-help="sumar">Sumar a un compañero</button>.</p>`},
  {g:"Para empezar", id:"primera-sesion", t:"Tu primera sesión", h:`
    <p>Una sesión es un rato de trabajo sobre un proyecto. Al abrirla, Claude solo lee. Al cerrarla, escribe lo que pasó.</p>
    <figure class="hc-chat">
      <div class="yo"><span>Tú</span><p>abre sesión en nuevo catálogo</p></div>
      <div class="ia"><span>Claude</span><p><b>Dónde quedó todo.</b> El catálogo 2027, para tener precios nuevos antes de enero. La última sesión dejó el borrador de la tabla de precios; falta que Finanzas confirme los márgenes.</p><p><b>Avisos.</b> Logística decidió el lunes cambiar el plazo de entrega, y su decisión nombra este proyecto.</p><p><b>Por dónde seguir.</b> Ajustar la tabla al plazo nuevo, o preparar la consulta a Finanzas. ¿Por cuál empezamos?</p></div>
      <div class="sep">trabajas con Claude: lo que produce se guarda en el proyecto en cuanto existe, como borrador</div>
      <div class="yo"><span>Tú</span><p>cierra la sesión</p></div>
      <div class="ia"><span>Claude</span><p>Antes de registrar, confírmame esta decisión: <b>«El catálogo 2027 usa el plazo de entrega nuevo de Logística»</b>. Lo registrado en decisiones ya no se corrige.</p></div>
      <div class="yo"><span>Tú</span><p>sí</p></div>
      <div class="ia"><span>Claude</span><p>Escritas la bitácora, la decisión y el estado del proyecto. Para la próxima: la respuesta de Finanzas.</p></div>
      <figcaption>Un ejemplo inventado. El proyecto y los datos cambian; la forma de la conversación es siempre esta.</figcaption>
    </figure>
    <ul class="hc-l">
      <li><b>Al abrir</b>, Claude te dice dónde quedó todo, lo que llegó del tablero para ese proyecto, los avisos de otras áreas y dos o tres opciones para seguir. Espera a que elijas.</li>
      <li><b>Mientras trabajas</b>, todo lo que produce (un documento, un análisis, un PDF) se guarda en la carpeta del proyecto en ese momento, como borrador.</li>
      <li><b>Al cerrar</b>, escribe la bitácora, te enseña las decisiones que detectó y no registra ninguna sin tu confirmación. Pone al día el estado y los siguientes pasos, deja apuntado el cierre para tu tablero y te dice si hay que avisar a otra área.</li>
      <li><b>Si te vas sin cerrar</b>, la siguiente sesión lo nota, te pregunta qué pasó y lo registra entonces.</li>
    </ul>`},
  {g:"Para empezar", id:"varias-memorias", t:"Más de una memoria", h:`
    <p>Una memoria es una carpeta por organización o por mundo, y conviene tener varias si trabajas en varios: una para el trabajo, que puede ser compartida con tu equipo; otra para tus temas personales; otra para la casa. Cada una tiene su propia <code>guia.md</code>, sus áreas y su tablero, y no se mezclan.</p>
    <ul class="hc-l">
      <li><b>Temas distintos en cada una.</b> Lo que va en una no tiene por qué saberse en otra: la memoria del trabajo no lee la de la casa, ni al revés.</li>
      <li><b>Un proyecto de Claude por memoria.</b> Lo más cómodo es un proyecto por carpeta, con su tablero. Se pueden conectar dos carpetas a la misma sesión, pero no es recomendable: Claude trabaja en una a la vez, te pregunta en cuál antes de leer o escribir, y nada pasa de una a otra salvo que tú lo pidas y lo confirmes pieza a pieza.</li>
      <li><b>Se montan igual.</b> ${F("monta la carpeta de…")} con una carpeta vacía crea la guía, el método y la primera área; para una memoria personal, tú eres la única cuenta y todas las áreas son tuyas.</li>
    </ul>`},
  {g:"Cada día", id:"frases", t:"Qué decirle a Claude", h:`
    <p>Hablas con Claude como siempre. Estas frases funcionan tal cual, y también sus variantes.</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Dices</th><th>Pasa</th></tr></thead>
      <tbody>
        <tr><td>${F("abre sesión en X")}<br>${F("¿en qué quedamos con X?")}<br>${F("¿cómo va X?")}</td><td>Te pone al día y propone por dónde seguir. Solo lee. Si X es un proyecto tuyo, preguntar cómo va ya abre la sesión.</td></tr>
        <tr><td>${F("cierra la sesión")}<br>${F("guarda lo de hoy")}</td><td>Registra lo que pasó (las decisiones, con tu confirmación) y deja apuntado el cierre para que tu tablero te avise de que tiene algo nuevo que traer.</td></tr>
        <tr><td>${F("¿qué sabemos de X?")}</td><td>Busca en toda la carpeta y te dice qué hay y dónde. No escribe nada.</td></tr>
        <tr><td>${F("¿dónde guardo esto?")} y pegas o adjuntas</td><td>Lo coloca en su sitio y te dice dónde quedó.</td></tr>
        <tr><td>${F("prepara un documento con…")}</td><td>Crea el documento en el proyecto, en borrador.</td></tr>
        <tr><td>${F("revisa X")}<br>${F("¿esto está listo?")}</td><td>Busca lo desfasado o sin fuente y te lo enseña.</td></tr>
        <tr><td>${F("ya lo aprobó…")} y el nombre del responsable</td><td>Lo publica como vigente, si cumple los requisitos.</td></tr>
        <tr><td>${F("[nombre] con [correo] es el responsable del área [área]")}<br>${F("añade a [nombre] con [correo] como colaborador del área [área]")}</td><td>Solo el responsable del contexto: escribe en el mapa de la carpeta quién lleva cada área y quién colabora en ella. Falta además darles permiso en la carpeta compartida (<button type="button" class="lnk" data-help="sumar">Sumar a un compañero</button>).</td></tr>
        <tr><td>${F("añade a [nombre] con [correo] como colaborador de este proyecto")}</td><td>Solo el responsable del área, en una sesión del proyecto: esa persona escribe en ese proyecto y en ningún otro.</td></tr>
        <tr><td>${F("arranca un proyecto para…")}</td><td>Crea la carpeta del proyecto con todas sus piezas. Pide antes un responsable con nombre y apellido.</td></tr>
        <tr><td>${F("cierra el proyecto")}</td><td>Comprueba que está terminado y lo deja cerrado. No borra nada.</td></tr>
        <tr><td>${F("¿cómo va el área X?")}<br>${F("cuestiona el área")}</td><td>El director del área: su estatus, lo que pide atención y lo que no cuadra.</td></tr>
        <tr><td>${F("revisión de calidad de X")}<br>${F("audita la carpeta")}</td><td>Revisa a fondo un proyecto, un documento, un desarrollo o la carpeta entera contra su objetivo, y entrega lo que no cuadra, comprobado.</td></tr>
        <tr><td>${F("quiero cuestionar…")}</td><td>Deja escrito qué no cuadra de una decisión o una premisa, para que su responsable responda.</td></tr>
        <tr><td>${F("lo mantengo, porque…")}<br>${F("lo cambio: …")}</td><td>Responde a un cuestionamiento abierto a tu proyecto. Queda como decisión al cerrar y el cuestionamiento se cierra.</td></tr>
        <tr><td>${F("registra como premisa que…")}<br>${F("la premisa P2 cambia a…")}</td><td>Solo el responsable del contexto: escribe la premisa que la dirección confirmó, o la que reemplaza a otra.</td></tr>
        <tr><td>${F("sincroniza el tablero")}</td><td>Pone el tablero al día ahora, con lo que otras personas hayan escrito.</td></tr>
        <tr><td>${F("ordena Claude outputs")}</td><td>Lleva a su proyecto lo que la app dejó en la carpeta «Claude outputs».</td></tr>
      </tbody>
    </table></div>
    <p class="hc-nota"><b>Tres cosas que Claude no hace aunque se lo pidas de pasada:</b> dar un documento por aprobado sin que lo diga su responsable, cambiar lo ya registrado en decisiones o en la bitácora, y mover algo que parece confidencial. En los tres casos te lo dice y propone; decides tú o el responsable.</p>`},
  {g:"Cada día", id:"modelos", t:"Qué modelo usar", h:`
    <p>El modelo se elige abajo, junto a donde escribes. Para trabajar con la memoria conviene <b>Opus</b> para todo: abrir y cerrar sesión, preguntar cómo va algo, colocar material y el trabajo de cada proyecto.</p>
    <dl class="hc-def">
      <dt>Opus, por defecto</dt><dd>En la misma apertura de sesión, repetida tres veces con cada modelo, Opus tardó en promedio 40 segundos y Sonnet 57, con los mismos tokens y menos pasos. Opus siguió mejor las reglas del método; Sonnet llegó a dar un dato equivocado en el recuadro de apertura.</dd>
      <dt>Lo más difícil</dt><dd>Para una revisión de calidad a fondo, decisiones de estrategia o de arquitectura y tareas largas de muchos pasos, el modelo más capaz que tengas disponible.</dd>
      <dt>Sonnet y Haiku</dt><dd>Sonnet funciona, pero en lo medido (la apertura) rindió menos: tardó más y se saltó una regla. Haiku no se ha probado con el método. El cierre de sesión y la puesta al día del tablero no se midieron: la recomendación sale de la apertura. Opus cuesta más por token que Sonnet; con los mismos tokens y menos pasos, la diferencia en una apertura es pequeña.</dd>
    </dl>
    <p class="hc-nota">Si una conversación empezó con otro modelo, se puede cambiar a mitad: conserva todo lo hablado.</p>`},
  {g:"Cada día", id:"telefono", t:"Desde el teléfono", h:`
    <p>Desde el teléfono o la web, sin la carpeta conectada, Claude puede leer la memoria si vive en Google Drive: abrir sesión para ponerte al día, preguntar ${F("¿qué sabemos de…?")} o pedirle al director cómo va un área. La respuesta empieza con «Memoria en solo lectura».</p>
    <dl class="hc-def">
      <dt>Lo que no hace</dt><dd>No escribe nada en la carpeta: ni decisiones, ni bitácora, ni tareas. Lo que salga de esa conversación se guarda, con tu sí, como nota en tu tablero, y la siguiente sesión desde la computadora lo registra.</dd>
      <dt>Lo que necesitas</dt><dd>El conector de Google Drive activado en Claude, y que la carpeta de ${ORG} esté en Drive. Si está en iCloud o en tu computadora, desde el teléfono solo verás el tablero.</dd>
      <dt>El tablero</dt><dd>Se ve en el teléfono, y desde él puedes fechar, marcar o anotar tareas; queda pendiente hasta que el tablero se ponga al día (<button type="button" class="lnk" data-help="del-tablero">Lo que tocas aquí</button>).</dd>
    </dl>`},
  {g:"Cada día", id:"si-algo-falla", t:"Si algo falla", h:`
    <dl class="hc-qa">
      <dt>Claude dice que no ve la carpeta.</dt><dd>Añádela a la conversación con «+». Si ya estaba, comprueba que está sincronizada en tu computadora y que la app de Claude está abierta.</dd>
      <dt>Al abrir sesión no aparece el recuadro «Memoria de trabajo».</dt><dd>Claude no encontró la carpeta o el plugin no está activo. Revisa que la conversación está dentro de tu proyecto, que es de Cowork si tu versión separa Chat y Cowork, que la carpeta está conectada al proyecto y que el plugin está encendido. Más en <button type="button" class="lnk" data-help="conectarte">Conéctate una vez</button>.</dd>
      <dt>Claude me pregunta dónde escribir.</dt><dd>Tu cuenta no está en el mapa de <code>guia.md</code>, ni como responsable ni como colaborador, ni en el proyecto donde trabajas. Dile en qué área trabajas para seguir hoy, y pide a ${CTX} que añada tu cuenta en <code>guia.md</code>.</dd>
      <dt>Dice que la carpeta usa una versión del método más nueva que la mía.</dt><dd>Tu plugin se quedó atrás. En Customize › Plugins, Add › Manage marketplaces, sincroniza <code>memoria</code>; con Sync automatically encendido no vuelve a pasar.</dd>
      <dt>El tablero sale vacío o le faltan áreas.</dt><dd>Los archivos de la carpeta siguen solo en la nube. Marca la carpeta «Disponible sin conexión» en el Finder o en el Explorador de archivos, espera a que se descarguen y pulsa «Sincronizar ahora».</dd>
      <dt>Cambié de computadora y el botón «Sincronizar ahora» no hace nada.</dt><dd>El botón está ligado a la computadora donde montaste el tablero. En la nueva, con la carpeta conectada, dile a Claude ${F("cambié de computadora: pon al día la tarea del tablero")} y aprueba el cambio que te pide la app.</dd>
      <dt>No puedo instalar la app.</dt><dd>Lo más común es el disco lleno: la primera vez descarga más de 1 GB. Libera espacio y vuelve a intentarlo; en Windows Home puede no funcionar la parte de carpetas.</dd>
      <dt>Una carpeta no se deja leer.</dt><dd>Está restringida para tu cuenta. Claude te lo dice y sigue con el resto. Si la necesitas, pide acceso a su responsable.</dd>
      <dt>Lo que hice hoy no aparece en el tablero.</dt><dd>Aparece cuando lo pones al día: pulsa «Sincronizar ahora» o dile a Claude ${F("sincroniza el tablero")}, con tu computadora encendida y la app abierta. Tarda unos minutos. Si cerraste la sesión, en Mantenimiento de Inicio verás el aviso de que hay sesiones que aún no muestra.</dd>
      <dt>Pegué algo con datos personales, contratos o facturación.</dt><dd>Claude te lo dice antes de guardarlo y propone dejarlo en la parte restringida del proyecto. Decides tú; no mueve nada sin tu sí.</dd>
      <dt>Claude quiere escribir en otra área.</dt><dd>No debería: escribe solo en las áreas y proyectos donde tu cuenta es responsable o colabora. Si algo le toca a otra, te dice a quién pedírselo.</dd>
    </dl>`},
  {g:"El tablero", id:"tablero", t:"Tu tablero", h:`
    <p>Una página que resume la carpeta entera: áreas, proyectos, en qué va cada uno, qué se decidió y qué falta. Es personal: cada persona monta el suyo desde su cuenta, con ${F("monta el tablero")}, y ve lo que su cuenta puede leer.</p>
    <dl class="hc-def">
      <dt>Tres niveles, la misma forma</dt><dd>Inicio, cada área y cada proyecto tienen cuatro pestañas, y cada una contesta una pregunta: <b>Estatus</b>, cómo está y qué cambió; <b>Acciones</b>, qué te toca y por dónde empezar; <b>Actividad</b>, qué pasó y quién lo hizo; y <b>Qué hay</b>, qué ha producido el trabajo. En Inicio, la última es <b>Mantenimiento</b>, lo que estorba. Solo Acciones y Mantenimiento llevan un número. La pestaña que eliges se queda al pasar a otra área o a otro proyecto, también desde el índice de la izquierda. En la cabecera de un área o un proyecto, su descripción ocupa dos líneas; «Ver más» la abre entera, con lo que el proyecto deja fuera.</dd>
      <dt>Estatus</dt><dd>Arriba, <b>Últimos 7 días</b>: sesiones, decisiones y documentos publicados de la última semana. Después, <b>Avanzaron otros</b>: lo que otras personas trabajaron en tus proyectos desde tu última sesión en cada uno, con el tema y los avances de cada sesión y las decisiones que registraron; lo que pasó en proyectos que no son tuyos va plegado. Solo sale lo que ya trajo la última puesta al día. En Inicio siguen qué es la organización (el primer párrafo de la guía de la carpeta), una ficha por área con el titular de su Estatus y su primer «Siguiente», y un pie que solo cuenta lo que pide algo: por decidir, vencidas, quién avanzó, y cuántas sesiones hubo esta semana o que no hubo ninguna. En el área, su Estatus entero, que firma su responsable al cerrar sesión, con sus prioridades debajo de «Siguiente» y «Atender» en cada una, y una ficha por proyecto. En el proyecto, su Estatus firmado: lo que se completó, lo que sigue, lo que falta decidir y lo que preocupa. Al final, <b>Esperas a</b>: una fila por persona que te debe algo, con «Ya llegó» (una línea opcional; si era una decisión, te pregunta qué se decidió) y «Ya no aplica». Las dos se pueden deshacer hasta que la carpeta las registre.</dd>
      <dt>Acciones</dt><dd>Arriba, <b>Por dónde empezar</b>: los grupos de tareas que más avanzan con una sola sesión, con «Empezar con Claude», que copia la frase para pegársela. Después, <b>Te toca decidir</b>: lo que falta decidir en tus proyectos y las tareas que empiezan por decidir, definir o elegir, leído como pregunta y con «Decidir con Claude»; solo lleva señal cuando la decisión bloquea algo («Bloquea 3 tareas», «con Ana Centeno»). Luego, <b>Tareas críticas</b>: las que tienen fecha a dos semanas de hoy, hacia atrás o hacia delante, y además están en «Siguiente», sirven a una prioridad del área o tocan a un cliente; las vencidas primero, de la más vieja a la más nueva. Cada una se marca «Hecha», recibe una «Nueva fecha» o se quita con «Ya no aplica» ahí mismo. Al final, <b>Decisiones que te afectan</b>: lo que otra persona decidió en otro proyecto y nombra a uno tuyo, o lo que alguien de la carpeta decidió dentro de uno tuyo, con «Aceptar» y «Cuestionar» (una línea con el porqué y el proyecto desde el que lo registras). Sale hasta que lo aceptas o lo cuestionas, o hasta que pasan 30 días. Las dos van a la cola y se pueden deshacer hasta que una sesión tuya las registre (<button type="button" class="lnk" data-help="del-tablero">Lo que tocas aquí</button>). En el área y el proyecto, Acciones lleva lo mismo filtrado y, al final, <b>Por poner al día</b>. Para saber quién eres, el tablero toma el nombre que la carpeta da a tu cuenta: el responsable del área, o «Nombre (correo)» en una línea «Colabora:»; si no lo encuentra, te lo dice y no te atribuye nada. Alguien de fuera se reconoce cuando la tarea o el Estatus lo nombra como «Nombre Apellido (Organización)»; unas palabras con mayúscula no son una persona, ni un nombre de pila basta para alguien de fuera que ese proyecto no nombra.</dd>
      <dt>Actividad</dt><dd>Lo que se hizo en los últimos 7 o 28 días, con el mismo arranque en los tres niveles: el periodo y sus cifras. En Inicio y el área, por área, por proyecto y por persona; en el proyecto, su registro de sesiones y decisiones del periodo, con «Ver anteriores» y «Cuestionar» en cada decisión de otra persona. Sale de la bitácora: cada entrada dice quién cerró la sesión, qué documentos escribió y cuáles publicó, y cada decisión quién la tomó. De un archivo que cambió sin sesión el tablero sabe cuál y cuándo, pero no quién; por eso cerrar la sesión importa.</dd>
      <dt>Por persona</dt><dd>Todos los que escriben en la carpeta, responsables y colaboradores de cada área y proyecto, también quien no hizo nada en el periodo, para darle seguimiento: abajo, en gris, quien no tuvo sesión, decisión ni documento, con la fecha de su última sesión. De cada uno, sesiones, decisiones, documentos escritos y publicados y tareas abiertas; lo que vale cero no se escribe. Al pasar por el nombre dice su papel. Un documento cuenta como escrito para quien lo escribió y como publicado para quien lo publicó: lo dicen las líneas «Escribió:» y «Publicó:» de cada sesión. Una sesión que no dice quién la cerró no se le cuenta a nadie. Las tareas abiertas son las de «Siguientes pasos» que nombran a la persona. Un nombre de pila que llevan dos personas, sin apellido, no se le cuenta a ninguna.</dd>
      <dt>Qué hay</dt><dd>En el área y el proyecto, lo que el trabajo ha producido: arriba, un resumen de <b>Lo publicado</b> y de lo que hay <b>En el taller</b>, con cuántos documentos están vigentes y en borrador y cuáles se quedaron viejos frente a una decisión posterior. Debajo, plegados para consultar, los entregables, el taller y todas las tareas del proyecto. Cada pieza lleva su estado, su fecha y la línea de su cabecera que dice qué aporta; la reemplazada dice por cuál. Del taller solo se enseña el inventario: su contenido sigue siendo privado del área. Una frase de resumen que sugirió la memoria sale como provisional, y solo la acepta el dueño del tablero en los proyectos donde su cuenta escribe; la escribe el próximo cierre del proyecto.</dd>
      <dt>Consulta</dt><dd>En el índice: <b>Agenda</b> (lo que tiene fecha, los próximos catorce días y lo vencido), <b>Decisiones</b> (por área o por persona, primero las de dentro y después las de fuera) y <b>Entregables</b> (lo publicado, con lo que aporta y cuántos proyectos lo citan).</dd>
      <dt>Mantenimiento</dt><dd>Solo en Inicio. <b>Arreglar ya</b>: lo que estorba hoy y quién lo arregla (permisos de Drive que no cuadran, una línea de la guía que falta, si eres quien responde por el contexto, sesiones que el tablero aún no muestra, datos de otra versión o días sin ponerse al día, la tarea del tablero que pide aprobación); es el único número, y cuando trae algo sale además una línea amarilla encima de las pestañas. <b>Proyectos por poner al día</b>: una fila por proyecto con lo que su memoria tiene flojo (un Estatus viejo, borradores viejos, tareas vencidas hace más de dos semanas, lo que la memoria sugiere) y una sola frase para arreglarlo en una sesión; las frases de resumen sugeridas se ven antes de aceptarlas. Plegado al final, lo marcado aquí que la carpeta aún no refleja, con «Deshacer».</dd>
      <dt>Dos voces</dt><dd>La línea de estado de un proyecto la calcula el tablero con lo que hay escrito: fechas, decisiones, tareas. No inventa nada y no opina. El juicio (qué preocupa, hacia dónde va) es el Estatus, que se firma al cerrar sesión.</dd>
      <dt>Actuar desde él</dt><dd>Puedes poner fecha a una tarea, marcarla hecha, anotar algo o corregir cómo lee el estado de un proyecto. Queda pendiente (⟳) hasta que está escrito en la carpeta.</dd>
      <dt>No se comparte</dt><dd>Muestra todo lo que tu cuenta lee, incluido lo restringido, así que es solo para ti. Quien quiera ver la carpeta así monta el suyo con ${F("monta el tablero")}, y ve lo que su cuenta puede leer.</dd>
    </dl>`},
  {g:"El tablero", id:"ponerse-al-dia", t:"Cómo se pone al día", h:`
    <p>El tablero no lee la carpeta en vivo: muestra lo que había la última vez que se puso al día. El pie de la página dice cuándo fue.</p>
    <figure class="hc-flujo" aria-label="Cómo viaja la información entre la carpeta y el tablero">
      <div class="hc-flujo-g">
        <div class="hc-nodo carpeta"><b>La carpeta</b><small>La memoria. Lo que está escrito aquí es lo que vale.</small></div>
        <div class="hc-via ida"><div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M2 7h36M32 2l7 5-7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t"><b>La puesta al día</b><span>Cuando la pides, con el botón o con «sincroniza el tablero». Lee la carpeta y rehace lo que cambió.</span></span></div></div>
        <div class="hc-nodo tablero"><b>El tablero</b><small>Una ventana a la carpeta en la que se puede apuntar.</small></div>
        <div class="hc-via vuelta">
          <span class="hc-cola">Lo que tocas queda pendiente</span>
          <div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M42 7H6M12 2L5 7l7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t"><b>Lo mecánico</b><span>Lo escribe la siguiente puesta al día: fechas y tareas hechas con nota.</span></span></div>
          <div class="hc-carril"><svg class="hc-flecha" viewBox="0 0 44 14" aria-hidden="true"><path d="M42 7H6M12 2L5 7l7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/></svg><span class="t"><b>Lo que pide criterio</b><span>Lo escribe la siguiente sesión del proyecto, con una persona delante.</span></span></div>
        </div>
      </div>
      <figcaption>La página nunca escribe en la carpeta: solo apunta. Escriben la puesta al día y las sesiones.</figcaption>
    </figure>
    <dl class="hc-def">
      <dt>Cuando tú lo pides</dt><dd>El tablero no se pone al día solo: cada puesta al día es una tarea que gasta de tu plan, y así decides cuándo. Cada vez que cierras una sesión, Claude deja apuntado en el tablero que hubo un cierre, sin pedirte nada; al abrirlo, la pestaña Mantenimiento de Inicio te avisa de cuántas sesiones aún no muestra y de cuáles, con el botón para traerlas. Al pulsarlo trae lo que hay en la carpeta, escribe lo mecánico que marcaste aquí y renueva «Por dónde empezar» si cambió algo. Tarda unos minutos y la página se actualiza sola al terminar. Si al cerrar le pides a Claude «cierra y pon al día el tablero», lo lanza en ese momento, y la app te pide permiso para hacerlo.</dd>
      <dt>Lo que escriben otras personas</dt><dd>Los cierres que apunta Claude son los de tu cuenta; lo que cierran otras personas no llega a tu tablero solo. Para traerlo, el botón «Sincronizar ahora», junto al nombre arriba a la izquierda (lo ve solo quien montó el tablero), o dile a Claude ${F("sincroniza el tablero")}. El botón no corre nunca solo; cuando lo pulsas, tu computadora tiene que estar encendida con la app abierta. Si lleva un punto, hace falta sincronizar: hubo sesiones cerradas después de la última vez, hay cosas marcadas aquí que la sincronización pasa a la carpeta, o la página y los datos son de versiones distintas. A su lado dice cuánto hace de la última sincronización; lo que alguien escribió en la carpeta después no lo puede ver, pero si nada cambió, la sincronización lo comprueba al empezar y termina enseguida. Si sale apagado, al pasar por encima dice qué le falta.</dd>
      <dt>Cada mañana, si lo pides</dt><dd>En una carpeta donde escriben varias personas puede convenir que se ponga al día solo cada mañana: pídelo con ${F("pon el tablero al día cada mañana")}. Corre en tu computadora, que tiene que estar encendida con la app abierta a esa hora.</dd>
      <dt>Versiones nuevas</dt><dd>Cuando sale una versión del método, la página se actualiza sola la siguiente vez que se pone al día. No hace falta hacer nada.</dd>
    </dl>`},
  {g:"El tablero", id:"del-tablero", t:"Lo que tocas aquí", h:`
    <p>La página no escribe en la carpeta. Lo que tocas se apunta en una lista de pendientes y se ve marcado (⟳) hasta que está escrito. Mientras siga pendiente, puedes deshacerlo tocándolo otra vez.</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Lo que tocas</th><th>Quién lo escribe</th><th>Cómo queda en la carpeta</th></tr></thead>
      <tbody>
        <tr><td>Cambiar la fecha de una tarea</td><td>la puesta al día</td><td>La fecha nueva en la línea de la tarea, en la ficha del proyecto.</td></tr>
        <tr><td>Marcar una tarea como hecha, con nota</td><td>la puesta al día</td><td>Quita la tarea y añade a la bitácora una entrada «(tarea)» con la tarea y tu nota. Solo si la tarea no es una decisión.</td></tr>
        <tr><td>«Ya no aplica» en una tarea vencida, o en el «⋯» de una tarea</td><td>la puesta al día</td><td>Quita la tarea y apunta en la bitácora que se retiró porque ya no aplica, no como avance.</td></tr>
        <tr><td>Marcar hecha sin nota, o una tarea que es decidir, definir o aprobar algo</td><td>la siguiente sesión</td><td>Claude te pregunta qué pasó y lo registra. A veces de ahí sale una decisión.</td></tr>
        <tr><td>Anotar algo en un proyecto</td><td>la siguiente sesión</td><td>Claude lo registra donde le toque.</td></tr>
        <tr><td>Corregir cómo lee el tablero una tarea o el estado</td><td>la siguiente sesión</td><td>Si lo apruebas, Claude reescribe la tarea o el estatus.</td></tr>
        <tr><td>Marcar una prioridad del área como cumplida o retirada (en el Estatus del área)</td><td>el responsable del área</td><td>Una sesión suya la quita de las prioridades.</td></tr>
        <tr><td>«Ya llegó» o «Ya no aplica» en Esperas a</td><td>la puesta al día o la siguiente sesión</td><td>Como una tarea hecha o retirada; si lo que esperabas era una decisión, la sesión registra lo que se decidió.</td></tr>
        <tr><td>«Aceptar» una decisión que te afecta</td><td>tu siguiente sesión en el proyecto que elegiste</td><td>Una línea en la bitácora de esa sesión con la decisión aceptada, y una tarea si pide algo en tu proyecto.</td></tr>
        <tr><td>«Cuestionar» una decisión</td><td>tu siguiente sesión en el proyecto que elegiste</td><td>Un cuestionamiento en sus decisiones: Claude te pide el dato o la fuente que lo sostiene, te lo enseña escrito y espera tu sí. Avisa a quien decidió.</td></tr>
      </tbody>
    </table></div>
    <p class="hc-nota">Lo que aún no está escrito se ve en Mantenimiento de Inicio, en «Marcado aquí, por registrar». La puesta al día ocurre cuando pulsas «Sincronizar ahora» o cuando pides ${F("sincroniza el tablero")} (<button type="button" class="lnk" data-help="ponerse-al-dia">Cómo se pone al día</button>). Al abrir sesión en un proyecto, lo primero que Claude enseña es lo que llegó del tablero para ese proyecto.</p>`},
  {g:"El tablero", id:"estado-proyecto", t:"Cómo lee cada proyecto", h:`
    <p>De cada proyecto, el tablero enseña tres cosas: cómo va, en qué estado está y qué tareas tiene. Solo la primera la escribe una persona con Claude; las otras dos las calcula el tablero con lo que hay escrito.</p>
    <h3 class="hc-h">Cómo va</h3>
    <p>La pestaña Estatus de cada proyecto abre con su Estatus, el reporte del director: una frase con lo último que se completó y lo que sigue, y debajo lo que se completó, lo siguiente con quién y cuándo, lo que falta decidir y lo que preocupa. Si solo vas a leer una cosa, es esta.</p>
    <p>Lo escribe Claude al cerrar cada sesión del proyecto, con la voz del director del área, y lo guarda con su fecha en la sección «Estatus» de su <code>proyecto.md</code>; el tablero solo lo muestra. Si la ficha cambió después, la tarjeta avisa de que puede no estar al día. Un proyecto que aún no tiene Estatus lo dice: lo escribe el cierre de su siguiente sesión.</p>
    <h3 class="hc-h">El estado</h3>
    <p>Sale de lo que dice su ficha y de cuándo fue su última sesión. Si no te parece bien, tócalo para corregirlo: queda pendiente para la siguiente sesión.</p>
    <dl class="hc-def">
      <dt>En curso</dt><dd>Tiene una sesión en los últimos 30 días y nada lo bloquea.</dd>
      <dt>Bloqueado</dt><dd>Su estado dice «en pausa», o todo lo abierto espera a alguien de fuera.</dd>
      <dt>Parado</dt><dd>Más de 30 días sin sesión, o ninguna registrada, tenga tareas abiertas o no. Nadie lo está moviendo, y si no tiene tareas, nada dice qué sigue.</dd>
      <dt>Sin iniciar</dt><dd>Su estado empieza por «Arrancando», o solo tiene la sesión de arranque (las entradas «(tarea)» no cuentan) y ningún documento.</dd>
      <dt>Cerrado</dt><dd>Su estado dice «Proyecto terminado». Queda como registro.</dd>
      <dt>En riesgo</dt><dd>Se suma a cualquier estado: dos o más tareas vencidas, o una espera a alguien de fuera ya vencida.</dd>
    </dl>
    <h3 class="hc-h">Las tareas</h3>
    <p>El tablero mira cómo empieza cada tarea para saber qué es, y lo trata distinto según el caso:</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Si empieza por</th><th>Es</th><th>Cómo lo trata</th></tr></thead>
      <tbody>
        <tr><td>«mantener…», «cada semana…»</td><td>Una rutina</td><td>Con fecha no vence: se revisa.</td></tr>
        <tr><td>«se revisa en…», «vence en…»</td><td>Una caducidad</td><td>Se revisa cuando llega su fecha.</td></tr>
        <tr><td>«esperar…», «cuando Ana conteste…»</td><td>Una espera a alguien de fuera</td><td>Si vence, el proyecto pasa a «En riesgo».</td></tr>
        <tr><td>«cuando…», «tras…», «una vez que…»</td><td>Algo que depende de otra cosa</td><td>Espera a que pase lo anterior.</td></tr>
        <tr><td>«decidir…», «definir…», «aprobar…»</td><td>Una decisión</td><td>Marcarlo hecho lo resuelve una sesión, no la puesta al día.</td></tr>
        <tr><td>Cualquier otra cosa</td><td>Una acción</td><td>Es lo que se agenda y lo que vence.</td></tr>
      </tbody>
    </table></div>
    <p>Si lee mal una tarea, corrígela con el botón ⋯ de su fila: queda pendiente para la siguiente sesión.</p>`},
  {g:"El tablero", id:"por-donde-empezar", t:"Lo que te propone Inicio", h:`
    <p>Inicio te dice qué hacer, de dos maneras: por dónde empezar, arriba de Acciones, y qué arreglar para que la memoria siga sirviendo, en Mantenimiento. Junto a cada cosa hay una frase para copiar y pegarle a Claude.</p>
    <h3 class="hc-h">Por dónde empezar</h3>
    <p>Cuando el tablero se pone al día, y solo si algo cambió, Claude elige tres o cuatro grupos de tareas de proyectos distintos que comparten algo: una persona, una herramienta, un documento o un trámite. Elige con tres criterios: que esté entre las prioridades del área, que toque a un cliente, una firma o dinero, y que desbloquee otros proyectos. Que una tarea esté vencida no la hace más importante. Es una sugerencia: la sesión decide.</p>
    <h3 class="hc-h">Mantenimiento</h3>
    <p>Primero, «Arreglar ya»: lo que estorba hoy, cada cosa con quién la arregla. Después, «Proyectos por poner al día»: una fila por proyecto con todo lo que su memoria tiene flojo y una sola frase para arreglarlo en una sesión; «Ahora no» la quita siete días. Plegado al final, lo que tocaste aquí y aún no está escrito. Cuenta como flojo:</p>
    <ul class="hc-l">
      <li>Un Estatus más viejo que el trabajo del proyecto, o archivos que cambiaron después de la última sesión registrada: hubo trabajo que nadie cerró.</li>
      <li>Tareas vencidas hace más de dos semanas, tareas abiertas sin fecha o mezcladas con rutinas y esperas, y líneas que cuentan algo que ya pasó en vez de una tarea.</li>
      <li>Revisiones periódicas a las que ya les tocó.</li>
      <li>Un objetivo o un alcance que sigue en borrador más de tres semanas.</li>
      <li>Documentos cuya base cambió después de escribirse, borradores de más de 30 días, y documentos publicados que el índice del área no describe.</li>
      <li>Lo que la memoria sugiere al ponerse al día: una decisión sin registrar, una tarea que parece hecha, una frase de resumen que falta.</li>
      <li>Cosas marcadas aquí que esperan una sesión, y archivos que Claude dejó fuera de los proyectos.</li>
    </ul>
    <p class="hc-nota">«Ahora no» esconde una línea siete días, solo en este navegador.</p>`},
  {g:"El tablero", id:"que-ve-cada-quien", t:"Qué ve cada quien", h:`
    <dl class="hc-def">
      <dt>Tu tablero</dt><dd>Todo lo que tu cuenta puede leer en la carpeta, incluido lo restringido y las cinco sesiones más recientes de cada proyecto enteras. Cada persona ve en el suyo lo que su cuenta lee: por eso no se comparte, y quien quiera uno lo monta con ${F("monta el tablero")}.</dd>
      <dt>El taller</dt><dd>El cuerpo de lo que hay en <code>taller/</code> es privado del área: ni el tablero ni otras áreas lo leen. Su inventario sí se enseña en «Qué hay» a quien lee el área: el nombre, el estado, la fecha y la línea de su cabecera que dice qué aporta, que por eso no lleva nada restringido ni personal.</dd>
      <dt>Restringido</dt><dd>Lo que la cuenta que genera el tablero no puede leer en la carpeta: sale con su nombre y su responsable, y nada más. Si lo necesitas, pide acceso a quien administra la carpeta. Si en vez de «Restringido» ves «Sin carpeta» o «Sin leer», la carpeta no estaba en la computadora al generar el tablero: no es un permiso.</dd>
    </dl>`},
  {g:"Para empezar", id:"permisos", t:"Los permisos de Drive", h:`
    <p>Que la carpeta diga quién escribe dónde no basta: lo que manda es Drive. Claude compara los permisos reales de la carpeta compartida con lo que declara la memoria (las áreas y sus responsables en <code>guia.md</code>, quién colabora, lo restringido) y dice qué no cuadra.</p>
    <dl class="hc-def">
      <dt>Cómo se revisa</dt><dd>Quien responde por el contexto, o quien administra la carpeta, le dice a Claude ${F("revisa los permisos")}. Claude lee los permisos con el conector de Google Drive, sin cambiar nada, y lo propone solo al cerrar una sesión en la que cambió quién escribe o qué se restringe. Un grupo de Google no se mira por dentro: Claude lo avisa y pide comprobar quién está en él.</dd>
      <dt>En el tablero</dt><dd>Si algo no cuadra, cada cambio sale en «Arreglar ya» de Mantenimiento, con una línea amarilla encima de las pestañas y un botón para aplicarlo con Claude o copiarlo para quien administra la carpeta. Lo que la revisión deja para comprobar a mano y, si todo cuadra, la fecha de la última revisión quedan al final de Mantenimiento. Solo lo ve el tablero de quien administra la carpeta.</dd>
      <dt>Quién lo arregla</dt><dd>Quien administra la carpeta. Una parte la puede aplicar Claude en su sesión, con su sí a la lista exacta: compartir como «Lector» y marcar con acceso limitado lo que la carpeta declara restringido, solo cuando sabe a quién conservar el acceso (${F("aplica los permisos")}; el texto que copia el botón lleva lo que hace falta). Dar «Gestor de contenido», bajar un rol o quitar a alguien se hace desde la web: el conector de Drive no lo permite. Si alguien escribe sin estar declarado, la pregunta es para quien responde por el contexto: ¿debe escribir?</dd>

    </dl>`},
  {g:"Anclar y cuestionar", id:"premisas", t:"Premisas y cuestionamientos", h:`
    <h3 class="hc-h">Las premisas</h3>
    <p>Una premisa es algo que la dirección confirmó y sobre lo que todos construyen: «este año vendemos solo en México», «el producto se construye en inglés». Salen en el Estatus de Inicio, después de las áreas, y Claude las tiene presentes en cada sesión.</p>

  {g:"Anclar y cuestionar", id:"director", t:"El director de cada área", h:`

  {g:"Cómo funciona", id:"piezas", t:"Las piezas y cómo se conectan", h:`

  {g:"Cómo funciona", id:"ordenada", t:"Cómo está ordenada la carpeta", h:`

  {g:"Cómo funciona", id:"quien-escribe", t:"Quién escribe y cómo lee Claude", h:`

      <dt>Dos personas en el mismo proyecto</dt><dd>Mejor no cerrar sesión a la vez. Si pasa, Claude compara al cerrar la hora de cada registro con la que vio al abrir, y si otra persona escribió mientras tanto, relee y suma lo suyo encima. Reduce el riesgo, no lo elimina: si la escritura de la otra persona aún no bajó a tu computadora, no la ve.</dd>

    <p>Así cada conversación empieza con el contexto justo, tarda menos y consume menos.</p>`},

const _norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

function ayudaToc(arts, cur){

  if(!vis.length) return `<p class="empty" style="font-size:13.5px">Ningún artículo habla de «${esc(HQ.trim())}».</p>`;
  const grupos = [...new Set(vis.map(a=>a.g))];
  return grupos.map(g => `<div class="hc-g"><span class="eyebrow">${esc(g)}</span>${vis.filter(a=>a.g===g).map(a=>`<button type="button" class="hc-i" data-help="${a.id}"${a.id===cur?' aria-current="page"':""}>${esc(a.t)}</button>`).join("")}</div>`).join("");
}

const AYUDA_ALIAS = {necesitas:"conectarte", "que-hay":"tablero", "por-persona":"tablero", "en-corto":"estado-proyecto", pasos:"estado-proyecto", "memoria-al-dia":"por-donde-empezar", cuestionar:"premisas", "como-lee":"quien-escribe"};

let HC_CUR = null;
function renderAyuda(id){
  id = AYUDA_ALIAS[id] || id;
  const head = document.getElementById("head"), main = document.getElementById("main");
  const arts = ayudaArts(), a = arts.find(x=>x.id===id) || arts[0];
  const grupos = [...new Set(arts.map(x=>x.g))];
  head.innerHTML = `<div class="eyebrow">Ayuda</div><h1>Cómo funciona la memoria</h1>`;
  main.innerHTML = `<div class="hc">
    <article class="hc-art hc-doc">${grupos.map(g => `<div class="hc-grupo" data-grupo="${esc(g)}"><span class="eyebrow hc-gt">${esc(g)}</span>${arts.filter(x=>x.g===g).map(x => `<section class="hc-sec" id="ay-${x.id}" data-sec="${x.id}"><h2 class="hc-st">${esc(x.t)}</h2>${x.h}</section>`).join("")}</div>`).join("")}
      <p class="empty" id="hc-nada" hidden></p></article>
    <nav class="hc-toc" aria-label="Secciones de la ayuda"><details id="hc-det"${window.innerWidth > 760 || HQ ? " open" : ""}><summary>Todas las secciones</summary>
      <div style="display:grid;gap:14px"><input type="search" id="hc-q" class="search" placeholder="Buscar en la ayuda" aria-label="Buscar en la ayuda" value="${esc(HQ)}">
      <div id="hc-list">${ayudaToc(arts, a.id)}</div></div>
    </details></nav>
  </div><button type="button" class="hc-fijo" id="hc-fijo" aria-label="Ir al índice de la ayuda">Secciones ↑</button>`;
  // en el teléfono la ayuda es una página larga y el índice queda arriba: un botón fijo vuelve a él y lo abre
  const fijo = document.getElementById("hc-fijo"); if(fijo) fijo.onclick = () => { const d = document.getElementById("hc-det"); if(d) d.open = true; window.scrollTo({top: 0, behavior: "smooth"}); };
  HC_CUR = a.id; hcFiltrar();
  const saltar = a !== arts[0];
  requestAnimationFrame(() => { if(saltar) irSeccion(a.id, true); hcToc(); });
  // lo que llega después (avisos arriba, la base) mueve la página: se vuelve a dejar la sección arriba una vez
  if(saltar) setTimeout(() => { if(view.lvl === "ayuda" && HC_CUR === a.id){ const s = document.getElementById("ay-" + a.id); if(s && Math.abs(s.getBoundingClientRect().top - (window.innerWidth <= 760 ? 56 : 12)) > 30) irSeccion(a.id, true); } }, 450);
}
// salta a una sección sin volver a pintar la ayuda
function irSeccion(id, sinHistoria){
  id = AYUDA_ALIAS[id] || id;
  const s = document.getElementById("ay-" + id); if(!s) return;
  if(s.hidden){ HQ = ""; const q = document.getElementById("hc-q"); if(q) q.value = ""; hcFiltrar(); }
  // en el teléfono el índice va arriba: se pliega antes de medir, y se deja sitio para el botón fijo del índice

  if(movil){ const d = document.getElementById("hc-det"); if(d) d.open = false; }

}
function hcMarcar(id, conHistoria){
  if(!id || id === HC_CUR && !conHistoria) return;

  document.querySelectorAll("#hc-list .hc-i").forEach(b => b.dataset.help === id ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  const h = "#ayuda-" + id; if(location.hash !== h) (conHistoria ? history.pushState : history.replaceState).call(history, null, "", h);
  const c = document.querySelector('#hc-list [aria-current="page"]'), t = document.querySelector(".hc-toc");
  if(c && t && window.innerWidth > 760){ const y = c.getBoundingClientRect().top - t.getBoundingClientRect().top; if(y < 40 || y + c.offsetHeight > t.clientHeight - 20) t.scrollTop += y - t.clientHeight/3; HC_Y = t.scrollTop; }
}
// la búsqueda deja en el documento solo las secciones que la nombran, y el índice igual
function hcFiltrar(){
  const q = _norm(HQ.trim()); let n = 0;
  document.querySelectorAll(".hc-sec").forEach(s => { const ok = q.length < 2 || _norm(s.textContent).includes(q); s.hidden = !ok; n += ok ? 1 : 0; });
  document.querySelectorAll(".hc-grupo").forEach(g => { g.hidden = ![...g.querySelectorAll(".hc-sec")].some(s => !s.hidden); });
  const nada = document.getElementById("hc-nada"); if(nada){ nada.hidden = n > 0; nada.textContent = n ? "" : `Ninguna sección habla de «${HQ.trim()}».`; }
}
// mientras se baja, el índice marca la sección que se está leyendo
let _HC_T = null;
window.addEventListener("scroll", () => { if(!view || view.lvl !== "ayuda") return; clearTimeout(_HC_T); _HC_T = setTimeout(() => {
  let cur = null; for(const s of document.querySelectorAll(".hc-sec:not([hidden])")){ if(s.getBoundingClientRect().top <= 120) cur = s.dataset.sec; else break; }

}, 60); }, {passive:true});
// el índice de la ayuda cabe siempre en la pantalla y se recorre con su propio scroll, sin mover el artículo;
// al cambiar de artículo conserva dónde estaba y deja a la vista el artículo actual
let HC_Y = 0;
function hcFit(full){
  const t = document.querySelector(".hc-toc"), a = document.querySelector(".hc-art"); if(!t || !a) return;
  if(window.innerWidth <= 760){ t.style.maxHeight = ""; a.style.minHeight = ""; return; }

  const r = a.getBoundingClientRect(), top = Math.max(12, r.top);

}
function hcToc(){

  if(y < 0 || y + c.offsetHeight > t.clientHeight) t.scrollTop += y - t.clientHeight/3;

window.addEventListener("scroll", ()=>{ if(view && view.lvl==="ayuda") hcFit(); }, {passive:true});

const _CORTO = new Map();
function cortoPartes(p){

  ls.forEach((l, k) => {

      if(m){ fecha = m[1]; tit = m[2]; } else tit = t;

    if(esItem) items.push(t.replace(/^([-*]|\d+[.)])\s+/,""));
    else if(items.length) items[items.length-1] += " " + t;   // continuación de la línea anterior

    const pasos = (p.pasos||[]);
    body = `${CAN||notas.length ? `<div class="card"><h3>Para la próxima sesión</h3>${notas.length?`<div class="due-list">${notas.map(c=>`<div class="due-item static"><span class="pill">nota</span><span class="t">${esc(c.nota)}</span><span class="w">${esc((c.creado||"").slice(0,10))}${CAN?` · <button type="button" class="lnk" data-undo="${esc(c.id)}">Quitar</button>`:""}</span></div>`).join("")}</div>`:""}
      ${CAN?`<form class="anotar" data-proj="${esc(p.id)}"><label class="sr" for="anotar-txt">Anotar</label><input id="anotar-txt" class="search" type="text" maxlength="400" placeholder="Anotar algo que pasó, para registrarlo en la siguiente sesión"><button type="submit" class="btn">Anotar</button></form>`:""}</div>`:""}
      <div class="card"><h3>Siguientes pasos${hq("pasos","Cómo lee las tareas")}</h3>${ajenaAviso(p)}${regularizar(p)}<div class="steps">${pasos.length ? pasos.map(s => isHeader(s) ? `<div class="step h">${esc(s.texto.replace(/:$/,""))}</div>` : stepRow(p, s, false)).join("") : `<p class="empty">Sin siguientes pasos.</p>`}</div>${CAN?`<p class="more">Cambiar la fecha o marcar hecho se guarda aquí y se escribe en la carpeta la próxima vez que el tablero se ponga al día. Tareas nuevas o cambios de texto, en sesión.</p>`:""}</div>`;
  } else if(tab==="entregables"){
    const ents = (p.entregables||[]);
    const grp = (t, list) => list.length ? `<div class="card"><h3>${t}</h3><div class="ents">${list.slice().sort((x,y)=>(y.actualizado||"").localeCompare(x.actualizado||"")).map(e=>`<div class="ent"><b>${entBtn(p,e)}</b><span class="f">${e.formato!=="md"?esc(e.formato.toUpperCase())+" · ":""}${e.actualizado?fmtD(e.actualizado):"sin fecha"}</span>${e.descripcion?`<span class="d">${inline(e.descripcion)}</span>`:""}</div>`).join("")}</div></div>` : "";
    body = grp("Publicados", ents.filter(e=>e.estado==="vigente")) + grp("En borrador", ents.filter(e=>e.estado==="borrador")) + grp("Archivos sin estado", ents.filter(e=>!e.estado && e.formato!=="md")) + grp("Reemplazados", ents.filter(e=>e.estado==="reemplazado"));
    if(!body) body = `<div class="card"><p class="empty">Este proyecto no tiene entregables todavía.</p></div>`;
  }
  return body;
}
function render(){ document.body.dataset.lvl = view.lvl; _M = new Map(); try{ _render(); } finally { _M = null; } if(FOCO) aplicarFoco(); }
function _render(){
  try{
    if(ready.a && ready.p) visita();
    crumbs(); renderSide();
    if(view.lvl==="area" && areaBy[view.id]) renderArea(areaBy[view.id]);
    else if(view.lvl==="proj" && byId[view.id]) renderProj(byId[view.id]);
    else if(view.lvl==="pend") renderPend();
    else if(view.lvl==="dec") renderDec();
    else if(view.lvl==="ent") renderEnt();
    else if(view.lvl==="buscar") renderBuscar();
    else if(view.lvl==="ayuda") renderAyuda(view.id);
    else { view = {lvl:"root"}; renderRoot(); }
  }catch(err){
    console.error(err);
    document.getElementById("main").innerHTML = `<p class="empty">No se pudo mostrar esta página (${esc(err && err.message || err)}). Vuelve a cargar la página; si sigue, avisa a quien administra la carpeta.</p>`;
  }
  const md = document.getElementById("modal"); if(md){ md.innerHTML = prioModal() || mtModal() || entModal(); document.body.classList.toggle("modal-open", !!(PRIO_OPEN || MT_OPEN || ENT_OPEN)); }
  const f = document.getElementById("foot");
  f.innerHTML = META ? esc(`Al día del ${fmtL(META.snapshot)} · puesto al día desde la carpeta el ${new Date(META.sincronizado).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(/\.$/,"")}${META.duracion_min != null ? ` (la puesta al día tardó ${META.duracion_min < 1 ? "menos de un minuto" : `${Math.round(META.duracion_min)} min`}${META.llamadas ? `, ${META.llamadas} llamadas` : ""})` : ""}. Lee de la carpeta la guía, cada área y, de cada proyecto, cómo va, sus decisiones, sus sesiones, sus documentos y la lista de lo que hay en preparación; todo lo que tu cuenta puede leer, salvo el material de origen, el contenido de lo que está en preparación y lo restringido. La carpeta manda: lo que marcas aquí queda apuntado hasta la siguiente puesta al día, que lo pasa a la carpeta.`) : "";
}
(async ()=>{
  render();
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if(!db){ DB = false; render(); return; }
  DB = db;
  const user = await window.claude.use("user");
  // Actúa quien entra con cuenta (contribuidor o editor); la cola admite escritura desde «interact». Sincronizar es solo del dueño, porque la tarea es de su cuenta.
  try{ const me = user ? await user.me() : null; CAN = !!(me && (me.id || me.canEdit)); OWNER = !!(me && me.isOwner); }catch(e){ CAN = false; OWNER = false; }
  // Conector de tareas programadas: sin él no existe «Sincronizar ahora». Se carga después del usuario y se repinta.
  try{ MCP = await window.claude.use("mcp"); }catch(e){ MCP = null; }
  render();
  db.collection("areas").onSnapshot(snap=>{ AREAS = snap.docs.map(s=>({id:s.id, ...s.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99)); areaBy = Object.fromEntries(AREAS.map(a=>[a.slug,a])); const pr = ready.a; ready.a = true; if(!pr) view = parseHash(); datosNuevos(); }, ()=>{ DB=false; datosNuevos(); });
  db.collection("proyectos").onSnapshot(snap=>{ const nuevos = snap.docs.map(s=>({id:s.id, ...s.data()})); olvidarTextos(nuevos); PROJ = nuevos.sort((a,b)=>(a.orden??99)-(b.orden??99)); byId = Object.fromEntries(PROJ.map(p=>[p.id,p])); const pr = ready.p; ready.p = true; if(!pr) view = parseHash(); datosNuevos(); }, ()=>{ DB=false; datosNuevos(); });
  db.collection("cambios").onSnapshot(snap=>{ const todo = snap.docs.map(s=>({id:s.id, ...s.data()})); CAMBIOS = todo.filter(c=>c.tipo!=="propuesta"); PROPUESTAS = todo.filter(c=>c.tipo==="propuesta"); datosNuevos(); }, ()=>{});   // las propuestas del barrido viven en la misma cola pero no son lo que alguien marcó aquí: no entran en ningún contador de CAMBIOS
  // los resúmenes de «Qué hay» que escribe la puesta al día (1.22.4); valen mientras la huella de lo que hay no cambie
  db.collection("resumenes").onSnapshot(snap=>{ for(const k of Object.keys(RESUMEN_GEN)) delete RESUMEN_GEN[k]; for(const d of snap.docs) RESUMEN_GEN[d.id] = d.data(); datosNuevos(); }, ()=>{});
  db.collection("cierres").onSnapshot(snap=>{ CIERRES = snap.docs.map(s=>({id:s.id, ...s.data()})); datosNuevos(); }, ()=>{});
  db.doc("meta/estado").onSnapshot(s=>{ META = s.exists ? s.data() : null; if(META && META.organizacion) document.title = "Tablero " + META.organizacion; datosNuevos(); }, ()=>{});
  db.doc("enfoque/actual").onSnapshot(s=>{ ENFOQUE = s.exists ? s.data() : null; datosNuevos(); }, ()=>{});
  db.doc("meta/permisos").onSnapshot(s=>{ PERMISOS = s.exists ? s.data() : null; datosNuevos(); }, ()=>{});
})();

// ---- tooltip propio: el nativo no aparece dentro del artifact y el CSS se recorta en el índice ----
(function(){
  const el = document.createElement("div"); el.id = "tip"; el.hidden = true; el.setAttribute("role","tooltip"); document.body.appendChild(el);
  let cur = null;
  function show(t){
    cur = t; el.textContent = t.dataset.tip; el.hidden = false;
    const r = t.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, m = 8;
    el.style.maxWidth = Math.min(300, vw - 2*m) + "px";
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(m, r.left), vw - w - m);
    let y = r.bottom + 7;
    if(y + h > vh - m) y = r.top - h - 7;
    if(y < m) y = m;
    el.style.left = x + "px"; el.style.top = y + "px";
  }
  function hide(){ cur = null; el.hidden = true; }
  document.addEventListener("mouseover", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t && t!==cur) show(t); else if(!t && cur) hide(); });
  document.addEventListener("mouseleave", e => { if(cur && e.target===cur) hide(); }, true);
  document.addEventListener("focusin", e => { const t = e.target.closest && e.target.closest("[data-tip]"); if(t) show(t); });
  document.addEventListener("focusout", hide);
  document.addEventListener("keydown", e => { if(e.key==="Escape") hide(); });
  window.addEventListener("scroll", hide, true);
  document.addEventListener("click", hide, true);
})();
// teléfono: la barra de arriba se esconde al bajar y vuelve en cuanto se sube; siempre visible arriba de la página,
// con el menú abierto o con el foco en ella (1.22.4)
(function(){
  const angosta = window.matchMedia ? matchMedia("(max-width:860px)") : {matches:false};
  let y0 = window.scrollY || 0, pendiente = 0;
  const fijar = oculta => document.body.classList.toggle("bar-oculta", !!oculta);
  window.addEventListener("scroll", () => { if(pendiente || !angosta.matches) return; pendiente = requestAnimationFrame(() => { pendiente = 0;   // en escritorio no hay barra que esconder
    const y = window.scrollY || 0, bar = document.querySelector(".mob-bar"), alto = bar ? bar.offsetHeight : 52;
    if(!angosta.matches || y <= alto || document.body.classList.contains("side-open") || (bar && bar.contains(document.activeElement))){ fijar(false); y0 = y; return; }
    if(y - y0 > 8){ fijar(true); y0 = y; } else if(y0 - y > 4){ fijar(false); y0 = y; } }); }, {passive:true});
  document.addEventListener("focusin", e => { if(e.target.closest && e.target.closest(".mob-bar")) fijar(false); });
  // al pasar a pantalla ancha y volver, la barra no se queda escondida
  if(angosta.addEventListener) angosta.addEventListener("change", () => fijar(false));
})();
// pestañas que no caben: el lado que sigue se desvanece y la pestaña elegida queda a la vista (1.22.4)
(function(){
  const marcar = t => { const izq = t.scrollLeft > 2, der = t.scrollLeft + t.clientWidth < t.scrollWidth - 2; t.classList.toggle("mas-izq", izq); t.classList.toggle("mas-der", der); };
  let pend = 0;
  const todas = () => { pend = 0; document.querySelectorAll(".tabs").forEach(t => {
    if(!t.dataset.marca){ t.dataset.marca = "1"; t.addEventListener("scroll", () => marcar(t), {passive:true});
      const sel = t.querySelector('[aria-selected="true"]'); if(sel && t.scrollWidth > t.clientWidth) t.scrollLeft = Math.max(0, sel.offsetLeft - 24); }
    marcar(t); }); };
  const pedir = () => { if(!pend) pend = requestAnimationFrame(todas); };
  if(window.MutationObserver) new MutationObserver(pedir).observe(document.body, {childList:true, subtree:true});
  window.addEventListener("resize", pedir);
})();
