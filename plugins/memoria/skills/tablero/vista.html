<title>Tablero</title>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura; tres niveles (raíz → área → proyecto) en la misma página, navegados por hash.
   Identidad TuOpinas: grafito y verde señal, Zilla Slab para títulos, IBM Plex para texto y datos. */
:root{
  --ground:#F4F5F5; --surface:#FFFFFF; --ink:#17191A; --ink-soft:#40474A; --muted:#666D70;
  --rule:#DCDFE0; --rule-soft:#E9EBEC; --signal:#0B6E4F; --signal-dim:#E3F1EA; --on-signal:#FFFFFF;
  --warn:#6B4E00; --warn-dim:#FCEBB0; --warn-fill:#E8A317; --alert:#C4232B; --alert-dim:#F8E3DF; --on-alert:#FFFFFF;
  --pause:#5B6266; --pause-dim:#ECEEEF; --code:#EEF0F1;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:24px}
a{color:var(--signal)}
code{font:.92em var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5vw,38px)/1.1 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 17px/1.25 var(--f-display);margin:0}
p{margin:0}
.sub{color:var(--ink-soft)}
/* migas */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.crumbs .sep{color:var(--rule)}
header{display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink-soft);font-weight:500}
/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);letter-spacing:.02em;padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.pill.ok{background:var(--signal-dim);color:var(--signal)}
.pill.soon{background:var(--warn-dim);color:var(--warn)}
.pill.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.pill.none{background:var(--pause-dim);color:var(--pause)}
.pill.closed{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.pill.draft{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
/* franja: lo que vence */
.due{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.due .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.due .top .c{font:500 12px var(--f-mono);color:var(--muted)}
.due-list{display:grid;gap:6px}
.due-item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule-soft);border-radius:4px}
.due-item:first-child{border-top:none}
.due-item:hover .t{text-decoration:underline;text-underline-offset:3px}
.due-item:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-item .t{min-width:0;font-size:14px;color:var(--ink)}
.due-item .w{grid-column:2;font-size:12.5px;color:var(--muted)}
/* áreas en la raíz */
.area{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.area-h{all:unset;cursor:pointer;display:grid;gap:4px;width:100%;box-sizing:border-box;padding:14px 16px;border-bottom:1px solid var(--rule-soft)}
.area-h:hover h2{text-decoration:underline;text-underline-offset:4px}
.area-h:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.area-h .d{color:var(--ink-soft);font-size:14px;max-width:70ch}

.tags{display:flex;gap:6px;flex-wrap:wrap}

/* nivel área */
.prios{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.prios ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-soft);font-size:14px}
.prios ol li::marker{font:500 12px var(--f-mono);color:var(--muted)}
.prio-l{gap:8px}
.prio{display:list-item}
.prio-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;color:var(--ink-soft)}
.prio.done .prio-t .tx{color:var(--muted);text-decoration:line-through}
.prio-a{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap}
.prio-m{font:500 11.5px var(--f-mono);color:var(--muted)}
.prio-m.late{color:var(--alert);font-weight:600}.prio-m.soon{color:var(--warn)}
.prio-go{all:unset;cursor:pointer;font:600 13px var(--f-body);color:var(--signal);border-radius:4px;padding:2px 4px}
.prio-go:hover{text-decoration:underline;text-underline-offset:3px}
.prio-go:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:600px){.prio-t{grid-template-columns:1fr}}
body.modal-open{overflow:hidden}
.modal-bg{position:fixed;inset:0;z-index:50;background:var(--velo,rgba(10,12,13,.45));display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid;gap:0;outline:none}
.modal-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:20px 22px 14px;border-bottom:1px solid var(--rule-soft);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{font-size:20px;margin-top:4px}
.modal-h .sub{font-size:14px;margin-top:6px}
.modal-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.modal-x:hover{background:var(--rule-soft)}
.modal-x:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.modal-s{padding:16px 22px;display:grid;gap:10px;border-bottom:1px solid var(--rule-soft)}
.modal-s h3{display:flex;gap:8px;align-items:baseline}
.modal-s h3 .c{font:500 12px var(--f-mono);color:var(--muted)}
.modal-f{padding:14px 22px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.ents{display:grid;gap:4px}
/* Qué hay: el inventario de piezas, la trayectoria y la suma por área */
.qh-tray{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qh-tray li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:14px}
.qh-tray .de{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:88px}
.qh-tray .nodo{display:inline-flex;gap:6px;align-items:baseline}.qh-tray .nodo time{color:var(--muted);font-size:12.5px}
.qh-tray .fl{color:var(--muted)}
.qh-pz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--rule-soft)}
.qh-pz:first-child{border-top:none}.qh-pz b{font-weight:600}.qh-pz .f{color:var(--muted);font-size:13px;white-space:nowrap}
.qh-pz .af{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft);font-style:italic}.qh-pz .af.no{font-style:normal;color:var(--muted)}
.qh-pz .sg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px}.qh-pz .sg span{color:var(--muted)}.qh-pz .sg span+span::before{content:"· ";}
.qh-sum{width:100%;border-collapse:collapse;font-size:13.5px}.qh-sum th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
.qh-sum td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}.qh-sum td.n{white-space:nowrap;color:var(--ink-soft)}.qh-sum .giro{color:var(--ink-soft)}.qh-sum .giro time{color:var(--muted);font-size:12px}
@media (max-width:640px){.qh-sum th:nth-child(4),.qh-sum td:nth-child(4){display:none}}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft)}
.ent:first-child{border-top:none}
.ent b{font-weight:600}
.ent .d{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft)}
.ent .f{font:500 11.5px var(--f-mono);color:var(--muted)}
/* nivel proyecto */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:12px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{font:500 11.5px/1.7 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:0;min-width:0;color:var(--ink-soft)}
@media (max-width:480px){dl.facts{grid-template-columns:1fr;gap:2px}dl.facts dd{margin-bottom:8px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tab .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.md{color:var(--ink);display:grid;gap:10px;font-size:14.5px}
.md ul,.md ol{margin:0;padding-left:20px;display:grid;gap:4px}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--ground)}
.tbl{overflow-x:auto}
.md h4{font:600 15px/1.3 var(--f-display);margin:6px 0 0}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:14px}
.step:first-child{border-top:none}
.step.h{grid-template-columns:1fr;font:600 13px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px}
.dec{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.dec:first-child{border-top:none;padding-top:0}
.dec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dec .hd time{font:500 12px var(--f-mono);color:var(--muted)}
.dec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.dec dt{font:500 11.5px/1.7 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dec dd{margin:0;min-width:0;color:var(--ink-soft);white-space:pre-line}
@media (max-width:480px){.dec dl{grid-template-columns:1fr}}
.more{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* navegador de la raíz */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rule);flex:none}
.dot.ok{background:var(--signal)}.dot.soon{background:var(--warn-fill)}.dot.late{background:var(--alert)}.dot.none{background:var(--rule);box-shadow:inset 0 0 0 1px var(--muted)}.dot.closed{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}.dot.pause{background:var(--pause)}.dot.risk{outline:2px solid var(--alert);outline-offset:1.5px}
.pill.est{font-weight:600}
[data-tip]{border-radius:3px}
[data-tip]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#tip{position:fixed;z-index:1000;background:var(--ink);color:var(--surface);font:400 12.5px/1.45 var(--f-body);letter-spacing:0;text-transform:none;padding:8px 10px;border-radius:6px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;left:0;top:0}
#tip[hidden]{display:none}


/* pasos con controles */
.step{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.step.h{grid-template-columns:1fr}
.step input[type="checkbox"]{width:18px;height:18px;accent-color:var(--signal);margin:2px 0 0;cursor:pointer}
.nochk{width:18px;height:18px;display:inline-block}
.step-t{min-width:0;display:grid;gap:2px}
.step.done .tx{color:var(--muted);text-decoration:line-through}
.pend-note{font-size:12.5px;color:var(--warn)}
.step .w{font-size:12.5px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-edit{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.due-edit.none{background:var(--pause-dim);color:var(--pause)}
.due-edit.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.due-edit.soon{background:var(--warn-dim);color:var(--warn)}
.due-edit:hover{filter:brightness(.94)}
.due-edit[aria-expanded="true"]{box-shadow:0 0 0 2px var(--signal)}
.due-edit:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cal{width:12px;height:12px}
.due-form,.hecho-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 2px 28px}
.hecho-form .search{flex:1 1 220px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);min-height:20px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chip.ghost{border-color:transparent;color:var(--muted)}
.cal-box{flex-basis:100%;max-width:280px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;text-transform:capitalize}
.cal-nav{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:18px;color:var(--ink-soft)}
.cal-nav:hover{background:var(--rule-soft)}
.cal-nav:focus-visible,.cal-d:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-w{font:500 11px var(--f-mono);color:var(--muted);padding:4px 0}
.cal-d{all:unset;cursor:pointer;height:32px;display:grid;place-items:center;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--rule-soft)}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--signal);color:var(--signal);font-weight:600}
.cal-d.sel{background:var(--signal);color:var(--on-signal);font-weight:600}
.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;min-width:0}
.search:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{all:unset;cursor:pointer;background:var(--signal);color:var(--on-signal);font-weight:600;border-radius:6px;padding:8px 14px}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.anotar{display:flex;gap:8px;flex-wrap:wrap}
.anotar .search{flex:1 1 240px}
.due-item.static{cursor:default}
.due-item.static .t{text-decoration:none}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:6px;font-size:14px}
/* dos columnas: índice fijo a la izquierda, contenido a la derecha */
body{padding-inline:0;padding-block:0}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 24px}
.side-org{font:700 20px/1.1 var(--f-display);padding:4px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync-g{display:inline-flex;align-items:center;gap:2px;flex:none}
.sync-cuando{font:500 11.5px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.sync-ico{all:unset;position:relative;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:999px;color:var(--muted);flex:none}
.sync-ico svg{width:18px;height:18px}
.sync-ico:hover{background:var(--signal-dim);color:var(--signal)}
.sync-ico:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sync-ico.done{color:var(--signal);cursor:progress}
.sync-ico.off{opacity:.45}
.sync-ico.pend::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn-fill)}
.sync-ico.busy{color:var(--muted);cursor:progress}
.sync-ico.busy svg,.sync-ico.done svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes late{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sync-ico.busy svg,.sync-ico.done svg{animation:late 1.4s ease-in-out infinite}}
.side-i{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;font-size:13.5px;color:var(--ink-soft)}
.side-i span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-i.top{grid-template-columns:minmax(0,1fr) auto;font-weight:600;color:var(--ink)}
.side-i.area{grid-template-columns:minmax(0,1fr) auto;font:600 15px/1.2 var(--f-display);color:var(--ink);margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.side-i.area small{font:500 11.5px var(--f-mono);color:var(--muted)}
.side-i.proj{padding-left:14px}
.side-i.proj.closed span{color:var(--muted)}
.side-i:hover{background:var(--ground)}
.side-i[aria-current="page"]{background:var(--signal-dim);color:var(--signal)}
.side-i[aria-current="page"] span{color:var(--signal)}
.side-i:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.side-n{font:600 11px var(--f-mono);background:var(--rule-soft);color:var(--ink-soft);border-radius:999px;padding:2px 7px}

<script>
// Los datos viven en la base de la página: colecciones "areas" y "proyectos", el documento "meta/estado"
// y la cola "cambios" (lo que se toca aquí y todavía no está escrito en la carpeta).
// Los escribe generar_vista.py desde la raíz; la vista solo lee la raíz y escribe en su cola.
const VERSION_TABLERO = "1.22.5"; // la misma que el plugin memoria; la sube release.sh
let PERMISOS = null, AREAS = [], PROJ = [], META = null, CAMBIOS = [], PROPUESTAS = [], CIERRES = [], ENFOQUE = null, MCP = null, QUERY = "", byId = {}, areaBy = {}, DB = null, CAN = null, OWNER = false, ready = {a:false,p:false};
const DAY = 864e5;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const n = new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const nowISO = () => { const n = new Date(); const tz = -n.getTimezoneOffset(), s = tz>=0?"+":"-", pad = x=>String(Math.floor(Math.abs(x))).padStart(2,"0"); return new Date(n.getTime()+tz*6e4).toISOString().slice(0,19)+s+pad(tz/60)+":"+pad(tz%60); };
const _fmt = (opc, vacio) => { const F = new Intl.DateTimeFormat("es-MX", opc), C = new Map(); return f => { if(!f) return vacio; let r = C.get(f); if(r===undefined){ const d = new Date(f+"T12:00:00"); r = isNaN(d) ? String(f) : F.format(d); C.set(f, r); } return r; }; };
const fmtD = _fmt({day:"numeric",month:"short"}, "");
const fmtL = _fmt({day:"numeric",month:"long",year:"numeric"}, "—");
function due(f){
  if(!f) return {cls:"none", label:"Sin fecha"};
  const diff = Math.round((new Date(f+"T12:00:00") - new Date(today()+"T12:00:00"))/DAY);
  if(diff < 0) return {cls:"late", label:`Venció hace ${-diff} d`};
  if(diff === 0) return {cls:"soon", label:"Hoy"};
  if(diff === 1) return {cls:"soon", label:"Mañana"};
  if(diff <= 7) return {cls:"soon", label:`En ${diff} d`};
  return {cls:"", label:fmtD(f)};
}
// Markdown mínimo: párrafos, listas, tablas, negritas, código, enlaces relativos como texto.
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")

  const out = {ents:[], blandos:[]};
  if(!e.actualizado || !(e.basado_en||[]).length) return out;
  for(const b of e.basado_en){
    const r = b.replace(/^\.?\//,""), x = idx[r];
    if(x){ if(x.e.actualizado && x.e.actualizado > e.actualizado) out.ents.push(x); continue; }
    const seg = r.split("/"), q = byId[seg[0]+"--"+seg[1]]; if(!q) continue;
    if(/decisiones\.md$/.test(r)){ const f = (q.decisiones||[])[0]?.fecha; if(f && f > e.actualizado) out.blandos.push(`hay decisiones de ${q.nombre} posteriores (la última, del ${fmtD(f)})`); }
    else if(/proyecto\.md$/.test(r) && q.actualizado && q.actualizado > e.actualizado) out.blandos.push(`la ficha de ${q.nombre} cambió el ${fmtD(q.actualizado)}`);
  }

}
const tagDe = p => p.area+"/"+p.slug;
function afectan(p){

  const re = new RegExp("(?<![\\w/-])("+esc_(tagDe(p))+"(?![\\w-])|"+esc_(p.area+"/")+"(?![\\w-]))");
  const out = [];
  for(const q of PROJ){ if(q.id===p.id || q.restringido) continue; for(const d of (q.decisiones||[])) if(re.test(d.afecta||"")) out.push({q, d, nueva: !p.ultima_sesion || (d.fecha||"") >= p.ultima_sesion}); }

}

function registroTab(p){
  if(p.sesiones_aparte && !TEXTOS[p.id]) traerTextos(p.id);
  const decs = decisionesTodas(p).map(d=>({f:d.fecha||"", k:"d", d})), ses = sesionesTodas(p).map(s=>({f:s.fecha, k:"s", s}));
  const nQ = decs.filter(x=>x.d.tipo==="cuestionamiento").length;
  let items = REG_FILTRO==="decisiones" ? decs.filter(x=>x.d.tipo!=="cuestionamiento") : REG_FILTRO==="sesiones" ? ses : REG_FILTRO==="cuest" ? decs.filter(x=>x.d.tipo==="cuestionamiento") : decs.concat(ses);
  items.sort((a,b)=>b.f.localeCompare(a.f) || (a.k==="s"?-1:1));
  const vis = items.slice(0, 60);
  let mes = null, out = "";
  for(const x of vis){ const m = MES_L(x.f); if(m!==mes){ mes = m; out += `<div class="dl-m">${esc(m)}</div>`; }
    if(x.k==="d") out += decItem(x.d, p, false);
    else { const s = x.s, tit = s.titulo.replace(s.fecha,"").replace(/^[\s(]+|[)\s]+$/g,"").trim();
      out += `<article class="dec ses"><div class="hd"><span class="pill none">Sesión</span><time>${fmtD(s.fecha)}</time>${tit?`<h3>${inline(tit)}</h3>`:""}${s.quien?`<span class="more">· ${esc(s.quien)}</span>`:""}</div><dl>${s.trabajamos?`<dt>Tema</dt><dd>${inline(s.trabajamos)}</dd>`:""}${s.avances?`<dt>Avances</dt><dd>${inline(s.avances)}</dd>`:""}</dl></article>`; } }
  const chip = (k, l, n) => `<button type="button" class="chip${REG_FILTRO===k?" on":""}" data-reg="${k}">${l}${n!=null?` · ${n}`:""}</button>`;
  return `<div class="card"><div class="reg-f">${chip("todo","Todo",decs.length+ses.length)}${chip("decisiones","Decisiones",decs.length-nQ)}${chip("sesiones","Sesiones",ses.length)}${nQ?chip("cuest","Cuestionamientos",nQ):""}</div>${p.sesiones_aparte && !TEXTOS[p.id] ? CARGANDO : sinDetalle(p) ? SIN_DETALLE : ""}${vis.length?`<div class="dl">${out}</div>`:`<p class="empty">Nada registrado.</p>`}${items.length>60?`<p class="more">Se muestran los 60 más recientes de ${items.length}. El registro completo está en la carpeta del proyecto.</p>`:""}</div>`;
}
function renderProj(p){
  tab = TABMAP[tab] || tab; if(!["estatus","quehay","pasos","registro"].includes(tab)) tab = "estatus";
  if(p.restringido){ renderProjOld(p, "resumen"); return; }
  // la cabecera la pinta renderProjOld: aquí solo hace falta en las pestañas que no lo llaman (un cerrado, en Estatus, revisión 1.22.5)
  if(tab==="registro" || (tab==="estatus" && p.cerrado)) renderProjOld(p, "pasos");
  const main = document.getElementById("main");
  let body;
  if(tab==="estatus"){
    const cuest = cuestAbiertos(c => c.a_proyecto===p.id);
    const sig = p.cerrado ? "" : renderProjOld(p, "estado");
    body = `${cuest}${cortoCard(p) || `<div class="card brief"><h3>Estatus</h3><p class="empty">Sin Estatus todavía: lo escribe el cierre de la siguiente sesión.</p><p class="more">${projLinea(p, true)}</p></div>`}${enDetalle(p)}${sig}
      <details class="card mas-c"><summary><h3 style="display:inline">Para qué</h3><span class="more"> · objetivo y alcance</span></summary><dl class="facts" style="margin-top:12px"><dt>Objetivo</dt><dd>${inline(p.objetivo)||"—"}</dd>${p.terminado?`<dt>Termina</dt><dd>${inline(p.terminado)}</dd>`:""}<dt>Alcance</dt><dd class="md">${md(p.alcance)||"—"}</dd></dl></details>`;
  } else if(tab==="quehay"){
    body = p.que_hay ? renderProjOld(p, "quehay") : renderProjOld(p, "entregables");
  } else if(tab==="pasos"){
    body = (p.escribe===false && CAN ? `<p class="hint">Lo que marques aquí no lo pasa a la carpeta tu puesta al día: este proyecto lo escribe ${esc(nombreCorto(p.dueno||"otra persona"))}. Díselo.</p>` : "") + renderProjOld(p, "pasos");
  } else body = registroTab(p);
  const nP = stepsLive(p).length;
  const tabs = [["estatus","Estatus",""],["pasos","Acciones",p.cerrado?"":(nP||"")],["registro","Actividad",""],["quehay","Qué hay",""]];
  main.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k,t,n])=>`<button type="button" role="tab" class="tab" data-tab="${k}" aria-selected="${tab===k}">${t}${n!==""?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>${body}`;
  main.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ tab = b.dataset.tab; REG_FILTRO = "todo"; EDIT=null; HECHO=null; history.replaceState(null,"","#p-"+p.id+"-t-"+tab); render(); });
}

// ---- A. Lo que no cuadra: lo que el tablero ve y una sesión no, con acción en la fila ----
function noCuadra(){
  const tday = today(), out = [];
  for(const p of PROJ){ if(p.restringido || p.cerrado) continue;
    const fe = fechaEstatus(p);
    if(fe && p.ultima_sesion && p.ultima_sesion > fe && !propsDe(p.id).some(q=>q.clase==="estado-desfasado" && q.estado==="pendiente")) out.push({id:"est:"+p.id, p, k:"Estatus viejo", t:`El Estatus es del ${fmtD(fe)} y hubo sesión el ${fmtD(p.ultima_sesion)}: cuenta algo que ya cambió.`, accion:"Reescribir al cerrar"});
    const fd = faltaDecidir(p);
    if(fd){ const dec = decisionesTodas(p).filter(d=>fe && d.fecha > fe); if(dec.length) out.push({id:"fd:"+p.id, p, k:"Decidido después", t:`«Falta decidir» dice: ${esc(fd.slice(0,120))}${fd.length>120?"…":""}; después hay ${dec.length} decisi${dec.length===1?"ón":"ones"} (${fmtD(dec[0].fecha)}). Puede estar resuelto.`, accion:"Confirmar"}); }
    const viejos = stepsLive(p).filter(s=>{ const f = effDate(p,s); return f && diasDesde(f) > 30; });
    if(viejos.length) out.push({id:"venc:"+p.id, p, row:key(p.id, viejos[0].texto), k:"Vencido y nadie lo movió", t:`${viejos.length} paso${viejos.length===1?"":"s"} con fecha de hace más de un mes: ${inline(viejos[0].texto.slice(0,90))}${viejos[0].texto.length>90?"…":""}`, accion:"Fechar o quitar"});
    for(const q of propsDe(p.id)){ const k = CLASE_PROP[q.clase]||q.clase, t = esc(textoProp(q).replace(new RegExp("^"+k+"\\s*:\\s*","i"),"").replace(/^(Candidato a entregable|Contradicción)\s*:\s*/,""));
      if(q.clase!=="afirma" && q.estado==="pendiente") out.push({id:"prop:"+q.id, p, k, t, accion:"Aceptar"});
      // aceptada y esperando: la de otra clase espera el sí en sesión; la de un proyecto donde ya no se escribe, no la aplicará nadie
      else if(q.estado==="aceptada" && (p.escribe===false || q.clase!=="afirma")) out.push({id:"prop:"+q.id, p, k: p.escribe===false ? "Aceptada sin quien la aplique" : k+" · aceptada", t: p.escribe===false ? `${t} Se aceptó${q.por?` (${esc(q.por)})`:""} en un proyecto donde este tablero ya no escribe.` : t, aceptada:true}); }
  }
  for(const a of AREAS){ if(a.legible===false || archivada(a)) continue;
    const ta = titArea(a), ps = (a.proyectos||[]).map(i=>byId[i]).filter(activo), mov = ps.map(p=>p.ultima_sesion).filter(Boolean).sort().pop();
    if(ta.fecha && mov && mov > ta.fecha && diasDesde(ta.fecha) > 7) out.push({id:"area:"+a.slug, a, k:"Estatus del área viejo", t:`El Estatus de ${esc(a.nombre)} es del ${fmtD(ta.fecha)} y sus proyectos se movieron hasta el ${fmtD(mov)}.`, accion:"Reescribir"});
    const pr = (a.prioridades||[]); if(pr.length && ta.fecha && diasDesde(ta.fecha) > 14) out.push({id:"prio:"+a.slug, a, k:"Prioridades sin revisar", t:`${pr.length===1?"La prioridad":`Las ${pr.length} prioridades`} de ${esc(a.nombre)} no se ${pr.length===1?"toca":"tocan"} desde el ${fmtD(ta.fecha)}: «${inline(pr[0].slice(0,80))}…»`, accion:"Revisar"});
  }
  return out;
}
let _CONOCIDOS = null, _CONOCIDOS_DE = null;
// la organización de cada persona de fuera, de «Nombre Apellido (Organización)» en pasos y decisiones (revisión 1.22.4)
const ORG_DE = {};
function conocidos(){ if(_CONOCIDOS && _CONOCIDOS_DE===PROJ) return _CONOCIDOS; _CONOCIDOS_DE = PROJ; const full = new Set();
  // quien responde por un área o colabora en ella, aunque no haya cerrado sesión ni decidido nada (1.23)
  for(const a of AREAS){ if(a.dueno) full.add(persona(a.dueno)); for(const c of colaboranArea(a)) full.add(persona(c)); }
  for(const p of PROJ){ for(const d of decisionesTodas(p)) for(const n of [d.decidio, d.planteo]) if(n) full.add(persona(n)); for(const x of sesionesTodas(p)) if(x.quien) full.add(persona(x.quien)); if(p.dueno) full.add(persona(p.dueno)); for(const c of (p.colaboran||[])) full.add(persona(c));
    // de fuera de la carpeta, solo quien está escrito como «Nombre Apellido (Organización)»: lo da la puesta al día (1.22.4)
    for(const x of (p.personas_fuera||[])){ const n = typeof x==="string" ? x : x.nombre; if(!n) continue; full.add(n); if(x.organizacion) ORG_DE[n] = x.organizacion; }
    for(const d of decisionesTodas(p)){ const m = (d.decidio||"").match(/^\s*([^()]+?)\s*\(([^)]+)\)/); if(m && !/pendiente|@|\d/i.test(m[2])) ORG_DE[m[1].trim()] = m[2].trim(); } }
  const porNombre = {}, carpeta = escribenSet();
  for(const f of full){ const k = f.split(" ")[0]; if(k.length<=2) continue; const hay = porNombre[k];
    if(!hay || (carpeta.has(persona(f)) && !carpeta.has(persona(hay))) || (carpeta.has(persona(f))===carpeta.has(persona(hay)) && f.split(" ").length>hay.split(" ").length)) porNombre[k] = f; }
  return _CONOCIDOS = porNombre; }
function nombresEn(txt){ const c = conocidos(), out = [], re = /\b([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)\b/g; let m; while((m = re.exec(txt||""))){ const f = c[m[1]]; if(f && !out.includes(f)) out.push(f); } return out; }

function aplicarFoco(){
  if(!FOCO) return; const f = FOCO;
  if(f.edit && EDIT !== f.edit){ EDIT = f.edit; FOCO = {...f, edit:null}; render(); return; }

}

function tabMant(){
  // el número de la pestaña cuenta solo lo que pide una acción: los avisos con data-acc y lo que no cuadra; los informativos van aparte, como un punto (1.22.5)

  const html = `<section class="due"><div class="top"><h2>Avisos de la herramienta</h2><span class="c">${nAv}</span><span class="c" style="margin-left:auto">Versiones, sincronización y lo que el tablero todavía no muestra</span></div>${av ? `<div class="mt-list">${av}</div>` : `<p class="empty">Sin avisos: tablero, página y carpeta en la misma versión.</p>`}</section>
    <section class="due"><div class="top"><h2>Lo que no cuadra</h2><span class="c">${nc.length}</span><span class="c" style="margin-left:auto">Lo que se ve desde fuera de las sesiones. Las sugerencias que aceptes las aplica el próximo cierre; lo demás se arregla en su sitio</span></div>${nc.length?`<div class="nc">${nc.slice(0, NC_N).map(filaNC).join("")}</div>${nc.length>5?`<button type="button" class="pg-more" data-nc-mas>${NC_N>5?"Ver menos":`Ver las ${nc.length-5} restantes`}</button>`:""}`:`<p class="empty">Todo cuadra.</p>`}

    <details class="card mas-c"><summary><h2 style="display:inline">Por poner al día, proyecto por proyecto</h2><span class="more"> · el detalle de cada proyecto y la frase para arreglarlo en sesión</span></summary>${memoriaAlDia()}</details>`;
  // lo tocado aquí que la carpeta aún no refleja: fechas, hechos, notas y correcciones, con su «Deshacer»

// ---- Acciones: te toca a ti, y con otros (te deben / les debes) ----
const RE_DEBES = /\b(mandar|mandarle|manda|enviar|enviarle|envía|avisar|avisarle|avisa|pedir|pedirle|pide|preguntar|preguntarle|pregunta|escribir|escribirle|responder|responderle|llamar|presentar|proponer|compartir|agendar|confirmar|acordar|revisar|buscar)(?:le)?\s+(?:a|con)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/;
const RE_ESPERA = /\b(espera|esperar|esperando|pendiente de|que (?:nos )?(?:confirme|responda|firme|mande|envíe|apruebe|valide|decida))\b/i;
// un cuestionamiento te toca si cuestiona una decisión de un proyecto tuyo, o una premisa y respondes por el contexto (revisión 1.22.4)
const cuestMio = c => c.abierto && (c.a_proyecto==="premisa" ? (META && META.soy_contexto !== undefined ? META.soy_contexto === true : !!VIEWER() && persona(META && META.contexto_comun)===persona(VIEWER())) : !!(byId[c.a_proyecto] && esMio(byId[c.a_proyecto])));
// pasos de espera sin nadie que el tablero reconozca: se cuentan para decir cómo escribirlos
const SIN_QUIEN = () => { let n = 0; for(const p of PROJ){ if(p.restringido || p.cerrado) continue; for(const s of stepsLive(p)) if((effNat(p,s)==="espera" || RE_ESPERA.test(s.texto)) && !fueraEn(p, s.texto) && !nombresEn(s.texto).length) n++; } return n; };
// la persona de fuera escrita tal cual en el paso va antes que el índice por nombre de pila, que puede caer en alguien de dentro
const fueraEn = (p, t) => (p.personas_fuera||[]).map(x=>typeof x==="string" ? x : x.nombre).find(n=>n && (t||"").includes(n)) || null;
function conOtros(){
  const yo = nombreCorto(VIEWER()), esc_ = escribenSet(), por = {};
  const add = (n, lado, x) => { const g = por[n] = por[n] || {n, deben:[], debes:[]}; g[lado].push(x); };
  for(const p of PROJ){ if(p.restringido || p.cerrado) continue;

// ---- Voz: la primera frase no empieza por el nombre del área o del proyecto, ni dice «hoy» ----
// En pantalla se corrige el texto ya escrito; la regla de verdad va en escribir.md y la aplica el cierre.
function sinSujeto(t, nombre, fecha){
  let s = (t||"").trim(); nombre = nombre || ""; if(!nombre) return s;
  if(/\b(the|and|has|is|are|with)\b/i.test(s)) return s;
  const re = new RegExp("^(?:el |la |los |las )?"+nombre.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s+(?:de\\s+\\w+\\s+)?", "i");
  if(re.test(s)){ s = s.replace(re, ""); s = s.charAt(0).toUpperCase() + s.slice(1); }
  if(fecha) s = s.replace(/\bhoy\b(?!\s+en\s+d[ií]a)/gi, `el ${fmtD(fecha)}`).replace(/\bayer\b/gi, ()=>{ const d = new Date(fecha+"T12:00:00"); d.setDate(d.getDate()-1); return `el ${fmtD(d.toISOString().slice(0,10))}`; });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

const RESUMEN_GEN = {};   // los párrafos escritos por la puesta al día (colección «resumenes», 1.22.4); si falta o quedó viejo, el calculado
function resumenCalculado(p, piezas){
  const ap = z => z.afirma || (provDe(rutaPieza(p,z))||{}).afirma || "";
  const frase = (lista, max) => lista.slice(0,max).map(z=>{ const a = ap(z); return a ? `${a.replace(/\.$/,"")} (${fmtD(z.actualizado)})` : `«${z.titulo||z.nombre}» (${fmtD(z.actualizado)})`; }).join("; ");
  const ent = piezas.filter(z=>z.tipo==="entregable"), tal = piezas.filter(z=>z.tipo==="taller");
  const vig = ent.filter(z=>z.estado==="vigente").sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||"")), borE = ent.filter(z=>z.estado==="borrador"), bin = ent.filter(z=>!z.estado && z.formato!=="md");
  const borT = tal.filter(z=>z.estado==="borrador").sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||"")), viejosT = borT.filter(z=>z.decisiones_despues);
  let e = vig.length ? `Vigente${vig.length===1?"":"s"}: ${frase(vig,3)}${vig.length>3?`; y ${vig.length-3} más`:""}.` : "Nada publicado como vigente.";
  if(borE.length) e += ` En borrador, ${cuantos(borE.length,"pieza","piezas")}${borE.some(z=>z.decisiones_despues)?`, ${borE.filter(z=>z.decisiones_despues).length} con decisiones posteriores a su última versión`:""}.`;
  if(bin.length) e += ` Además ${cuantos(bin.length,"archivo","archivos")} sin cabecera (${[...new Set(bin.map(z=>(z.formato||"").toUpperCase()))].join(", ")}), cuyo estado dicen las decisiones que los produjeron.`;
  let t = borT.length ? `Se trabaja en ${frase(borT,3)}${borT.length>3?`; y ${borT.length-3} piezas más`:""}.` : (tal.length ? "El taller no tiene borradores abiertos." : "Taller vacío.");
  if(viejosT.length) t += ` ${cuantos(viejosT.length,"pieza es","piezas son")} anterior${viejosT.length===1?"":"es"} a decisiones que las tocan.`;
  return {ent: e, tal: t};
}

  if(view.lvl === "root" && META.version_tablero && META.version_tablero !== VERSION_TABLERO) out += `<div class="stale suave"${OWNER && !syncFalta() ? " data-acc" : ""}><span>Los datos del tablero son de la versión <b>${esc(META.version_tablero)}</b> y la página es la <b>${esc(VERSION_TABLERO)}</b>. Se ponen a la par en la próxima sincronización${OWNER&&!syncFalta()?", o ya mismo con el botón junto al nombre":""}.</span></div>`;
  // Pasar días sin ponerse al día es normal si nadie trabajó: se avisa con margen y se dice cómo traer lo de otros.
  const dias = Math.floor((Date.now() - new Date(META.sincronizado).getTime())/DAY), umbral = META.tarea && !META.tarea_manual ? 2 : 7;
  if(dias >= umbral) out += `<div class="stale" data-acc><span>El tablero lleva <b>${dias} días</b> sin ponerse al día (última vez ${new Date(META.sincronizado).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}). Si cerraste sesiones o si otras personas trabajaron en la carpeta, ${OWNER&&!syncFalta()?"pulsa el botón junto al nombre, arriba a la izquierda":"dile a Claude con la carpeta conectada «sincroniza el tablero»"}. <button type="button" class="lnk" data-help="ponerse-al-dia">Cómo se pone al día ›</button></span></div>`;
  return out;
}
// ---- ayuda: el manual y cómo funciona, como artículos con su índice ----
// Una sola fuente para la ayuda: viaja con la página y cambia con cada versión del plugin.
// Los datos de la organización (su nombre, quién administra la carpeta) salen de meta/estado.
function ayudaArts(){
  const ORG = esc(META && META.organizacion || "la organización");

  const CTX = esc(META && META.contexto_comun || "quien mantiene el contexto común");
  const F = t => `<span class="hc-fr">${t}</span>`;
  const ORG_TXT = META && META.organizacion || "la organización";
  const MSG_SUMAR = `Te di acceso a la memoria de ${ORG_TXT}. Para conectarte se hace una sola vez y lleva unos 15 minutos:
1. Instala Google Drive para escritorio (google.com/drive/download) e inicia sesión con el correo con el que te compartí la carpeta.
2. Si la carpeta ${ORG_TXT} no aparece en tu computadora, entra en drive.google.com, búscala en «Compartido conmigo» y añádela a tu unidad.
3. En tu computadora, en el Finder (Mac) o en el Explorador de archivos (Windows), no en la web, haz clic derecho sobre la carpeta ${ORG_TXT} y elige «Disponible sin conexión» («Make available offline» en inglés), para que sus archivos estén siempre descargados.
4. Abre guia.md, dentro de esa carpeta, y sigue la sección «Cómo conectarte» paso a paso.`;
  return [
  {g:"Para empezar", id:"empezar", t:"Qué es la memoria", h:`
    <p>La memoria de ${ORG} es una carpeta compartida, ordenada por áreas y, dentro de cada área, por proyectos. Claude la lee antes de ayudarte y escribe en ella lo que importa mientras trabajas.</p>
    <ul class="hc-l">
      <li><b>Te conectas una vez</b>, en unos quince minutos: la app de escritorio, tu proyecto en Claude, la carpeta y el plugin <code>memoria</code> (<button type="button" class="lnk" data-help="conectarte">Conéctate una vez</button>).</li>
      <li><b>Trabajas por sesiones.</b> Empiezas con ${F("abre sesión en…")} y terminas con ${F("cierra la sesión")}. Claude te pone al día al abrir y deja escrito lo que pasó al cerrar.</li>
      <li><b>Hablas normal.</b> Unas pocas frases activan cada cosa (<button type="button" class="lnk" data-help="frases">Qué decirle a Claude</button>).</li>
      <li><b>Claude escribe solo en tu área</b> y nunca da nada por aprobado. Si algo toca a otra área, te dice a quién avisar.</li>
      <li><b>La historia no se borra.</b> Las decisiones y la bitácora de cada proyecto solo crecen: nadie edita lo que ya está registrado.</li>
      <li><b>Este tablero</b> es una ventana a la carpeta: se pone al día cuando se lo pides, avisa cuando hay sesiones que todavía no muestra, y te dice por dónde empezar.</li>
    </ul>`},
  {g:"Para empezar", id:"para-que", t:"Para qué sirve la memoria", h:`
    <p>Cada conversación con Claude empieza de cero: lo que se le explicó ayer, en otra conversación o en la de un compañero, no lo sabe. La memoria hace que la siguiente conversación, la tuya o la de cualquiera de ${ORG}, empiece sabiendo lo que pasó. Cuesta dos frases por sesión, abrir y cerrar, y confirmar las decisiones al cerrar; a cambio, nadie vuelve a explicarle el contexto a nadie.</p>
    <dl class="hc-def">
      <dt>Claude es muchos agentes</dt><dd>En cada conversación Claude hace de un especialista distinto, según lo que le pidas: el abogado que revisa un contrato, el comercial que prepara una propuesta, el desarrollador que programa un cambio, el analista que compara opciones. Sin memoria, son desconocidos entre sí. Con ella, todos leen la misma carpeta: el contrato que revisó uno es el que cita el otro en la propuesta, y la decisión de producto de la semana pasada es la que el desarrollador respeta hoy. Trabajan como empleados de ${ORG} que comparten el mismo archivo.</dd>
      <dt>Personas y agentes, coordinados</dt><dd>Cada persona trabaja con su propio Claude, en su área. Lo que una decide queda escrito donde la siguiente lo lee: al abrir sesión, Claude avisa de las decisiones de otras áreas que afectan al proyecto, y lo que no cuadra se cuestiona por escrito. Nadie escribe en el área de otro y ninguna decisión se registra sin que una persona la confirme. El punto de encuentro es la carpeta, no el chat: lo que no está escrito en ella no existe para la siguiente conversación.</dd>
    </dl>
    <p>Con la memoria al día, estas peticiones salen en una conversación nueva, sin explicar nada antes:</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Le dices</th><th>Lo que Claude ya sabe</th></tr></thead>
      <tbody>
        <tr><td>${F("contesta el correo de Juan con las actualizaciones que pide al contrato")}</td><td>Quién es Juan, en qué proyecto está el contrato, qué cambios se acordaron en la última sesión y cuáles se descartaron.</td></tr>
        <tr><td>${F("actualiza la presentación a Empresa X con las ideas que revisamos ayer sobre la nueva versión del producto")}</td><td>Lo que ayer quedó decidido y publicado en el proyecto de producto, y la presentación en los entregables del proyecto de Empresa X, aunque sean de dos áreas distintas.</td></tr>
        <tr><td>${F("prepara la propuesta para Acme con los precios que decidimos la semana pasada")}</td><td>La decisión de precios con su porqué, y los criterios con los que ${ORG} escribe sus propuestas.</td></tr>
        <tr><td>${F("antes de programar el cambio, ¿choca con alguna decisión de producto?")}</td><td>Las decisiones vigentes del área de producto y a quién avisar si choca.</td></tr>
        <tr><td>${F("¿qué le prometimos a Empresa X y qué falta por entregar?")}</td><td>El alcance acordado, los entregables publicados y los pasos abiertos, con quién y para cuándo.</td></tr>
        <tr><td>${F("ponme al día de lo que pasó en ventas esta semana")}</td><td>Si ventas es tu área, sus sesiones de la semana aunque las hayan cerrado otras personas; si no, lo que ventas decidió y publicó esa semana y el estatus que escribió su director.</td></tr>
      </tbody>
    </table></div>
    <p class="hc-nota">Funciona en la medida en que todos la usan: una sesión que no se cierra, o un acuerdo que se quedó en un chat, es un hueco que la siguiente conversación no puede llenar.</p>
    <dl class="hc-def">
      <dt>Y este tablero</dt><dd>La memoria se lee desde Claude; el tablero la enseña entera sin abrirla. Al cerrar cada sesión, Claude escribe con la voz del director del área cómo va el proyecto (lo que se completó y lo que sigue) y el estatus del área (qué se movió, qué sigue y qué preocupa), y el tablero los enseña en Estatus, cada uno en su nivel; al final de Acciones está «Por dónde empezar»: los grupos de pasos que avanzan varias cosas a la vez. <button type="button" class="lnk" data-help="tablero">Tu tablero</button> · <button type="button" class="lnk" data-help="director">El director de cada área</button></dd>
    </dl>`},
  {g:"Para empezar", id:"conectarte", t:"Conéctate una vez", h:`
    <p>Se hace una sola vez y lleva unos 15 minutos. La receta completa, con lo que hay que pulsar en cada pantalla, está en la sección «Cómo conectarte» de <code>guia.md</code>, en la carpeta. Aquí va el resumen.</p>
    <dl class="hc-def">
      <dt>Lo que necesitas</dt><dd>Una Mac con macOS 14 o más nuevo, o una computadora con Windows 10 o 11, mejor en edición Pro, Enterprise o Education (en Home la función de carpetas puede no funcionar), y espacio libre en el disco: la primera vez la app descarga más de 1 GB. Una cuenta de Claude de pago, y que la computadora pueda conectarse a GitHub (github.com y raw.githubusercontent.com), de donde Claude descarga sus herramientas en cada sesión. La app de Claude de escritorio, trabajando en Cowork si tu versión separa Chat y Cowork. La carpeta de ${ORG} sincronizada en tu computadora, con sus archivos siempre descargados. Y tu correo en el mapa de <code>guia.md</code>, como responsable o como colaborador de tu área, o en el proyecto donde colaboras: así sabe Claude dónde escribes; si no estás, pídeselo a ${CTX} o al responsable de tu área.</dd>
    </dl>
    <ol class="hc-pasos">
      <li><b>Crea tu proyecto en Claude</b><span>En Projects, con el nombre «${ORG} · tu área», privado. Uno por persona, no uno para todos.</span></li>
      <li><b>Conecta la carpeta completa, no la de tu área</b><span>La que tiene dentro <code>guia.md</code> y <code>metodo.md</code>. Claude necesita ver todas las áreas para decirte qué se sabe ya y qué decisión de otra te afecta; dónde escribes lo fijan tu cuenta y los permisos de la carpeta. Conéctala en el proyecto, no en una conversación suelta, y cuando Claude pida permiso para usarla, deja que lo haga siempre.</span></li>
      <li><b>Instala el plugin</b><span>En Customize › Plugins, la flechita del botón Add › Add marketplace › Add from a repository. Escribe <code>TuOpinas/memoria</code>, deja activado Sync automatically y pulsa Sync; luego, en Discover, busca Memoria y pulsa Add. En Add › Manage marketplaces, <code>memoria</code> tiene que decir Synced, y entre tus plugins Memoria tiene que estar encendido: en algunas versiones se instala apagado. Si tu organización ya distribuye el plugin a todos, te saltas este paso.</span></li>
      <li><b>Compruébalo con una sesión</b><span>Escribe ${F("abre sesión en")} y el nombre de un proyecto de tu área. La respuesta empieza con un recuadro, «Memoria de trabajo», con la organización, la versión del método y las áreas donde escribes. Después te pone al día y te propone en qué trabajar.</span></li>
      <li><b>Monta tu tablero</b><span>Escribe ${F("monta el tablero")} y aprueba la tarea que te pide la app: es la del botón «Sincronizar ahora». Para tenerlo siempre a mano, ábrelo en Chrome desde <code>claude.ai/artifacts</code> y guárdalo en la barra de marcadores.</span></li>
    </ol>
    <dl class="hc-def">
      <dt>El código, aparte</dt><dd>Si trabajas con código, sus repositorios van en otra carpeta de tu computadora, con todos los de la organización dentro, y se conecta también al proyecto. Nunca dentro de la carpeta de la memoria: Drive le añade archivos que confunden a Git.</dd>
      <dt>Para diseñar</dt><dd>Pídeselo a Claude en una conversación normal de tu proyecto: el diseño sale como un artifact y la memoria funciona como en cualquier otra conversación. No uses la interfaz aparte de Claude Design, que se retira en diciembre.</dd>
    </dl>
    <p class="hc-nota">No hay nada que pegar en las instrucciones del proyecto: el plugin aplica el método en cuanto ve la carpeta. Para sumar a otra persona: <button type="button" class="lnk" data-help="sumar">Sumar a un compañero</button>.</p>`},
  {g:"Para empezar", id:"sumar", t:"Sumar a un compañero", h:`
    <p>Para que otra persona trabaje con la memoria de ${ORG} hacen falta tres cosas. Las dos primeras las hace la organización; la tercera es mandarle un mensaje, y el resto lo hace esa persona siguiendo la guía de la carpeta.</p>
    <ol class="hc-pasos">
      <li><b>Ponla en el mapa, como responsable o como colaboradora</b><span>Si va a llevar un área, su correo va en la columna Cuenta de esa área: ${F("añade a [nombre] con [correo] como responsable del área [área] en guia.md")}. Si va a trabajar en el área de otra persona, va en la misma celda como colaboradora: ${F("añade a [nombre] con [correo] como colaborador del área [área]")}. Si solo va a trabajar en un proyecto, se declara en ese proyecto: ${F("añade a [nombre] con [correo] como colaborador de este proyecto")}, en una sesión del responsable del área. La tabla de <code>guia.md</code> la escribe ${CTX}. Sin nada de eso, Claude le preguntará antes de escribir.</span></li>
      <li><b>Compártele la carpeta</b><span>Lo hace ${ADM}, desde Google Drive en la web: «Lector» en toda la carpeta ${ORG}, y «Gestor de contenido» en la carpeta del área donde va a escribir (clic derecho › Compartir), o solo en la del proyecto si colabora en uno. «Colaborador» no sirve, porque no deja mover ni borrar archivos, y «Gestor de contenido» en la unidad entera le abriría la escritura en todas las áreas. Si la carpeta está en «Mi unidad» y no en una unidad compartida, los roles son «Lector» y «Editor». Si hay algo que esa persona no deba leer, se marca con acceso limitado antes de compartir.</span></li>
      <li><b>Mándale las instrucciones</b><span>Copia este mensaje y envíaselo por correo o por chat.</span></li>
    </ol>
    <div class="frase"><code class="frase-t" style="white-space:pre-line">${esc(MSG_SUMAR)}</code><button type="button" class="chip" data-copy="${esc(MSG_SUMAR)}">Copiar</button></div>
    <p class="hc-nota">Si la carpeta de ${ORG} no vive en Google Drive, los pasos 2 y 3 del mensaje son los de su nube: aceptar la carpeta compartida y tenerla siempre descargada en la computadora. Con los archivos solo en la nube, Claude no puede leerlos, y el tablero sale vacío.</p>
    <p class="hc-nota">Si dos personas escriben en la misma área, que no cierren sesión del mismo proyecto al mismo tiempo: las dos escrituras pueden pisarse.</p>`},
  {g:"Para empezar", id:"carpeta-drive", t:"Montar la carpeta en Drive", h:`
    <p>Lo hace ${ADM}, una vez, antes de que nadie se conecte. El resto del equipo no tiene que hacer nada de esto.</p>
    <dl class="hc-def">
      <dt>Mejor una unidad compartida</dt><dd>Sus archivos son de la organización y no de una persona: si alguien se va, nada se pierde. Las unidades compartidas son de Google Workspace; con una cuenta personal de Gmail no las hay, y la carpeta va en «Mi unidad» de quien administra, compartida con el equipo. Entonces los archivos son de esa persona: si deja la organización, hay que pasarlos antes a otra cuenta.</dd>
      <dt>La raíz</dt><dd>La unidad entera o una carpeta de su primer nivel, con <code>guia.md</code> y <code>metodo.md</code> dentro. Una sola por organización, con un nombre sin signos raros.</dd>
      <dt>Los permisos</dt><dd>En la unidad compartida, todo el equipo como «Lector» y solo quien la administra como «Administrador». En la carpeta de cada área (clic derecho › Compartir), «Gestor de contenido» para su responsable y quienes colaboran en ella; quien colabora en un solo proyecto, solo en la carpeta de ese proyecto. Nunca «Colaborador», que no deja mover ni borrar archivos, ni «Gestor de contenido» en la unidad entera, que abre la escritura en todas las áreas. En «Mi unidad», los roles son «Lector» y «Editor». Lo que no puede leer todo el equipo se marca en su carpeta con el acceso limitado de Drive, desde la web; en una unidad compartida lo pone quien la administra.</dd>
      <dt>En cada computadora</dt><dd>Cada persona marca la carpeta «Disponible sin conexión» y la conecta a Claude, como dice <button type="button" class="lnk" data-help="conectarte">Conectarte</button>. En Windows la unidad aparece como una letra de disco aparte (por ejemplo, G:) y se conecta igual: Claude trabaja con ella algo más lento, y para mover archivos necesita el conector de Google Drive activado en Claude.</dd>
    </dl>
    <p class="hc-nota">Para sumar a alguien después: <button type="button" class="lnk" data-help="sumar">Sumar a un compañero</button>.</p>`},
  {g:"Para empezar", id:"primera-sesion", t:"Tu primera sesión", h:`

  {g:"Para empezar", id:"varias-memorias", t:"Más de una memoria", h:`
    <p>Una memoria es una carpeta por organización o por mundo, y conviene tener varias si trabajas en varios: una para el trabajo, que puede ser compartida con tu equipo; otra para tus temas personales; otra para la casa. Cada una tiene su propia <code>guia.md</code>, sus áreas y su tablero, y no se mezclan.</p>
    <ul class="hc-l">
      <li><b>Temas distintos en cada una.</b> Lo que va en una no tiene por qué saberse en otra: la memoria del trabajo no lee la de la casa, ni al revés.</li>

      <li><b>Se montan igual.</b> ${F("monta la carpeta de…")} con una carpeta vacía crea la guía, el método y la primera área; para una memoria personal, tú eres la única cuenta y todas las áreas son tuyas.</li>
    </ul>`},
  {g:"Cada día", id:"frases", t:"Qué decirle a Claude", h:`
    <p>Hablas con Claude como siempre. Estas frases funcionan tal cual, y también sus variantes.</p>
    <div class="hc-tbl"><table>
      <thead><tr><th>Dices</th><th>Pasa</th></tr></thead>
