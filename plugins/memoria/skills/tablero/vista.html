<title>Tablero</title>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura; tres niveles (raíz → área → proyecto) en la misma página, navegados por hash.
   Identidad TuOpinas: grafito y verde señal, Zilla Slab para títulos, IBM Plex para texto y datos. */
:root{
  --ground:#F4F5F5; --surface:#FFFFFF; --ink:#17191A; --ink-soft:#40474A; --muted:#666D70;
  --rule:#DCDFE0; --rule-soft:#E9EBEC; --signal:#0B6E4F; --signal-dim:#E3F1EA; --on-signal:#FFFFFF;
  --warn:#6B4E00; --warn-dim:#FCEBB0; --warn-fill:#E8A317; --alert:#C4232B; --alert-dim:#F8E3DF; --on-alert:#FFFFFF;
  --pause:#5B6266; --pause-dim:#ECEEEF; --code:#EEF0F1;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E1112; --surface:#171A1B; --ink:#E8EAEB; --ink-soft:#B0B6B8; --muted:#868D90;
  --rule:#272C2E; --rule-soft:#1D2122; --signal:#3FD69B; --signal-dim:#10261E; --on-signal:#0E1112;
  --warn:#F5C542; --warn-dim:#3A2F0A; --warn-fill:#F5C542; --alert:#E5484D; --alert-dim:#2C1714; --on-alert:#FFFFFF;
  --pause:#A7AEB1; --pause-dim:#202527; --code:#1F2425; --velo:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:24px}
a{color:var(--signal)}
code{font:.92em var(--f-mono);background:var(--code);padding:1px 5px;border-radius:3px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,5vw,38px)/1.1 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 22px/1.2 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 17px/1.25 var(--f-display);margin:0}
p{margin:0}
.sub{color:var(--ink-soft)}
/* migas */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumbs button{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.crumbs .sep{color:var(--rule)}
header{display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink-soft);font-weight:500}
/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);letter-spacing:.02em;padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.pill.ok{background:var(--signal-dim);color:var(--signal)}
.pill.soon{background:var(--warn-dim);color:var(--warn)}
.pill.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.pill.none{background:var(--pause-dim);color:var(--pause)}
.pill.closed{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.pill.draft{background:transparent;border:1px dashed var(--rule);color:var(--muted)}
/* franja: lo que vence */
.due{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px}
.due .top,.personas .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.due .top .c,.personas .top .c{font:500 12px var(--f-mono);color:var(--muted)}
.due-list{display:grid;gap:6px}
.due-item{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule-soft);border-radius:4px}
.due-item:first-child{border-top:none}
.due-item:hover .t{text-decoration:underline;text-underline-offset:3px}
.due-item:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-item .t{min-width:0;font-size:14px;color:var(--ink)}
.due-item .w{grid-column:2;font-size:12.5px;color:var(--muted)}
/* áreas en la raíz */
.area{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.area-h{all:unset;cursor:pointer;display:grid;gap:4px;width:100%;box-sizing:border-box;padding:14px 16px;border-bottom:1px solid var(--rule-soft)}
.area-h:hover h2{text-decoration:underline;text-underline-offset:4px}
.area-h:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.area-h .d{color:var(--ink-soft);font-size:14px;max-width:70ch}

.tags{display:flex;gap:6px;flex-wrap:wrap}

/* nivel área */
.prios{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:8px}
.prios ol{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-soft);font-size:14px}
.prios ol li::marker{font:500 12px var(--f-mono);color:var(--muted)}
.prio-l{gap:8px}
.prio{display:list-item}
.prio-t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;color:var(--ink-soft)}
.prio.done .prio-t .tx{color:var(--muted);text-decoration:line-through}
.prio-a{display:inline-flex;align-items:baseline;gap:10px;white-space:nowrap}
.prio-m{font:500 11.5px var(--f-mono);color:var(--muted)}
.prio-m.late{color:var(--alert);font-weight:600}.prio-m.soon{color:var(--warn)}
.prio-go{all:unset;cursor:pointer;font:600 13px var(--f-body);color:var(--signal);border-radius:4px;padding:2px 4px}
.prio-go:hover{text-decoration:underline;text-underline-offset:3px}
.prio-go:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (max-width:600px){.prio-t{grid-template-columns:1fr}}
body.modal-open{overflow:hidden}
.modal-bg{position:fixed;inset:0;z-index:50;background:var(--velo,rgba(10,12,13,.45));display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid;gap:0;outline:none}
.modal-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:20px 22px 14px;border-bottom:1px solid var(--rule-soft);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{font-size:20px;margin-top:4px}
.modal-h .sub{font-size:14px;margin-top:6px}
.modal-x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.modal-x:hover{background:var(--rule-soft)}
.modal-x:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.modal-s{padding:16px 22px;display:grid;gap:10px;border-bottom:1px solid var(--rule-soft)}
.modal-s h3{display:flex;gap:8px;align-items:baseline}
.modal-s h3 .c{font:500 12px var(--f-mono);color:var(--muted)}
.modal-f{padding:14px 22px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.ents{display:grid;gap:4px}
/* Qué hay: el inventario de piezas y la suma por área */
.qh-pz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--rule-soft)}
.qh-pz:first-child{border-top:none}.qh-pz b{font-weight:600}.qh-pz .f{color:var(--muted);font-size:13px;white-space:nowrap}
.qh-pz .af{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft);font-style:italic}.qh-pz .af.no{font-style:normal;color:var(--muted)}
.qh-pz .sg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px}.qh-pz .sg span{color:var(--muted)}.qh-pz .sg span+span::before{content:"· ";}
.qh-sum{width:100%;border-collapse:collapse;font-size:13.5px}.qh-sum th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
.qh-sum td{padding:8px 8px 8px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}.qh-sum td.n{white-space:nowrap;color:var(--ink-soft)}.qh-sum .giro{color:var(--ink-soft)}.qh-sum .giro time{color:var(--muted);font-size:12px}
@media (max-width:640px){.qh-sum th:nth-child(4),.qh-sum td:nth-child(4){display:none}}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft)}
.ent:first-child{border-top:none}
.ent b{font-weight:600}
.ent .d{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft)}
.ent .f{font:500 11.5px var(--f-mono);color:var(--muted)}
/* nivel proyecto */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;display:grid;gap:12px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{font:500 11.5px/1.7 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:0;min-width:0;color:var(--ink-soft)}
@media (max-width:480px){dl.facts{grid-template-columns:1fr;gap:2px}dl.facts dd{margin-bottom:8px}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tab:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.tab .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.md{color:var(--ink);display:grid;gap:10px;font-size:14.5px}
.md ul,.md ol{margin:0;padding-left:20px;display:grid;gap:4px}
.md table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.md th,.md td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.md th{font-weight:600;background:var(--ground)}
.tbl{overflow-x:auto}
.md h4{font:600 15px/1.3 var(--f-display);margin:6px 0 0}
.steps{display:grid;gap:6px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:14px}
.step:first-child{border-top:none}
.step.h{grid-template-columns:1fr;font:600 13px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px}
.dec{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--rule-soft)}
.dec:first-child{border-top:none;padding-top:0}
.dec .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dec .hd time{font:500 12px var(--f-mono);color:var(--muted)}
.dec dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.dec dt{font:500 11.5px/1.7 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dec dd{margin:0;min-width:0;color:var(--ink-soft);white-space:pre-line}
@media (max-width:480px){.dec dl{grid-template-columns:1fr}}
.more{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* navegador de la raíz */
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--rule);flex:none}
.dot.ok{background:var(--signal)}.dot.soon{background:var(--warn-fill)}.dot.late{background:var(--alert)}.dot.none{background:var(--rule);box-shadow:inset 0 0 0 1px var(--muted)}.dot.closed{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}.dot.pause{background:var(--pause)}.dot.risk{outline:2px solid var(--alert);outline-offset:1.5px}
.pill.est{font-weight:600}
[data-tip]{border-radius:3px}
[data-tip]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#tip{position:fixed;z-index:1000;background:var(--ink);color:var(--surface);font:400 12.5px/1.45 var(--f-body);letter-spacing:0;text-transform:none;padding:8px 10px;border-radius:6px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none;left:0;top:0}
#tip[hidden]{display:none}


/* pasos con controles */
.step{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
.step.h{grid-template-columns:1fr}
.step input[type="checkbox"]{width:18px;height:18px;accent-color:var(--signal);margin:2px 0 0;cursor:pointer}
.nochk{width:18px;height:18px;display:inline-block}
.step-t{min-width:0;display:grid;gap:2px}
.step.done .tx{color:var(--muted);text-decoration:line-through}
.pend-note{font-size:12.5px;color:var(--warn)}
.step .w{font-size:12.5px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--signal);font-weight:500;border-radius:3px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.due-edit{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;white-space:nowrap;background:var(--rule-soft);color:var(--ink-soft)}
.due-edit.none{background:var(--pause-dim);color:var(--pause)}
.due-edit.late{background:var(--alert);color:var(--on-alert);font-weight:600}
.due-edit.soon{background:var(--warn-dim);color:var(--warn)}
.due-edit:hover{filter:brightness(.94)}
.due-edit[aria-expanded="true"]{box-shadow:0 0 0 2px var(--signal)}
.due-edit:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.cal{width:12px;height:12px}
.due-form,.hecho-form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 2px 28px}
.hecho-form .search{flex:1 1 220px}
.chip{all:unset;cursor:pointer;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);min-height:20px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.chip.ghost{border-color:transparent;color:var(--muted)}
.cal-box{flex-basis:100%;max-width:280px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px;text-transform:capitalize}
.cal-nav{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:6px;font-size:18px;color:var(--ink-soft)}
.cal-nav:hover{background:var(--rule-soft)}
.cal-nav:focus-visible,.cal-d:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-w{font:500 11px var(--f-mono);color:var(--muted);padding:4px 0}
.cal-d{all:unset;cursor:pointer;height:32px;display:grid;place-items:center;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cal-d:hover{background:var(--rule-soft)}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--signal);color:var(--signal);font-weight:600}
.cal-d.sel{background:var(--signal);color:var(--on-signal);font-weight:600}
.search{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;min-width:0}
.search:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.btn{all:unset;cursor:pointer;background:var(--signal);color:var(--on-signal);font-weight:600;border-radius:6px;padding:8px 14px}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.anotar{display:flex;gap:8px;flex-wrap:wrap}
.anotar .search{flex:1 1 240px}
.due-item.static{cursor:default}
.due-item.static .t{text-decoration:none}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:6px;font-size:14px}
/* dos columnas: índice fijo a la izquierda, contenido a la derecha */
body{padding-inline:0;padding-block:0}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));overflow-y:auto;padding:18px 12px 24px}
.side-org{font:700 20px/1.1 var(--f-display);padding:4px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync-g{display:inline-flex;align-items:center;gap:2px;flex:none}
.sync-cuando{font:500 11.5px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.sync-ico{all:unset;position:relative;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:999px;color:var(--muted);flex:none}
.sync-ico svg{width:18px;height:18px}
.sync-ico:hover{background:var(--signal-dim);color:var(--signal)}
.sync-ico:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sync-ico.done{color:var(--signal);cursor:progress}
.sync-ico.off{opacity:.45}
.sync-ico.pend::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn-fill)}
.sync-ico.busy{color:var(--muted);cursor:progress}
.sync-ico.busy svg,.sync-ico.done svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes late{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sync-ico.busy svg,.sync-ico.done svg{animation:late 1.4s ease-in-out infinite}}
.side-i{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;font-size:13.5px;color:var(--ink-soft)}
.side-i span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-i.top{grid-template-columns:minmax(0,1fr) auto;font-weight:600;color:var(--ink)}
.side-i.area{grid-template-columns:minmax(0,1fr) auto;font:600 15px/1.2 var(--f-display);color:var(--ink);margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.side-i.area small{font:500 11.5px var(--f-mono);color:var(--muted)}
.side-i.proj{padding-left:14px}
.side-i.proj.closed span{color:var(--muted)}
.side-i:hover{background:var(--ground)}
.side-i[aria-current="page"]{background:var(--signal-dim);color:var(--signal)}
.side-i[aria-current="page"] span{color:var(--signal)}
.side-i:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.side-n{font:600 11px var(--f-mono);background:var(--rule-soft);color:var(--ink-soft);border-radius:999px;padding:2px 7px}
.side-n.late,.side-i[aria-current="page"] .side-n.late{background:var(--alert);color:var(--on-alert)}
.side-arch{padding:10px 8px 0}
.side-arch .lnk{font-size:12.5px;color:var(--muted)}
.pane{min-width:0;display:grid;gap:24px;align-content:start;padding:24px clamp(16px,3vw,40px) 64px;max-width:1040px}
.pane > #main{width:100%;max-width:none;margin:0}
.side-toggle{display:none}
@media (max-width:860px){

// Markdown mínimo: párrafos, listas, tablas, negritas, código, enlaces relativos como texto.
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')

}
function md(text){

    const lines = b.split("\n");
    if(lines.every(l => l.trim().startsWith("|"))){
      const rows = lines.filter(l => !/^\|?\s*-{2,}/.test(l.replace(/\|/g,"").trim()) && !/^\|[\s\-|:]+\|$/.test(l.trim()));
      const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c => inline(c.trim()));
      const [h, ...body] = rows;
      return `<div class="tbl"><table><thead><tr>${cells(h).map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if(lines.every(l => /^\s*[-*] /.test(l))) return `<ul>${lines.map(l=>`<li>${inline(l.replace(/^\s*[-*] /,""))}</li>`).join("")}</ul>`;
    if(lines.every(l => /^\s*\d+[.)] /.test(l))) return `<ol>${lines.map(l=>`<li>${inline(l.replace(/^\s*\d+[.)] /,""))}</li>`).join("")}</ol>`;

    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}

function hsh(x){ let h = 5381; for(let i=0;i<x.length;i++) h = ((h<<5)+h+x.charCodeAt(i))|0; return (h>>>0).toString(36); }
const entKey = (p, e) => p.id+"|"+e.archivo+"|"+(e.actualizado||"");
function huellas(){
  const d = [], e = [], ps = {};
  for(const p of PROJ){ if(p.restringido) continue;
    for(const x of (p.decisiones||[])) d.push(hsh(decKey(p,x)));
    for(const x of (p.entregables||[])) if(x.estado==="vigente") e.push(hsh(entKey(p,x)));
    for(const x of (p.pasos||[])) if(!isHeader(x)) ps[hsh(p.id+"||"+x.texto)] = [p.id, x.texto.slice(0,220)];

  return {d, e, p: ps};
}
function visita(){
  if(NOV !== null || !META || !(ready.a && ready.p)) return;

  const k = "tablero-visto:" + (META.organizacion||"") + ":completo";
  try{ const v = "tablero-visto:" + (META.organizacion||"") + ":publico"; if(!localStorage.getItem(k) && localStorage.getItem(v)) localStorage.setItem(k, localStorage.getItem(v)); }catch(e){}
  let st = null;
  try{ st = JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ NOV = false; return; }
  const ahora = {sinc: META.sincronizado, visto: today(), ...huellas()};
  // la base es la última versión del tablero que viste; mientras la versión no cambie, la base se queda quieta
  const prev = st && st.cur && st.cur.sinc !== ahora.sinc ? st.cur : (st && st.prev) || null;
  NOV = prev ? {desde: prev.visto, d: new Set(prev.d||[]), e: new Set(prev.e||[]), p: prev.p||{}} : false;
  try{ localStorage.setItem(k, JSON.stringify({prev, cur: ahora})); }catch(e){}
}
function isNew(k, pid, x){
  if(!NOV) return false;
  if(k==="p") return !NOV.p[hsh(pid+"||"+x)];
  if(k==="d") return !NOV.d.has(hsh(x));
  if(k==="e") return !NOV.e.has(hsh(x));
  return false;
}

function desfase(p, e, idx){

  const out = {ents:[], blandos:[]};
  if(!e.actualizado || !(e.basado_en||[]).length) return out;
  for(const b of e.basado_en){
    const r = b.replace(/^\.?\//,""), x = idx[r];
    if(x){ if(x.e.actualizado && x.e.actualizado > e.actualizado) out.ents.push(x); continue; }
    const seg = r.split("/"), q = byId[seg[0]+"--"+seg[1]]; if(!q) continue;
    if(/decisiones\.md$/.test(r)){ const f = (q.decisiones||[])[0]?.fecha; if(f && f > e.actualizado) out.blandos.push(`hay decisiones de ${q.nombre} posteriores (la última, del ${fmtD(f)})`); }

const tagDe = p => p.area+"/"+p.slug;

  // lo que promete «si aceptas» es lo que hace el cierre (sesion, cerrar.md, paso 0): nada se escribe sin el sí en la sesión
  "candidato-entregable": [p => "¿Hacer un documento con esto?", "Sí, hacerlo", p => `Si aceptas, la próxima sesión de ${p.nombre} te lo propone; si no da tiempo, queda como tarea nueva.`],
  "paso-hecho": [p => "¿Quitar esta tarea de los siguientes pasos?", "Sí, quitarlo", p => `Si aceptas, la próxima sesión de ${p.nombre} lo quita, con tu sí.`],
  "decision-sin-registrar": [p => "¿Registrar esta decisión?", "Sí, registrarla", p => `Si aceptas, la próxima sesión de ${p.nombre} te la enseña escrita para tu sí.`],
  "contradiccion": [p => "Dos documentos no cuadran: ¿revisarlos?", "Sí, revisarlos", p => `Si aceptas, la próxima sesión de ${p.nombre} te los propone; si no da tiempo, queda como tarea nueva.`],
  "estado-desfasado": [p => `¿Reescribir el Estatus de ${p.nombre}?`, "Sí, reescribirlo", p => `Si aceptas, la próxima sesión de ${p.nombre} lo reescribe.`]
};
// las notas de donde sale una sugerencia van plegadas, por su nombre y no por su ruta
const notasDeTexto = t => { const m = (t||"").match(/\s*\(de ((?:[\w./-]+\.md(?:,\s*)?)+)[^)]*\)\.?\s*$/); if(!m) return {t, notas: []};
  return {t: t.slice(0, m.index).replace(/\s+$/,""), notas: m[1].split(/,\s*/).map(r=>r.split("/").pop().replace(/\.md$/,"").replace(/-/g," "))}; };
function sugerencias(){
  return PROPUESTAS.filter(q=>q.estado==="pendiente" && q.clase!=="afirma" && q.clase!=="rotacion" && byId[q.proyecto] && !byId[q.proyecto].restringido && !byId[q.proyecto].cerrado)
    .sort((a,b)=>(b.creado||"").localeCompare(a.creado||""));
}
function filaSugerencia(q){
  const p = byId[q.proyecto], k = CLASE_PROP[q.clase] || q.clase, pr = PREG_PROP[q.clase] || [() => "¿Aceptar esta sugerencia?", "Aceptar", () => ""];
  // el porqué que dejó el barrido, sin rutas, cuando lo hay; si no, el texto de la sugerencia (revisión 1.23.3)
  const limpio = textoPropLimpio(q), porQue = (q.por_que||"").replace(/[\w./-]+\.md\b/g, m => m.split("/").pop().replace(/\.md$/,"").replace(/-/g," ")).trim();
  const {t: t0, notas} = notasDeTexto(limpio), t = porQue && q.clase!=="paso-hecho" ? `${t0.replace(/[.\s]+$/,"")}. ${porQue.replace(/^./, c=>c.toUpperCase()).replace(/[.\s]*$/,".")}` : t0;
  const puede = CAN && OWNER && DATOS_NUEVOS(), mio = escribeAqui(p);
  const acc = !puede ? "" : !mio ? `<span class="more">Es de ${esc(nombreCorto(p.dueno||""))}: pásasela.</span>` : `<button type="button" class="chip pri" data-nc="${esc(q.id)}" data-v="aceptada">${esc(pr[1])}</button><button type="button" class="chip ghost" data-nc="${esc(q.id)}" data-v="descartada">No hace falta</button>`;
  return `<div class="sg"><span class="kind">${esc(k)}</span><span class="q">${esc(pr[0](p))}</span><span class="why">${inline(t.replace(/^./, c=>c.toUpperCase()))}</span>${mio && puede ? `<span class="then">${esc(pr[2](p))}</span>` : ""}
    <span class="foot">${acc ? `<span class="acc-b izq" style="margin:0">${acc}</span>` : ""}<span class="w">${irProy(p, "estatus", {sel:".corto"})} · ${esc(areaBy[p.area]?.nombre||"")}</span>${notas.length ? `<details><summary>Ver ${notas.length===1?"la nota":`las ${notas.length} notas`}</summary>${notas.map(esc).join(" · ")}</details>` : ""}</span></div>`;
}
// una tarjeta por proyecto con todo lo que hay que poner al día en él y una sola frase para Claude
function porPonerAlDia(){
  const pos = pospuestos(), out = [], porId = {};
  const add = (id, base, txt, frase) => { const g = porId[id] = porId[id] || (out.push({id, ...base, it:[], fr:[]}), out[out.length-1]); if(!g.it.includes(txt)) g.it.push(txt); if(frase && !g.fr.includes(frase)) g.fr.push(frase); };
  const viejosMios = new Set(PROJ.filter(p=>activo(p) && esMio(p) && estatusViejo(p)).map(p=>p.id)), mt = mtDatos(), conDetalle = new Set(mt.map(f=>f.id));
  for(const p of PROJ){ if(p.restringido || p.cerrado) continue;
    // un paso que espera a alguien sin decir a quién: se arregla en la sesión del proyecto (1.23.5: estaba en «La carpeta»)
    // si la tarea ya nombra a alguien con nombre y apellido, lo que falta es su organización (revisión de la 1.24)
    const sq = sinQuienDe(p), sinOrg = sq.map(s=>((s.texto||"").match(new RegExp(`(?<=\\s)([A-ZÁÉÍÓÚÑ][a-záéíóúñü]+ [A-ZÁÉÍÓÚÑ][a-záéíóúñü]+)(?![${LETRA}(])(?!\\s*\\()`))||[])[1]).find(Boolean);
    if(sq.length) add(p.id, {p}, sinOrg && sq.length===1 ? `${citaPaso(sq[0].texto)} nombra a ${esc(sinOrg)} sin su organización: escríbelo «${esc(sinOrg)} (Organización)».` : `${cuantos(sq.length,"tarea espera","tareas esperan")} a alguien sin decir a quién: ${citaPaso(sq[0].texto)}${sq.length>1?` y ${sq.length-1} más`:""}.`, "escribe en las tareas que esperan a alguien a quién esperan, como «Nombre Apellido (Organización)»");
    // si ya hay una sugerencia de reescribirlo, la pregunta va arriba y aquí no se repite
    if(propsDe(p.id).some(q=>q.clase==="estado-desfasado" && q.estado==="pendiente")) continue;
    const fe = fechaEstatus(p), tras = fe && p.ultima_sesion && p.ultima_sesion > fe;
    if(tras || viejosMios.has(p.id)) add(p.id, {p}, !fe ? "Sin Estatus todavía." : `El Estatus es del ${fmtD(fe)}, hace ${cuantos(diasDesde(fe),"día","días")}${tras?`, y hubo sesión el ${fmtD(p.ultima_sesion)}`:""}: ya no dice cómo va.`, "reescribe su Estatus");
    const fd = faltaDecidir(p); if(fd && fe){ const dec = decisionesTodas(p).filter(d=>d.fecha > fe); if(dec.length) add(p.id, {p}, `Lo que falta decidir puede estar resuelto: hay ${cuantos(dec.length,"decisión","decisiones")} después del Estatus.`, "mira si lo que falta decidir ya se decidió"); }
  }
  for(const f of mt){ if(f.r) continue;
    const id = f.p ? f.p.id : "a:"+f.a.slug, base = f.p ? {p:f.p} : {a:f.a};
    // lo marcado aquí y las sugerencias ya tienen su sitio en esta pestaña
    const it = f.it.filter(x=>x.k!=="cola" && x.k!=="prop" && x.k!=="prio"); if(!it.length) continue;
    for(const x of it) add(id, base, x.txt.replace(/^./, c=>c.toUpperCase()) + ".", null);
    const fr = (f.frase.split(": ").slice(1).join(": ")||"").split("; ").filter(x=>x && !/sugerencias de la memoria|lo que se marcó en el tablero/.test(x));
    for(const x of fr) add(id, base, null, x);
  }
  for(const x of noCuadra()) if(x.a && !x.p) add("a:"+x.a.slug, {a:x.a}, x.t.replace(/<[^>]+>/g,""), x.id.startsWith("prio:") ? "revisa sus prioridades" : "reescribe su Estatus");
  for(const g of out){ g.it = g.it.filter(Boolean); g.detalle = conDetalle.has(g.id);
    g.frase = g.p ? `abre sesión en ${g.p.area}/${g.p.slug} y pon al día su memoria: ${g.fr.join("; ")}` : `abre sesión en el área ${g.a.slug} y ${g.fr.join("; ")}`; }
  return {todas: out, activas: out.filter(g=>!pos[g.id] && g.it.length)};
}
// lo que se arregla en la guía o en cómo se escribe la carpeta: le toca a quien responde por el contexto
function deLaCarpeta(){
  const out = [], ctx = !!(META && META.soy_contexto);
  for(const f of mtDatos()) if(f.r) out.push({t: f.it[0].txt + ".", frase: f.frase.replace(/^abre sesión[^:]*:\s*/,""), dueno: "contexto"});
  const sinNom = AREAS.filter(a=>a.legible!==false && !archivada(a)).reduce((n,a)=>n+(a.colaboran_sin_nombre||0),0);
  if(sinNom) out.push({t: `${cuantos(sinNom,"persona colabora","personas colaboran")} sin nombre junto a su cuenta: el tablero no sabe quién ${sinNom===1?"es":"son"}.`, frase: "en guia.md, escribe el nombre de quien colabora en cada área junto a su correo, o en una línea «Colabora: Nombre Apellido (correo)» de su proyecto", dueno: "contexto"});
  return {items: out, ctx};
}
function tabMant(){
  // dos secciones (1.24): lo que hay que arreglar ya, que es lo único que cuenta, y los proyectos por poner al día
  const arr = arreglarYa(), pad = ponerAlDia();
  const acept = PROPUESTAS.filter(q=>q.estado==="aceptada" && q.clase!=="afirma" && byId[q.proyecto]);
  const nCola = cambiosVis().length + acept.length;
  const sinQuien = q => byId[q.proyecto].escribe===false;
  const filaAcept = q => `<div class="due-item static${sinQuien(q)?" orf":""}"><span class="pill ok">Aceptada</span><span class="t">${inline(notasDeTexto(textoPropLimpio(q)).t)}${sinQuien(q) ? `<span class="pend-note">Este tablero ya no escribe en ese proyecto: nadie la aplicará. Pásasela a ${esc(nombreCorto(byId[q.proyecto].dueno||""))} o descártala.</span>` : ""}</span><span class="w">${esc(byId[q.proyecto].nombre)}${CAN && OWNER ? ` · <button type="button" class="lnk" data-nc="${esc(q.id)}" data-v="${sinQuien(q)?"descartada":"pendiente"}">${sinQuien(q)?"Descartar":"Deshacer"}</button>` : ""}</span></div>`;
  const cola = nCola ? `<details class="card mas-c"><summary><h2 style="display:inline">Marcado aquí, por registrar</h2><span class="more"> · ${nCola} · lo pasa a la carpeta la próxima puesta al día o la sesión del proyecto</span></summary><div class="due-list" style="margin-top:10px">${acept.map(filaAcept).join("")}${colaRows()}</div></details>` : "";
  const ok = !arr.length && !pad.length ? `<p class="empty">Nada que arreglar ni por poner al día.</p>` : "";
  return {n: arr.length, info: pad.length, html: seccionArreglar(arr) + seccionPonerAlDia(null) + ok + permisosLinea() + versionLinea() + cola};
}

const provDe = ruta => { const q = PROPUESTAS.find(c=>c.clase==="afirma" && c.ruta===ruta && c.estado!=="descartada"); return q ? q : null; };

// ---- Acciones: te toca a ti, y con otros (te deben / les debes) ----
// el verbo vale con mayúscula inicial («Revisar con Diego…», al principio del paso); el nombre sigue pidiendo mayúscula (1.23)
const VERBOS_DEBES = "mandar mandarle manda enviar enviarle envía avisar avisarle avisa pedir pedirle pide preguntar preguntarle pregunta escribir escribirle responder responderle llamar presentar proponer compartir agendar confirmar acordar revisar buscar".split(" ");
const RE_DEBES = new RegExp("\\b(" + VERBOS_DEBES.map(v=>`[${v[0].toUpperCase()}${v[0]}]${v.slice(1)}`).join("|") + ")(?:le)?\\s+(?:a|con)\\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)");
const RE_ESPERA_V = /\b(espera|esperar|esperando|pendiente de|que (?:nos )?(?:confirme|responda|firme|mande|envíe|apruebe|valide|decida))\b/i;
const RE_ESPERA_QUE = /^(?:\s*20\d\d-\d\d-\d\d[^·:]{0,60}[·:]\s*)?(?:\*\*[^*]+\*\*[.:]?\s*)?(?:[Qq]ue\s+[A-ZÁÉÍÓÚÑ]|[Rr]ecibir\b)/;
const RE_ESPERA = {test: t => RE_ESPERA_V.test(t||"") || RE_ESPERA_QUE.test(t||"")};
// lo que no es esperar a alguien aunque lo diga: una reunión sin fecha o una decisión tuya (revisión de la 1.24)
const RE_NO_ESPERA = /pendiente de (?:fecha|agendar)|\b(?:sesión|reunión|junta|llamada)\b[^.;]{0,40}\bpendiente\b/i;
// a quién se espera: el complemento del verbo («esperar la confirmación de X», «a que X…», «recibir … de X») o el sujeto
// de «Que X haga…»; no la primera persona que el texto nombre (revisión de la 1.24)
const RE_ESPERADO = [/\b(?:[Ee]sperar|[Ee]spera|[Ee]sperando|[Pp]endiente de)\s+(?:(?:a\s+)?que\s+|a\s+)?(?:(?:la|el|los|las|su|sus)\s+)?(?:[a-záéíóúñ]+\s+){0,4}?(?:de\s+|a\s+)?([A-ZÁÉÍÓÚÑ][a-záéíóúñü]+)/,
  /^(?:\s*20\d\d-\d\d-\d\d[^·:]{0,60}[·:]\s*)?(?:\*\*[^*]+\*\*[.:]?\s*)?que\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñü]+)/i,
  /\brecibir\b[^.;]{0,60}?\bde\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñü]+)/i];
const esEspera = (p, s) => !esTareaDecidir(s) && !RE_NO_ESPERA.test(s.texto||"") && (effNat(p,s)==="espera" || RE_ESPERA.test(s.texto||""));
function esperadoEn(p, t, soloConocido){
  for(const re of RE_ESPERADO){ const m = (t||"").match(re); if(!m) continue; const i = m.index + m[0].length - m[1].length;
    const f = (p.personas_fuera||[]).map(x=>typeof x==="string" ? x : x.nombre).find(n=>n && t.startsWith(n, i)); if(f) return f;
    const n = nombreEn(t, i, m[1], p); if(n) return n;
    // alguien que la carpeta no conoce: se espera a quien el texto nombra, tal cual, y no a otra persona del mismo texto
    const raw = t.slice(i).match(new RegExp(`^[A-ZÁÉÍÓÚÑ][a-záéíóúñü]+(?:\\s+(?:(?:de|del|la|las|los|y)\\s+)*[A-ZÁÉÍÓÚÑ][a-záéíóúñü-]+){0,3}`));
    if(raw && !soloConocido) return raw[0]; }
  return null;
}
// un cuestionamiento te toca si cuestiona una decisión de un proyecto tuyo, o una premisa y respondes por el contexto (revisión 1.22.4)
const cuestMio = c => c.abierto && (c.a_proyecto==="premisa" ? (META && META.soy_contexto !== undefined ? META.soy_contexto === true : !!VIEWER() && persona(META && META.contexto_comun)===persona(VIEWER())) : !!(byId[c.a_proyecto] && esMio(byId[c.a_proyecto])));
// pasos de espera sin nadie que el tablero reconozca: se cuentan para decir cómo escribirlos
// un paso citado en una línea: sin la fecha de delante, sin su punto final ni sus comillas, cortado a 70 caracteres
const citaPaso = t => { const c = corta(t).replace(/[«»]/g,"").replace(/[.\s]+$/,""); return `«${c.length>70 ? c.slice(0,69).replace(/\s+\S*$/,"")+"…" : c}»`; };
// también la que nombra a alguien que la carpeta no conoce: sale en «Esperas a» tal cual, y aquí se pide su organización
const sinQuienDe = p => stepsLive(p).filter(s=>esEspera(p, s) && !esperadoEn(p, s.texto, true) && !fueraEn(p, s.texto) && !nombresEn(s.texto, p).length);
// la persona de fuera escrita tal cual en el paso va antes que el índice por nombre de pila, que puede caer en alguien de dentro
const fueraEn = (p, t) => (p.personas_fuera||[]).map(x=>typeof x==="string" ? x : x.nombre).find(n=>n && (t||"").includes(n)) || null;
function conOtros(){
  // quién mira, por su nombre completo: con dos Anas en la carpeta, la otra no es «tú» (segunda vuelta)
  const yo = nombreCorto(VIEWER()), yoN = persona(VIEWER()), esc_ = escribenSet(), por = {};
  const add = (n, lado, x) => { const g = por[n] = por[n] || {n, deben:[], debes:[]}; g[lado].push(x); };
  // en una carpeta con equipo, solo lo tuyo (1.23.4, tablero de Escuela Fácil): de tus proyectos, sus pasos; de los ajenos,
  // solo los que dicen que tú haces algo con alguien. Un paso cuyo sujeto es otra persona («Ana pregunta a Beto…») no es
  // tuyo en ningún proyecto. Sin saber quién mira ni qué escribe, como antes: todo
  const filtra = !!VIEWER() || PROJ.some(p=>p.escribe!==undefined);
  for(const p of PROJ){ if(p.restringido || p.cerrado) continue; const mio = !filtra || esMio(p);
    for(const s of stepsLive(p)){ const c = conocidos(), fuera = n => n && (yo ? persona(n)!==yoN : !esc_.has(persona(n)));
      let lado = null, n = null;
      const md = s.texto.match(RE_DEBES);
      // quién hace el paso: el nombre que va justo delante del verbo, si lo hay («Ana Prueba pide a…»); uno nombrado antes
      // («Tras hablar con Bea, pedir a…») no lo hace. Por el nombre completo: con dos Anas, la otra no eres tú (revisión 1.23.4)
      const ms = md && s.texto.slice(0, md.index).match(/(?:^|[^\wáéíóúñü,;:.])([A-ZÁÉÍÓÚÑ][\wáéíóúñü-]+(?:\s+(?:(?:de|del|la|las|los|y)\s+)*[A-ZÁÉÍÓÚÑ][\wáéíóúñü-]+){0,3})\s*$/);
      const sujeto = ms ? nombresEn(ms[1]) : [], soyYo = x => !!yoN && persona(x)===yoN, deOtro = sujeto.some(x=>!soyYo(x)), deMi = sujeto.some(soyYo);
      if(mio && esEspera(p, s)){ lado = "deben"; const e = esperadoEn(p, s.texto); n = e && fuera(e) ? e : e ? null : (fueraEn(p, s.texto) || nombresEn(s.texto, p).find(fuera)); }
      else if(md && (mio ? !deOtro : deMi)){ lado = "debes"; const n_ = nombreEn(s.texto, md.index + md[0].length - md[2].length, md[2], p); n = n_ && fuera(n_) ? n_ : null; }
      if(lado && n) add(n, lado, {p, t:s.texto, f:effDate(p,s), tab:"quehay", row:key(p.id,s.texto)}); }
    if(mio) for(const s of stepsLive(p)){ if(!esTareaDecidir(s)) continue; const dd = decisorFd(s.texto); if(dd && (yo ? persona(dd)!==yoN : !esc_.has(persona(dd)))) add(dd, "deben", {p, t:"Decide: "+sinFechaDelante(s.texto).replace(/^(?:\*\*[^*]+\*\*[.:]?\s*)?(?:decidir|definir|elegir)\s+/i,""), f:effDate(p,s), tab:"quehay", row:key(p.id,s.texto)}); }
    const fd = mio ? faltaDecidir(p) : null; if(fd){ const d = decisorFd(fd); const ns = d ? [d] : []; for(const n of ns.filter(n=>yo ? persona(n)!==yoN : !esc_.has(persona(n)))) add(n, "deben", {p, t:"Decide: "+fd, f:fechaEstatus(p), tab:"estatus"}); }
  }
  return Object.values(por).map(g=>({...g, dentro: esc_.has(persona(g.n)), total:g.deben.length+g.debes.length, desde:[...g.deben,...g.debes].map(x=>x.f).filter(Boolean).sort()[0]||null})).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n,"es"));
}
// ---- Acciones (1.23.3): por dónde empezar arriba; lo tuyo se resuelve en la fila; «Con otros» lleva lo que esa persona
// decidió y te afecta. Inicio y el área usan las mismas piezas, filtradas.
const irProy = (p, tab, foco) => `<button type="button" class="lnk" data-go-proj="${esc(p.id)}" data-tab="${tab}" ${focoAttr(foco)}>${esc(p.nombre)}</button>`;
// lo que falta decidir se lee como la pregunta que hay que contestar: «si se corrigen…» pasa a «¿Se corrigen…?», y el
// nombre de quien mira entre paréntesis al final sobra

// ---- Voz: la primera frase no empieza por el nombre del área o del proyecto, ni dice «hoy» ----
// En pantalla se corrige el texto ya escrito; la regla de verdad va en escribir.md y la aplica el cierre.
function sinSujeto(t, nombre, fecha){
  let s = (t||"").trim(); nombre = nombre || ""; if(!nombre) return s;
  if(/\b(the|and|has|is|are|with)\b/i.test(s)) return s;
  const re = new RegExp("^(?:el |la |los |las )?"+nombre.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s+(?:de\\s+\\w+\\s+)?", "i");
  if(re.test(s)){ s = s.replace(re, ""); s = s.charAt(0).toUpperCase() + s.slice(1); }
  if(fecha) s = s.replace(/\bhoy\b(?!\s+en\s+d[ií]a)/gi, `el ${fmtD(fecha)}`).replace(/\bayer\b/gi, ()=>{ const d = new Date(fecha+"T12:00:00"); d.setDate(d.getDate()-1); return `el ${fmtD(d.toISOString().slice(0,10))}`; });
  return s.charAt(0).toUpperCase() + s.slice(1);
}


// ---- «Te afecta»: por decisión, solo de otras personas, y en Acciones (es algo a lo que reaccionar: adoptar o cuestionar) ----
// una decisión aceptada o cuestionada ya registrada (1.24): el cuestionamiento de quien mira en el registro, o su
// aceptación, que la puesta al día saca del texto entero de la bitácora («aceptadas» de cada proyecto, revisión de la 1.24)
function yaRespondida(q, d, yo){
  if((d.cuestionado_por||[]).some(c=>persona(c.planteo||"")===yo)) return true;
  const ref = d.id ? refDec(q, d) : ""; if(!ref) return false;
  const k = "acep|"+yo; let set = _M && _M.get(k);
  if(!set){ set = new Set(); for(const p of PROJ) for(const x of (p.aceptadas||[])) if(persona(x.quien||"")===yo) set.add(x.ref); if(_M) _M.set(k, set); }
  return set.has(ref);
}
// lo que otra persona decidió y toca lo tuyo: en otro proyecto, nombrando al tuyo en «Afecta a», o dentro de un proyecto
// tuyo. Sale hasta que lo aceptas o lo cuestionas, no hasta la siguiente sesión; lo de más de 30 días ya no se pregunta
// (revisión de la 1.24)
const AFECTA_DIAS = 30;
function afectaDeOtros(){
  const yo = persona(VIEWER()), por = {}, desde = addDays(-AFECTA_DIAS);
  if(_M && _M.has("afo")) return _M.get("afo");
  const suma = (q, d, p) => { if(!d.id || (d.fecha||"") < desde || d.tipo==="cuestionamiento" || !d.decidio || persona(d.decidio)===yo || yaRespondida(q, d, yo)) return;
    const k = q.id+"#"+d.id; const g = por[k] = por[k] || {q, d, a: []}; if(!g.a.includes(p)) g.a.push(p); };
  for(const p of PROJ){ if(p.restringido || p.cerrado || !esMio(p)) continue;
    for(const {q,d} of afectan(p)) suma(q, d, p);
    // dentro de un proyecto tuyo, lo que registró la sesión de otra persona ese día: lo que registró la tuya ya lo viste,
    // aunque lo decidiera alguien de fuera (segunda vuelta de la revisión de la 1.24)
    for(const d of (p.decisiones||[])){ const ses = sesionesTodas(p).filter(x=>x.fecha===d.fecha);
      // quien decidió cerró sesión ese día, o solo cerraron sesión otras personas
      const quien = persona(d.decidio||""), otras = ses.filter(x=>x.quien && persona(x.quien)!==yo);
      if(otras.some(x=>persona(x.quien)===quien) || (otras.length && otras.length===ses.length)) suma(p, d, p); } }
  const out = Object.values(por).sort((x,y)=>(y.d.fecha||"").localeCompare(x.d.fecha||""));
  if(_M) _M.set("afo", out); return out;
}

// ---- Qué hay: resumen escrito por la puesta al día (RESUMEN_GEN, por proyecto) y, si falta, uno calculado desde las piezas ----
const RESUMEN_GEN = {};   // los párrafos escritos por la puesta al día (colección «resumenes», 1.22.4); si falta o quedó viejo, el calculado
function resumenCalculado(p, piezas){
  const ap = z => z.afirma || (provDe(rutaPieza(p,z))||{}).afirma || "";
  const frase = (lista, max) => lista.slice(0,max).map(z=>{ const a = ap(z); return a ? `${a.replace(/\.$/,"")} (${fmtD(z.actualizado)})` : `«${z.titulo||z.nombre}» (${fmtD(z.actualizado)})`; }).join("; ");
  const ent = piezas.filter(z=>z.tipo==="entregable"), tal = piezas.filter(z=>z.tipo==="taller");
  const vig = ent.filter(z=>z.estado==="vigente").sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||"")), borE = ent.filter(z=>z.estado==="borrador"), bin = ent.filter(z=>!z.estado && z.formato!=="md");
  const borT = tal.filter(z=>z.estado==="borrador").sort((a,b)=>(b.actualizado||"").localeCompare(a.actualizado||"")), viejosT = borT.filter(z=>z.decisiones_despues);
  let e = vig.length ? `Vigente${vig.length===1?"":"s"}: ${frase(vig,3)}${vig.length>3?`; y ${vig.length-3} más`:""}.` : "Nada publicado como vigente.";
  if(borE.length) e += ` En borrador, ${cuantos(borE.length,"pieza","piezas")}${borE.some(z=>z.decisiones_despues)?`, ${borE.filter(z=>z.decisiones_despues).length} con decisiones posteriores a su última versión`:""}.`;
  if(bin.length) e += ` Además ${cuantos(bin.length,"archivo","archivos")} sin cabecera (${[...new Set(bin.map(z=>(z.formato||"").toUpperCase()))].join(", ")}), cuyo estado dicen las decisiones que los produjeron.`;
  let t = borT.length ? `Se trabaja en ${frase(borT,3)}${borT.length>3?`; y ${borT.length-3} piezas más`:""}.` : (tal.length ? "El taller no tiene borradores abiertos." : "Taller vacío.");
  if(viejosT.length) t += ` ${cuantos(viejosT.length,"pieza es","piezas son")} anterior${viejosT.length===1?"":"es"} a decisiones que las tocan.`;
  return {ent: e, tal: t};
}

function estatusAreaCompleto(a){
  const txt = a.en_corto||"";
  const ls = txt.split("\n"), l0 = ls[0]||"", m = l0.match(/^(20\d\d-\d\d-\d\d)\s*[·:—-]\s*(.*)$/);
  const tit = m ? sinSujeto(m[2].replace(/\*\*/g,"").trim(), a.nombre, m[1]) : "";
  const items = [], sig = [];
  for(const l of (m ? ls.slice(1) : ls)){ if(/^\s{2,}-/.test(l)) sig.push(l.replace(/^\s*-\s*/,"")); else if(/^\s*-/.test(l)) items.push(l.replace(/^\s*-\s*/,"")); }
  // las prioridades del área son su «Siguiente»: se atienden aquí, con su ventana (1.24: antes, arriba de Acciones)
  const ps = (a.proyectos||[]).map(i=>byId[i]).filter(Boolean), prios = (a.prioridades||[]).length ? a.prioridades : sig;
  const lis = items.filter(i=>!/^`[^`]+\/`/.test(i)).map(i=>/^\*\*Siguiente/.test(i) && prios.length ? `<li>${inline(i)}<ol class="prio-l">${prios.map((x,k)=>prioItem(a, ps, x, k)).join("")}</ol></li>` : `<li>${inline(i)}</li>`).join("");
  if(!m && !a.en_corto && a.panorama && a.panorama.texto) return `<section class="card pan"><p class="corto-t">${panTxt(a)}</p><p class="more">Es el resumen del área en su forma de antes: el próximo cierre del área lo reescribe.</p></section>`;
  if(!m) return `<section class="card pan"><p class="empty">Sin Estatus todavía: lo escribe el director del área al cerrar una sesión en ella.</p>${lis?`<p class="more">Mientras tanto, lo escrito en su sección:</p><ul class="corto-l">${lis}</ul>`:""}</section>`;
  if(!tit && !lis) return `<section class="card pan"><p class="empty">Sin Estatus todavía: lo escribe el director del área al cerrar una sesión en ella.</p></section>`;
  return `<section class="card pan corto">${tit?`<p class="corto-t">${inline(tit)}</p>`:""}<ul class="corto-l">${lis}</ul>${m?`<p class="more">Firmado al cerrar la sesión del ${fmtD(m[1])}.</p>`:""}</section>`;
}

`;
