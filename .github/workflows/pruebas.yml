# Corre las pruebas en cada pull request contra main.
# Los scripts del plugin corren en la computadora de cada persona con el Python que tenga (3.9 en un Mac de serie,
# 3.10 en la consola de la app), y la 1.23.0 salió con un cierre que no arrancaba con ellos. Por eso las pruebas de
# sesión y los scripts del tablero que no necesitan navegador corren con 3.9, 3.10 y el actual, y probar_compila.py tiene
# siempre python3.9 y python3.10 a mano.
# El tablero (probar.sh) corre una vez, con el Python actual, Node 22 y Playwright con Chromium.
# Las acciones van fijadas por commit, con su etiqueta al lado: una etiqueta que se mueve no cambia lo que corre (paso 0).
name: Pruebas
# Además corre cada lunes sobre main, sin pull request: un cambio del entorno de GitHub (el 2026-11-03, ubuntu-latest sin
# Python 3.9) se ve antes del siguiente pull request, como un issue y no como una sorpresa (metodología, sección 5).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 13 * * 1"   # lunes, 07:41 en Ciudad de México
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secretos:
    # cada archivo del repositorio, que es público: un secreto que entre aquí queda expuesto. Un falso positivo va en
    # .secrets.baseline (detect-secrets scan --disable-plugin HexHighEntropyString --baseline .secrets.baseline, y
    # luego audit; regenerarla sin --disable-plugin devuelve el detector hexadecimal), nunca apagando la comprobación. Si
    # falla con «git add .secrets.baseline», un secreto ya aceptado cambió de línea: se sube la baseline que reescribió. Las huellas hexadecimales del paquete metido en los scripts cambian
    # con cada versión: por eso ese detector va apagado, y los demás (claves, tokens, contraseñas) no.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Secretos
        run: |  # pragma: allowlist secret (la línea de abajo instala detect-secrets, no es un secreto)
          pip install detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --disable-plugin HexHighEntropyString --baseline .secrets.baseline
  sesion:
    runs-on: ubuntu-24.04   # ubuntu-latest pasó a 26.04 el 2026-11-03 y setup-python no tiene ahí el 3.9
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # ningún paso empuja: lo que se instala no ve el token
      # el último de la lista queda como python3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: |
            3.9
            3.10
            ${{ matrix.python }}
      - name: Los scripts compilan con un Python viejo
        run: python3 pruebas/probar_compila.py
      # context-core (paso 0 de la versión alojada): sus pruebas con cada Python de la matriz, y que la copia metida en los
      # ocho scripts sea la del paquete
      - name: context-core
        run: |
          python3 -m unittest discover -s packages/context-core/tests -v
          python3 packages/context-core/inline.py --check
      - name: Pruebas de sesión
        run: |
          python3 --version
          fallos=0
          for f in pruebas/sesion/probar_*.py; do
            echo "== $f"
            python3 "$f" || fallos=$((fallos + 1))
          done
          [ "$fallos" -eq 0 ] || { echo "$fallos prueba(s) de sesión fallaron"; exit 1; }
      # los scripts del tablero que no necesitan navegador, con el mismo Python: aplicar_cambios.py corre en la computadora
      # de cada persona, y datos.py, plan_subida.py y barrido.py en la tarea
      - name: Scripts del tablero
        run: |
          fallos=0
          for f in pruebas/tablero/probar_datos.py pruebas/tablero/probar_plan.py pruebas/tablero/probar_barrido.py; do
            echo "== $f"
            python3 "$f" || fallos=$((fallos + 1))
          done
          copia="$RUNNER_TEMP/raiz-aplicar"; rm -rf "$copia"; cp -R pruebas/tablero/raiz "$copia"
          echo "== pruebas/tablero/aplicar.py"
          python3 pruebas/tablero/aplicar.py plugins/memoria/skills/tablero/aplicar_cambios.py "$copia" || fallos=$((fallos + 1))
          [ "$fallos" -eq 0 ] || { echo "$fallos prueba(s) del tablero fallaron"; exit 1; }
  tablero:
    runs-on: ubuntu-24.04   # ubuntu-latest pasó a 26.04 el 2026-11-03 y setup-python no tiene ahí el 3.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # ningún paso empuja: lo que se instala no ve el token
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: |
            3.9
            3.10
            3.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # Playwright fuera del repositorio; NODE_PATH para que lo encuentren probar.sh y recorrer.js. Con versión fija: el
      # 2026-11-05 playwright 1.65.0 salió antes que su playwright-core y la instalación sin versión dejó de funcionar
      - name: Playwright con Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tablero
        run: |
          node -e "require('playwright')" || { echo "Playwright no se carga: probar.sh se saltaría el recorrido"; exit 1; }
          bash pruebas/tablero/probar.sh /tmp/salida
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: capturas-tablero
          path: /tmp/salida/capturas
          if-no-files-found: ignore
  aviso:
    # la corrida de los lunes que falla abre un issue (o comenta el que ya está abierto con el mismo título)
    needs: [secretos, sesion, tablero]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir o comentar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITULO: "Las pruebas de los lunes fallan en main"
        run: |
          cuerpo="La corrida semanal sobre main falló: $RUN_URL. Si nadie cambió el código, cambió el entorno (runner, Python, Node, Playwright)."
          numero="$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and .title == env.TITULO) | .number' | head -n 1)"
          if [ -n "$numero" ]; then
            gh api "repos/$REPO/issues/$numero/comments" -f body="$cuerpo" --silent
          else
            gh api "repos/$REPO/issues" -f title="$TITULO" -f body="$cuerpo" --silent
          fi
