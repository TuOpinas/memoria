# Corre las pruebas en cada pull request contra main.
# Los scripts del plugin corren en la computadora de cada persona con el Python que tenga (3.9 en un Mac de serie,
# 3.10 en la consola de la app), y la 1.23.0 salió con un cierre que no arrancaba con ellos. Por eso las pruebas de
# sesión y los scripts del tablero que no necesitan navegador corren con 3.9, 3.10 y el actual, y probar_compila.py tiene
# siempre python3.9 y python3.10 a mano.
# El tablero (probar.sh) corre una vez, con el Python actual, Node 22 y Playwright con Chromium.
# Las acciones van fijadas por commit, con su etiqueta al lado: una etiqueta que se mueve no cambia lo que corre (paso 0).
name: Pruebas
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sesion:
    runs-on: ubuntu-24.04   # ubuntu-latest pasó a 26.04 el 2026-11-03 y setup-python no tiene ahí el 3.9
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # el último de la lista queda como python3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: |
            3.9
            3.10
            ${{ matrix.python }}
      - name: Los scripts compilan con un Python viejo
        run: python3 pruebas/probar_compila.py
      # context-core (paso 0 de la versión alojada): sus pruebas con cada Python de la matriz, y que la copia metida en los
      # ocho scripts sea la del paquete
      - name: context-core
        run: |
          python3 -m unittest discover -s packages/context-core/tests -v
          python3 packages/context-core/inline.py --check
      - name: Pruebas de sesión
        run: |
          python3 --version
          fallos=0
          for f in pruebas/sesion/probar_*.py; do
            echo "== $f"
            python3 "$f" || fallos=$((fallos + 1))
          done
          [ "$fallos" -eq 0 ] || { echo "$fallos prueba(s) de sesión fallaron"; exit 1; }
      # los scripts del tablero que no necesitan navegador, con el mismo Python: aplicar_cambios.py corre en la computadora
      # de cada persona, y datos.py, plan_subida.py y barrido.py en la tarea
      - name: Scripts del tablero
        run: |
          fallos=0
          for f in pruebas/tablero/probar_datos.py pruebas/tablero/probar_plan.py pruebas/tablero/probar_barrido.py; do
            echo "== $f"
            python3 "$f" || fallos=$((fallos + 1))
          done
          copia="$RUNNER_TEMP/raiz-aplicar"; rm -rf "$copia"; cp -R pruebas/tablero/raiz "$copia"
          echo "== pruebas/tablero/aplicar.py"
          python3 pruebas/tablero/aplicar.py plugins/memoria/skills/tablero/aplicar_cambios.py "$copia" || fallos=$((fallos + 1))
          [ "$fallos" -eq 0 ] || { echo "$fallos prueba(s) del tablero fallaron"; exit 1; }
  tablero:
    runs-on: ubuntu-24.04   # ubuntu-latest pasó a 26.04 el 2026-11-03 y setup-python no tiene ahí el 3.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: |
            3.9
            3.10
            3.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      # Playwright fuera del repositorio; NODE_PATH para que lo encuentren probar.sh y recorrer.js. Con versión fija: el
      # 2026-11-05 playwright 1.65.0 salió antes que su playwright-core y la instalación sin versión dejó de funcionar
      - name: Playwright con Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.64.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Tablero
        run: |
          node -e "require('playwright')" || { echo "Playwright no se carga: probar.sh se saltaría el recorrido"; exit 1; }
          bash pruebas/tablero/probar.sh /tmp/salida
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: capturas-tablero
          path: /tmp/salida/capturas
          if-no-files-found: ignore
