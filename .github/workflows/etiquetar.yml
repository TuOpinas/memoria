# Etiqueta cada versión del plugin al llegar a main, sin que nadie lo haga a mano.
# Las sesiones descargan los scripts del tablero desde la etiqueta v<versión> (skill tablero,
# «Los archivos del plugin en la computadora»); sin ella caen a main, que deja de coincidir
# en cuanto main avanza. Si la etiqueta ya existe, no hace nada.
name: Etiquetar la versión
on:
  push:
    branches: [main]
    paths: [plugins/memoria/.claude-plugin/plugin.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear la etiqueta si falta
        run: |
          VERSION="$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' plugins/memoria/.claude-plugin/plugin.json | head -n 1)"
          [ -n "$VERSION" ] || { echo "No encuentro la versión en plugin.json"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION ya existe"; exit 0
          fi
          # la etiqueta va al último commit que cambió plugin.json, que es el de la publicación
          COMMIT="$(git log -1 --format=%H -- plugins/memoria/.claude-plugin/plugin.json)"
          git tag "v$VERSION" "$COMMIT"
          git push origin "v$VERSION"
          echo "Creada v$VERSION en $COMMIT"
