# Las pruebas de aceptación de memoria (kit de desarrollo del plugin, 1.27): la plantilla del kit adaptada a este
# repositorio (decisiones shared-memory/plugin-memoria#2026-11-22-2, -3 y -9). Las pruebas son scripts con su propio
# ejecutor (pruebas/aceptacion/correr.py), no pytest, y una pieza que hace el modelo, sin script, se prueba con un eval que
# no entra en este check: cuesta tokens y no siempre da lo mismo, y corre con la etiqueta «evals».
#
# Tres clases de archivo:
# - escenarios: pruebas/aceptacion/<pieza>_*.py, pruebas/aceptacion/RESUMEN.md y pruebas/evals/escenarios/NN-<pieza>-….md.
#   Entran en su propio pull request («Escenarios · P01[ + P02]»), directo a main, y solo los de las piezas de su título.
# - kit: este archivo, CLAUDE.md, pruebas/aceptacion/correr.py y flujo.py, y su prueba (pruebas/sesion/
#   probar_aceptacion_memoria.py). Van en su propio pull request («Kit · »), sin nada más.
# - lo demás, también el resto de pruebas/evals/, va con cualquier pull request.
# La lista de piezas activas (ACTIVAS) no pierde ninguna pieza, salvo la que saca el pull request de escenarios que cambia
# sus pruebas, o su reversión. Un pull request que nombra una pieza con pruebas la tiene en la lista.
#
# Lo que este check no cierra: el código que las pruebas importan corre en su proceso y puede hacer trampa, y el workflow
# que juzga un pull request es el que ese pull request trae; un pull request que lo cambia va solo, como «Kit · », y lo
# une quien acepta (CLAUDE.md, regla 1). Eso lo ven quien une, la verificación sobre la candidata y el seguimiento.
# Las acciones van fijadas por commit, con su etiqueta al lado, como en pruebas.yml.
name: pruebas de aceptación
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: aceptacion-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  ACEPTACION: pruebas/aceptacion
  ESCENARIOS_EVALS: pruebas/evals/escenarios
  ACTIVAS: .github/piezas-activas.txt
jobs:
  aparte:
    name: pruebas de aceptación
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Cada cosa en su pull request, y la lista de piezas activas no pierde ninguna
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITULO: ${{ github.event.pull_request.title }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -e
          este="${GITHUB_WORKFLOW_REF%@*}"; este="${este#*/*/}"
          [ -n "$este" ] || este=".github/workflows/pruebas-aceptacion.yml"
          COMUN="$(git merge-base "$BASE" "$HEAD")"
          ident='^[A-Za-z]+[0-9]+$'
          # el título: «Kit · …», «Escenarios · P01[ + P02][ · …]», «Revert "…"» o «P01[ + P02] · …»
          tipo=otro; t="$TITULO"
          if [[ "$t" == "Kit · "* ]]; then tipo=kit
          elif [[ "$t" == "Escenarios · "* ]]; then tipo=escenarios; t="${t#Escenarios · } · "
          elif [[ "$t" == 'Revert "Escenarios · '* ]]; then tipo=escenarios; t="${t#Revert \"Escenarios · }"; t="${t%%[\"(]*}"; t="${t% · *} · "
          elif [[ "$t" == 'Revert "'* ]]; then tipo=revert; t="${t#Revert \"}"
          elif [[ "$t" =~ ^[A-Za-z]+[0-9]+ ]]; then tipo=pieza; fi
          piezas=" "
          if [ "$tipo" != kit ] && [ "$tipo" != otro ]; then
            if [[ "$t" != *" · "* ]]; then
              echo "::error::El título empieza por una pieza pero no sigue la forma «P01 · …» o «P01 + P02 · …»: «$TITULO»."; exit 1
            fi
            IFS='+' read -r -a ps <<< "${t%% · *}"
            for p in "${ps[@]}"; do
              p="${p//[[:space:]]/}"
              [[ "$p" =~ $ident ]] || { echo "::error::«$p» no es un identificador de pieza (título «$TITULO»)."; exit 1; }
              piezas="$piezas${p^^} "
            done
          fi
          # qué cambia, por clase
          clase() {  # kit, lista, escenario, ajeno (en la carpeta de aceptación sin ser de nadie) o fuera
            local f="$1" b="${1##*/}"
            case "$f" in "$este"|CLAUDE.md|"$ACEPTACION/correr.py"|"$ACEPTACION/flujo.py"|pruebas/sesion/probar_aceptacion_memoria.py) echo kit; return;; esac
            [ "$f" = "$ACTIVAS" ] && { echo lista; return; }
            if [[ "$f" == "$ACEPTACION/"* ]]; then
              if [ "$f" = "$ACEPTACION/RESUMEN.md" ] || [[ "$b" =~ ^[A-Za-z]+[0-9]+_.*\.py$ ]]; then echo escenario; else echo ajeno; fi; return
            fi
            if [[ "$f" == "$ESCENARIOS_EVALS/"* && "$b" =~ ^[0-9]+-[A-Za-z]+[0-9]+-.*\.md$ ]]; then echo escenario; return; fi
            echo fuera
          }
          de_pieza() {  # la pieza de un archivo de escenarios, o nada
            local b="${1##*/}"
            if [[ "$1" == "$ACEPTACION/"* ]]; then [[ "$b" =~ ^([A-Za-z]+[0-9]+)_.*\.py$ ]] && echo "${BASH_REMATCH[1]^^}"
            else [[ "$b" =~ ^[0-9]+-([A-Za-z]+[0-9]+)-.*\.md$ ]] && echo "${BASH_REMATCH[1]^^}"; fi
            return 0
          }
          git -c core.quotepath=off diff --name-only --no-renames -z "$COMUN" "$HEAD" > "$RUNNER_TEMP/cambios"
          kit=0; esc=0; fuera=0; lista=0; flujos=1; tocadas=" "; ajenos=""
          while IFS= read -r -d '' f; do
            [[ "$f" == .github/workflows/* ]] || flujos=0
            case "$(clase "$f")" in
              kit) kit=$((kit + 1));;
              lista) lista=1;;
              escenario) esc=$((esc + 1)); p="$(de_pieza "$f")"
                         if [ -n "$p" ]; then [[ "$tocadas" == *" $p "* ]] || tocadas="$tocadas$p "; fi;;
              ajeno) ajenos="$ajenos $f";;
              *) fuera=$((fuera + 1));;
            esac
          done < "$RUNNER_TEMP/cambios"
          echo "Título: $tipo, piezas:$piezas. Cambian $kit del kit, $esc de escenarios (piezas:$tocadas), la lista: $lista, y $fuera de fuera."
          if [ -n "$ajenos" ]; then
            echo "::error::En $ACEPTACION/ solo van los archivos <pieza>_*.py, RESUMEN.md y los del kit (correr.py, flujo.py):$ajenos"; exit 1
          fi
          bot=0
          if [ "$AUTOR" = "dependabot[bot]" ] && [ "$flujos" = 1 ]; then
            echo "Dependabot solo sube acciones de los workflows: no se le aplican las reglas del kit."; bot=1; kit=0
          fi
          if [ "$kit" -gt 0 ] && { [ "$tipo" != kit ] || [ "$esc" -gt 0 ] || [ "$fuera" -gt 0 ] || [ "$lista" = 1 ]; }; then
            echo "::error::Este pull request cambia el kit (el workflow, CLAUDE.md, correr.py, flujo.py o su prueba): va solo, en un pull request «Kit · »."; exit 1
          fi
          if [ "$tipo" = kit ] && [ "$kit" = 0 ]; then
            echo "::error::El título dice «Kit · » y no cambia nada del kit."; exit 1
          fi
          if [ "$esc" -gt 0 ] && { [ "$tipo" != escenarios ] || [ "$fuera" -gt 0 ]; }; then
            echo "::error::Este pull request cambia escenarios: van solos, en un pull request «Escenarios · <pieza>», sin código."; exit 1
          fi
          if [ "$tipo" = escenarios ]; then
            for p in $tocadas; do
              [[ "$piezas" == *" $p "* ]] || { echo "::error::Este pull request de escenarios cambia pruebas de $p, que no está en su título."; exit 1; }
            done
          fi
          # la lista es un archivo normal y no pierde ninguna pieza
          modo() { git ls-tree "$1" -- "$ACTIVAS" | awk '{print $1}'; }
          if [ -n "$(modo "$HEAD")" ] && [ "$(modo "$HEAD")" != 100644 ]; then
            echo "::error::$ACTIVAS no es un archivo normal."; exit 1
          fi
          leer() { git show "$1:$ACTIVAS" 2>/dev/null | sed 's/#.*//; s/[[:space:]]//g' | grep -E "$ident" | tr 'a-z' 'A-Z' || true; }
          antes="$(leer "$COMUN")"; ahora=" $(leer "$HEAD" | tr '\n' ' ')"
          for p in $antes; do
            [[ "$ahora" == *" $p "* ]] && continue
            if [ "$tipo" = escenarios ] && [[ "$tocadas" == *" $p "* ]]; then
              echo "$p sale de la lista mientras cambian sus escenarios; el próximo pull request de versión la vuelve a añadir."; continue
            fi
            asunto="${TITULO#Revert \"}"; asunto="${asunto%\"}"
            if [ "$tipo" = revert ] && [[ "$piezas" == *" $p "* ]] && git log --format=%s "$BASE" | grep -qxF -- "$asunto"; then
              echo "::warning::La reversión saca $p de la lista: sus pruebas dejan de contar hasta que otro pull request de $p la vuelva a añadir."; continue
            fi
            echo "::error::Este pull request quita $p de $ACTIVAS: sus pruebas dejarían de contar. Solo la saca el pull request de escenarios que cambia sus pruebas («Escenarios · $p») o la reversión del pull request que la añadió."; exit 1
          done
          # una pieza activa cuyas pruebas cambian sale de la lista en ese mismo pull request
          for p in $tocadas; do
            if [[ "$ahora" == *" $p "* ]]; then
              echo "::error::Este pull request cambia las pruebas de $p, que está activa: sácala de $ACTIVAS en este mismo pull request; el próximo de versión la vuelve a añadir cuando las cumpla."; exit 1
            fi
          done
          echo "${ahora}" > "$RUNNER_TEMP/activas"
          echo "$tipo" > "$RUNNER_TEMP/tipo"; echo "$piezas" > "$RUNNER_TEMP/piezas"; echo "$tocadas" > "$RUNNER_TEMP/tocadas"
      - name: Prepara el entorno
        run: python3 -I -m pip install -q pytest==8.3.5   # las pruebas de P01–P03 corren la plantilla del kit, que usa pytest
      - name: Pasan las pruebas de las piezas activas, y fallan las de un pull request de escenarios
        env:
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          tipo="$(cat "$RUNNER_TEMP/tipo" 2>/dev/null || echo otro)"
          piezas="$(cat "$RUNNER_TEMP/piezas" 2>/dev/null || echo ' ')"
          activas="$(cat "$RUNNER_TEMP/activas" 2>/dev/null || echo ' ')"
          [ -n "${activas// /}" ] || activas=" "
          # sobre lo que se va a unir (el checkout): cada pieza con pruebas que el título nombra está en la lista
          if [ "$tipo" = pieza ]; then
            for p in $piezas; do
              if compgen -G "$ACEPTACION/${p}_*.py" > /dev/null && [[ "$activas" != *" $p "* ]]; then
                echo "::error::$p tiene pruebas de aceptación en $ACEPTACION/ y no está en $ACTIVAS: su pull request la añade."; exit 1
              fi
            done
          fi
          sueltas=""
          for f in "$ACEPTACION"/*_*.py; do
            [ -e "$f" ] || continue
            b="${f##*/}"; [[ "$b" =~ ^([A-Za-z]+[0-9]+)_ ]] || continue
            p="${BASH_REMATCH[1]^^}"
            [[ "$activas" == *" $p "* || " $sueltas " == *" $p "* ]] || sueltas="$sueltas $p"
          done
          [ -z "$sueltas" ] || echo "::warning::Piezas con pruebas que aún no están activas:$sueltas."
          if [ "$activas" != " " ]; then
            [ -f "$ACEPTACION/correr.py" ] || { echo "::error::Hay piezas activas y no está $ACEPTACION/correr.py."; exit 1; }
            echo "== Piezas activas:$activas: sus pruebas tienen que pasar"
            set +e; python3 -I "$ACEPTACION/correr.py" $activas; rc=$?; set -e
            if [ "$rc" != 0 ]; then
              echo "::error::Las pruebas de aceptación de las piezas activas no pasan (correr.py salió con $rc: 1 es que fallan o se saltan, 2 que no se pudieron correr)."; exit 1
            fi
          fi
          [ "$tipo" = escenarios ] || exit 0
          for p in $piezas; do
            [[ "$activas" == *" $p "* ]] && continue
            evals=()
            for f in "$ESCENARIOS_EVALS"/*-"$p"-*.md; do [ -e "$f" ] && evals+=("$(basename "$f" .md)"); done
            if compgen -G "$ACEPTACION/${p}_*.py" > /dev/null; then
              echo "== $p: sus pruebas tienen que fallar, y solo porque la pieza aún no las cumple"
              set +e; python3 -I "$ACEPTACION/correr.py" "$p" | tee "$RUNNER_TEMP/salida"; rc=$?; set -e
              ultima="$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/salida" | tail -n 1)"
              if [ "$rc" = 0 ]; then echo "::error::Las pruebas de $p ya pasan: no comprueban lo que piden sus escenarios."; exit 1; fi
              if [ "$rc" != 1 ]; then echo "::error::Las pruebas de $p no se pudieron correr (correr.py salió con $rc)."; exit 1; fi
              if [[ ! "$ultima" =~ ([0-9]+)\ fallan\ ·\ ([0-9]+)\ saltadas ]] || [ "${BASH_REMATCH[1]}" = 0 ] || [ "${BASH_REMATCH[2]}" != 0 ]; then
                echo "::error::Las pruebas de $p tienen que fallar, no saltarse: «$ultima»."; exit 1
              fi
            fi
            for e in "${evals[@]}"; do
              if ! printf '%s\n' "$CUERPO" | grep -E '^[-* ]*Evals:' | grep -qw -- "$e"; then
                echo "::error::La prueba de $p es el eval $e, que corre con la etiqueta «evals»: añade a la descripción la línea «Evals: $e» y comprueba que falla antes de unir."; exit 1
              fi
              echo "::notice::La prueba de $p es el eval $e: corre con la etiqueta «evals» y tiene que fallar antes de unir."
            done
            if ! compgen -G "$ACEPTACION/${p}_*.py" > /dev/null && [ "${#evals[@]}" = 0 ]; then
              if grep -qE "^$ACEPTACION/${p}_|^$ESCENARIOS_EVALS/[0-9]+-${p}-" <(tr '\0' '\n' < "$RUNNER_TEMP/cambios"); then
                echo "Los escenarios de $p se retiran."
              else
                echo "::error::$p no tiene pruebas: ni $ACEPTACION/${p}_*.py ni un eval $ESCENARIOS_EVALS/NN-$p-….md."; exit 1
              fi
            fi
          done
